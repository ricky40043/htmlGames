<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#07111d"><title>注音挑戰</title>
<style>
:root{--cyan:#46e6ff;--blue:#4d7cff;--violet:#a66cff;--panel:rgba(10,22,38,.84);--line:rgba(255,255,255,.12);--muted:#9fb0c3}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 18% 12%,rgba(70,230,255,.18),transparent 30%),radial-gradient(circle at 82% 18%,rgba(166,108,255,.2),transparent 32%),linear-gradient(145deg,#050a12,#0b1524 48%,#090812);overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(circle,rgba(255,255,255,.15) 1px,transparent 1px);background-size:28px 28px;opacity:.16}.wrap{position:relative;max-width:820px;margin:auto;padding:24px 18px 38px}.top{text-align:center}.top:before{content:"WORD CORE";display:inline-block;color:var(--cyan);font-size:.72rem;font-weight:900;letter-spacing:.2em;padding:6px 12px;border:1px solid rgba(70,230,255,.35);border-radius:999px;background:rgba(70,230,255,.07)}h1{font-size:clamp(2rem,7vw,3.8rem);margin:12px 0 18px;letter-spacing:-.04em;text-shadow:0 0 30px rgba(70,230,255,.25)}.card{position:relative;background:linear-gradient(145deg,rgba(14,31,51,.94),rgba(8,16,31,.9));border:1px solid var(--line);border-radius:28px;padding:24px;margin-bottom:18px;box-shadow:0 26px 70px rgba(0,0,0,.4),inset 0 1px rgba(255,255,255,.06);backdrop-filter:blur(18px);overflow:hidden}.card:before{content:"";position:absolute;top:0;left:10%;right:10%;height:3px;background:linear-gradient(90deg,transparent,var(--cyan),var(--violet),transparent)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.grid>div{padding:13px;border-radius:18px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07)}label{display:block;color:var(--muted);font-size:.82rem;font-weight:850;margin-bottom:7px}input,select,button{width:100%;min-height:50px;border-radius:15px;border:1px solid rgba(255,255,255,.12);background:rgba(3,9,18,.72);color:#fff;padding:12px 14px;font-size:1rem;outline:none;transition:.2s}input:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 4px rgba(70,230,255,.12)}button{border:0;cursor:pointer;font-weight:900;letter-spacing:.02em;transition:.18s;box-shadow:0 8px 24px rgba(0,0,0,.2)}button:active{transform:translateY(2px) scale(.99)}.primary{background:linear-gradient(135deg,var(--cyan),var(--blue));color:#03101c}.ghost{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)}.hidden{display:none!important}.center{text-align:center}.muted{color:var(--muted)}#progress{display:inline-flex;padding:8px 14px;border-radius:999px;background:rgba(70,230,255,.08);border:1px solid rgba(70,230,255,.22);color:var(--cyan);font-weight:900}.question-shell{position:relative;margin:32px auto;min-height:300px;display:grid;place-items:center}.question-shell:before,.question-shell:after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(70,230,255,.17);width:280px;height:280px;animation:spin 14s linear infinite}.question-shell:after{width:230px;height:230px;border-color:rgba(166,108,255,.2);animation-direction:reverse;animation-duration:9s}.big{position:relative;z-index:2;font-size:clamp(3.2rem,14vw,7.4rem);font-weight:1000;line-height:1.1;letter-spacing:.08em;background:linear-gradient(180deg,#fff,#87ecff 60%,#a66cff);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 26px rgba(70,230,255,.27));animation:float 3s ease-in-out infinite}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.wide{grid-column:1/-1}#history{display:grid;gap:10px;padding-left:0;counter-reset:item}#history li{list-style:none;counter-increment:item;padding:14px 16px;border-radius:15px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);font-size:1.25rem}#history li:before{content:counter(item);display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;margin-right:10px;background:linear-gradient(135deg,var(--cyan),var(--violet));color:#07111d;font-size:.8rem;font-weight:900}@keyframes spin{to{transform:rotate(360deg)}}@keyframes float{50%{transform:translateY(-8px)}}@media(max-width:560px){.wrap{padding:14px 12px}.card{padding:18px;border-radius:23px}.grid{grid-template-columns:1fr}.question-shell{min-height:260px}.question-shell:before{width:235px;height:235px}.question-shell:after{width:195px;height:195px}.actions{grid-template-columns:1fr}.wide{grid-column:auto}}
</style>
</head>
<body><div class="wrap"><div class="top"><h1>ㄅ 注音挑戰</h1></div>
<section id="setup" class="card"><div class="grid"><div><label>題數</label><input id="total" type="number" min="1" max="100" value="10"></div><div><label>字數</label><select id="length"><option value="2">2 字</option><option value="3" selected>3 字</option><option value="4">4 字</option><option value="5">5 字</option><option value="random">隨機 2～5 字</option></select></div></div><button id="start" class="primary" style="margin-top:16px">開始出題</button></section>
<section id="game" class="card hidden center"><div id="progress"></div><div class="question-shell"><div id="question" class="big"></div></div><div class="actions"><button id="prev" class="ghost">上一題</button><button id="reroll" class="ghost">重新抽題</button><button id="next" class="primary wide">下一題（空白鍵）</button><button id="reset" class="ghost wide">重新開始</button></div></section>
<section id="done" class="card hidden"><h2>本局題目紀錄</h2><ol id="history"></ol><button onclick="location.reload()" class="primary">再玩一次</button></section></div>
<script>const $=id=>document.getElementById(id),symbols='ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙ'.split('');let qs=[],idx=0;function make(len){const pool=[...symbols];for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}return pool.slice(0,len).join('　')}function render(){$('progress').textContent=`ROUND ${idx+1} / ${qs.length}`;$('question').textContent=qs[idx];$('prev').disabled=idx===0}function start(){const n=Math.max(1,Math.min(100,+$('total').value));localStorage.bopoSettings=JSON.stringify({total:n,length:$('length').value});qs=Array.from({length:n},()=>{const l=$('length').value==='random'?2+Math.floor(Math.random()*4):+$('length').value;return make(l)});idx=0;$('setup').classList.add('hidden');$('game').classList.remove('hidden');render()}function next(){if(idx<qs.length-1){idx++;render()}else{$('game').classList.add('hidden');$('done').classList.remove('hidden');$('history').innerHTML=qs.map(q=>`<li>${q}</li>`).join('')}}$('start').onclick=start;$('next').onclick=next;$('prev').onclick=()=>{if(idx>0){idx--;render()}};$('reroll').onclick=()=>{qs[idx]=make(qs[idx].split('　').length);render()};$('reset').onclick=()=>location.reload();try{const s=JSON.parse(localStorage.bopoSettings||'{}');if(s.total)$('total').value=s.total;if(s.length)$('length').value=s.length}catch(e){}addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&!['INPUT','TEXTAREA','SELECT','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();next()}if(e.key==='ArrowLeft'&&!e.repeat)$('prev').click();if(e.key.toLowerCase()==='r'&&!e.repeat)$('reroll').click()});</script></body></html>
