<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#06101c"><title>注音挑戰</title><style>:root{--c:#43ebff;--b:#4b78ff;--v:#b05dff;--m:#9fb1c5}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050911;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow-x:hidden;background:radial-gradient(circle at 16% 10%,#43ebff28,transparent 30%),radial-gradient(circle at 84% 12%,#b05dff30,transparent 32%),linear-gradient(145deg,#040911,#0a1728 52%,#090712)}#fx{position:fixed;inset:0;z-index:0;pointer-events:none}.scan{position:fixed;inset:-45%;z-index:0;pointer-events:none;background:linear-gradient(112deg,transparent 43%,#43ebff0b 47%,#fff4 50%,#b05dff0c 53%,transparent 57%);animation:scan 8s linear infinite}.wrap{position:relative;z-index:2;max-width:850px;margin:auto;padding:22px 16px 42px}.top{text-align:center}.top:before{content:"PHONETIC CORE";display:inline-block;padding:7px 14px;border:1px solid #43ebff60;border-radius:999px;color:var(--c);font-size:.72rem;font-weight:1000;letter-spacing:.21em;background:#43ebff0d;box-shadow:0 0 24px #43ebff28}h1{font-size:clamp(2.2rem,8vw,4.6rem);margin:12px 0 18px;text-shadow:0 0 20px #43ebff88,0 0 55px #b05dff55}.card{position:relative;overflow:hidden;background:linear-gradient(145deg,#10213aeb,#080f1eeb);border:1px solid #ffffff20;border-radius:30px;padding:24px;margin:18px 0;box-shadow:0 30px 90px #0009,0 0 55px #43ebff15,inset 0 1px #fff2;backdrop-filter:blur(20px)}.card:before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,transparent,var(--c),var(--v),transparent);filter:drop-shadow(0 0 10px var(--c))}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.grid>div{padding:13px;border-radius:18px;background:#ffffff08;border:1px solid #ffffff12}label{display:block;color:var(--m);font-size:.82rem;font-weight:900;margin-bottom:7px}input,select,button{width:100%;min-height:50px;border-radius:15px;border:1px solid #ffffff1e;background:#050b15c7;color:#fff;padding:12px 14px;font-size:1rem;outline:none}input:focus,select:focus{border-color:var(--c);box-shadow:0 0 0 4px #43ebff22,0 0 24px #43ebff20}button{cursor:pointer;border:0;font-weight:1000;transition:.16s;box-shadow:0 9px 26px #0005}button:active{transform:translateY(2px) scale(.985)}.primary{background:linear-gradient(135deg,var(--c),var(--b));color:#03101b}.ghost{background:#ffffff0c;border:1px solid #ffffff1e}.hidden{display:none!important}.center{text-align:center}#progress{display:inline-flex;padding:8px 14px;border-radius:999px;background:#43ebff12;border:1px solid #43ebff40;color:var(--c);font-weight:1000}.question-shell{position:relative;min-height:330px;margin:25px auto;display:grid;place-items:center;isolation:isolate}.question-shell:before,.question-shell:after{content:"";position:absolute;border-radius:50%;width:290px;height:290px;border:2px dashed #43ebff55;box-shadow:0 0 35px #43ebff22;animation:spin 10s linear infinite}.question-shell:after{width:235px;height:235px;border-color:#b05dff66;animation-direction:reverse;animation-duration:7s}.core{position:absolute;width:185px;height:185px;border-radius:50%;background:radial-gradient(circle,#43ebff22,#0a1425 65%);box-shadow:0 0 70px #43ebff33,inset 0 0 45px #b05dff22;animation:pulse 2s ease-in-out infinite}.big{position:relative;z-index:2;font-size:clamp(3.3rem,14vw,7.6rem);font-weight:1000;letter-spacing:.08em;background:linear-gradient(#fff,#76efff 58%,#bd7cff);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 28px #43ebff66);animation:float 2.8s ease-in-out infinite}.question-shell.change{animation:warp .42s ease}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.wide{grid-column:1/-1}#history{display:grid;gap:10px;padding:0;counter-reset:item}#history li{list-style:none;counter-increment:item;padding:15px 17px;border-radius:16px;background:#ffffff08;border:1px solid #ffffff14;font-size:1.3rem;box-shadow:inset 0 0 20px #43ebff08}#history li:before{content:counter(item);display:inline-grid;place-items:center;width:31px;height:31px;border-radius:50%;margin-right:10px;background:linear-gradient(135deg,var(--c),var(--v));color:#06111e;font-size:.8rem;font-weight:1000}.electric:before{content:"";position:fixed;inset:0;z-index:4;pointer-events:none;background:repeating-linear-gradient(120deg,transparent 0 47%,#fff 48%,#43ebff 49%,transparent 50%);mix-blend-mode:screen;opacity:.2;animation:zap .35s ease}@keyframes scan{to{transform:translateX(45%)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.06);box-shadow:0 0 100px #43ebff55,inset 0 0 55px #b05dff33}}@keyframes float{50%{transform:translateY(-9px)}}@keyframes warp{0%{transform:scale(.82);filter:blur(8px)}70%{transform:scale(1.07)}100%{transform:scale(1)}}@keyframes zap{to{opacity:0;transform:translateX(8%)}}@media(max-width:560px){.wrap{padding:14px 11px 28px}.card{padding:18px;border-radius:23px}.grid,.actions{grid-template-columns:1fr}.wide{grid-column:auto}.question-shell{min-height:270px}.question-shell:before{width:235px;height:235px}.question-shell:after{width:190px;height:190px}.core{width:150px;height:150px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important}}</style></head><body><canvas id="fx"></canvas><div class="scan"></div><div class="wrap"><div class="top"><h1>ㄅ 注音挑戰</h1></div><section id="setup" class="card"><div class="grid"><div><label>題數</label><input id="total" type="number" min="1" max="100" value="10"></div><div><label>字數</label><select id="length"><option value="2">2 字</option><option value="3" selected>3 字</option><option value="4">4 字</option><option value="5">5 字</option><option value="random">隨機 2～5 字</option></select></div></div><button id="start" class="primary" style="margin-top:16px">啟動核心</button></section><section id="game" class="card hidden center"><div id="progress"></div><div id="shell" class="question-shell"><div class="core"></div><div id="question" class="big"></div></div><div class="actions"><button id="prev" class="ghost">上一題</button><button id="reroll" class="ghost">重新抽題</button><button id="next" class="primary wide">下一題（空白鍵）</button><button id="reset" class="ghost wide">重新開始</button></div></section><section id="done" class="card hidden"><h2>本局題目紀錄</h2><ol id="history"></ol><button onclick="location.reload()" class="primary">再玩一次</button></section></div><script>const $=id=>document.getElementById(id),symbols='ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙ'.split('');let qs=[],idx=0;const fx=$('fx'),cx=fx.getContext('2d');let pts=[],conf=[];function resize(){fx.width=innerWidth*devicePixelRatio;fx.height=innerHeight*devicePixelRatio;fx.style.width=innerWidth+'px';fx.style.height=innerHeight+'px';cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();for(let i=0;i<(innerWidth<600?28:62);i++)pts.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:.5+Math.random()*1.8,v:.08+Math.random()*.28,a:.12+Math.random()*.4});function burst(n=120){for(let i=0;i<n;i++)conf.push({x:innerWidth/2,y:innerHeight*.27,vx:(Math.random()-.5)*9,vy:-2-Math.random()*6,g:.12+Math.random()*.08,l:70+Math.random()*45,w:3+Math.random()*5,h:6+Math.random()*10,c:`hsl(${Math.random()*360} 90% 62%)`})}(function draw(){cx.clearRect(0,0,innerWidth,innerHeight);for(const p of pts){p.y-=p.v;if(p.y<0){p.y=innerHeight;p.x=Math.random()*innerWidth}cx.globalAlpha=p.a;cx.fillStyle='#fff';cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill()}cx.globalAlpha=1;conf=conf.filter(c=>c.l-->0);for(const c of conf){c.x+=c.vx;c.y+=c.vy;c.vy+=c.g;cx.fillStyle=c.c;cx.fillRect(c.x,c.y,c.w,c.h)}requestAnimationFrame(draw)})();function make(len){const pool=[...symbols];for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}return pool.slice(0,len).join('　')}function effect(){document.body.classList.remove('electric');$('shell').classList.remove('change');void document.body.offsetWidth;document.body.classList.add('electric');$('shell').classList.add('change');setTimeout(()=>document.body.classList.remove('electric'),350)}function render(){effect();$('progress').textContent=`ROUND ${idx+1} / ${qs.length}`;$('question').textContent=qs[idx];$('prev').disabled=idx===0}function start(){const n=Math.max(1,Math.min(100,+$('total').value));localStorage.bopoSettings=JSON.stringify({total:n,length:$('length').value});qs=Array.from({length:n},()=>make($('length').value==='random'?2+Math.floor(Math.random()*4):+$('length').value));idx=0;$('setup').classList.add('hidden');$('game').classList.remove('hidden');render()}function next(){if(idx<qs.length-1){idx++;render()}else{$('game').classList.add('hidden');$('done').classList.remove('hidden');$('history').innerHTML=qs.map(q=>`<li>${q}</li>`).join('');burst()}}$('start').onclick=start;$('next').onclick=next;$('prev').onclick=()=>{if(idx>0){idx--;render()}};$('reroll').onclick=()=>{qs[idx]=make(qs[idx].split('　').length);render()};$('reset').onclick=()=>location.reload();try{const s=JSON.parse(localStorage.bopoSettings||'{}');if(s.total)$('total').value=s.total;if(s.length)$('length').value=s.length}catch(e){}addEventListener('keydown',e=>{if(e.repeat)return;if(e.code==='Space'&&!['INPUT','TEXTAREA','SELECT','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();next()}if(e.key==='ArrowLeft')$('prev').click();if(e.key.toLowerCase()==='r')$('reroll').click()});</script></body></html>
