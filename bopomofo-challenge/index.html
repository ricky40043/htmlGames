<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0d0d14"><title>注音挑戰</title><style>*{box-sizing:border-box}body{margin:0;background:#0d0d14;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}a{color:#8ec5ff}.wrap{max-width:760px;margin:auto;padding:20px}.top{display:flex;justify-content:center;align-items:center;margin-bottom:18px}.card{background:#171721;border:1px solid #29293a;border-radius:20px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{display:block;color:#aaa;font-size:.9rem;margin-bottom:6px}input,select,button{width:100%;min-height:46px;border-radius:12px;border:1px solid #343447;background:#20202d;color:#fff;padding:10px;font-size:1rem}button{cursor:pointer;font-weight:700}.primary{background:#4facfe;color:#111;border:0}.ghost{background:#242433}.hidden{display:none!important}.center{text-align:center}.big{font-size:clamp(3rem,14vw,7rem);font-weight:900;line-height:1.1}.muted{color:#888}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.wide{grid-column:1/-1}@media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{padding:14px}}</style></head><body><div class="wrap"><div class="top"><h1>ㄅ 注音挑戰</h1></div><section id="setup" class="card"><div class="grid"><div><label>題數</label><input id="total" type="number" min="1" max="100" value="10"></div><div><label>字數</label><select id="length"><option value="2">2 字</option><option value="3" selected>3 字</option><option value="4">4 字</option><option value="5">5 字</option><option value="random">隨機 2～5 字</option></select></div></div><button id="start" class="primary" style="margin-top:14px">開始出題</button></section><section id="game" class="card hidden center"><div id="progress" class="muted"></div><div id="question" class="big" style="margin:45px 0"></div><div class="actions"><button id="prev" class="ghost">上一題</button><button id="reroll" class="ghost">重新抽題</button><button id="next" class="primary wide">下一題（空白鍵）</button><button id="reset" class="ghost wide">重新開始</button></div></section><section id="done" class="card hidden"><h2>本局題目紀錄</h2><ol id="history"></ol><button onclick="location.reload()" class="primary">再玩一次</button></section></div><script>const $=id=>document.getElementById(id),symbols='ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙ'.split('');let qs=[],idx=0;function make(len){const pool=[...symbols];for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}return pool.slice(0,len).join('　')}function render(){$('progress').textContent=`第 ${idx+1} / ${qs.length} 題`;$('question').textContent=qs[idx];$('prev').disabled=idx===0}function start(){const n=Math.max(1,Math.min(100,+$('total').value));localStorage.bopoSettings=JSON.stringify({total:n,length:$('length').value});qs=Array.from({length:n},()=>{const l=$('length').value==='random'?2+Math.floor(Math.random()*4):+$('length').value;return make(l)});idx=0;$('setup').classList.add('hidden');$('game').classList.remove('hidden');render()}function next(){if(idx<qs.length-1){idx++;render()}else{$('game').classList.add('hidden');$('done').classList.remove('hidden');$('history').innerHTML=qs.map(q=>`<li>${q}</li>`).join('')}}$('start').onclick=start;$('next').onclick=next;$('prev').onclick=()=>{if(idx>0){idx--;render()}};$('reroll').onclick=()=>{qs[idx]=make(qs[idx].split('　').length);render()};$('reset').onclick=()=>location.reload();try{const s=JSON.parse(localStorage.bopoSettings||'{}');if(s.total)$('total').value=s.total;if(s.length)$('length').value=s.length}catch(e){}addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&!['INPUT','TEXTAREA','SELECT','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();next()}if(e.key==='ArrowLeft'&&!e.repeat)$('prev').click();if(e.key.toLowerCase()==='r'&&!e.repeat)$('reroll').click()});</script></body></html>
