<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#06101c"><title>注音挑戰</title><style>:root{--c:#43ebff;--b:#4b78ff;--v:#b05dff;--g:#ffd75a;--m:#9fb1c5}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050911;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow-x:hidden;background:radial-gradient(circle at 16% 10%,#43ebff28,transparent 30%),radial-gradient(circle at 84% 12%,#b05dff30,transparent 32%),linear-gradient(145deg,#040911,#0a1728 52%,#090712)}#fx{position:fixed;inset:0;z-index:0;pointer-events:none}.beam{position:fixed;inset:-40%;z-index:0;pointer-events:none;background:conic-gradient(from 0deg,transparent 0 38%,#43ebff0d 42%,transparent 47%,#b05dff12 55%,transparent 61%);animation:spin 18s linear infinite}.wrap{position:relative;z-index:2;max-width:920px;margin:auto;padding:22px 16px 42px}.top{text-align:center}.top:before{content:"PHONETIC ARENA";display:inline-block;padding:7px 14px;border:1px solid #43ebff60;border-radius:999px;color:var(--c);font-size:.72rem;font-weight:900;letter-spacing:.21em;background:#43ebff0d;box-shadow:0 0 24px #43ebff28}h1{font-size:clamp(2.2rem,8vw,4.6rem);margin:12px 0 18px;text-shadow:0 0 20px #43ebff88,0 0 55px #b05dff55}.card{position:relative;overflow:hidden;background:linear-gradient(145deg,#10213aeb,#080f1eeb);border:1px solid #ffffff20;border-radius:30px;padding:24px;margin:18px 0;box-shadow:0 30px 90px #0009,0 0 55px #43ebff15,inset 0 1px #fff2;backdrop-filter:blur(20px)}.card:before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,transparent,var(--c),var(--v),transparent)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.grid>div{padding:13px;border-radius:18px;background:#ffffff08;border:1px solid #ffffff12}.wide{grid-column:1/-1}label{display:block;color:var(--m);font-size:.82rem;font-weight:900;margin-bottom:7px}input,select,textarea,button{width:100%;min-height:50px;border-radius:15px;border:1px solid #ffffff1e;background:#050b15c7;color:#fff;padding:12px 14px;font-size:1rem;outline:none}button{cursor:pointer;border:0;font-weight:900;box-shadow:0 9px 26px #0005}.primary{background:linear-gradient(135deg,var(--c),var(--b));color:#03101b}.ghost{background:#ffffff0c;border:1px solid #ffffff1e}.hidden{display:none!important}.center{text-align:center}#progress{display:inline-flex;padding:8px 14px;border-radius:999px;background:#43ebff12;border:1px solid #43ebff40;color:var(--c);font-weight:900}.question-shell{position:relative;min-height:300px;margin:20px auto;display:grid;place-items:center}.question-shell:before,.question-shell:after{content:"";position:absolute;border-radius:50%;width:280px;height:280px;border:2px dashed #43ebff55;animation:spin 10s linear infinite}.question-shell:after{width:225px;height:225px;border-color:#b05dff66;animation-direction:reverse;animation-duration:7s}.core{position:absolute;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,#43ebff22,#0a1425 65%);box-shadow:0 0 70px #43ebff33,inset 0 0 45px #b05dff22;animation:pulse 2s ease-in-out infinite}.big{position:relative;z-index:2;font-size:clamp(3.3rem,14vw,7.6rem);font-weight:1000;letter-spacing:.08em;background:linear-gradient(#fff,#76efff 58%,#bd7cff);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 28px #43ebff66)}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin:20px 0}.player{position:relative;padding:16px;border-radius:20px;background:linear-gradient(145deg,#ffffff0d,#ffffff06);border:1px solid #ffffff18;cursor:pointer;transition:.2s;overflow:hidden}.player:hover{transform:translateY(-4px);border-color:#43ebff88;box-shadow:0 0 30px #43ebff33}.player.locked{pointer-events:none}.player.hit{animation:scorePop .55s ease}.name{font-weight:900;font-size:1.05rem}.score{font-size:2.3rem;font-weight:1000;color:var(--g);text-shadow:0 0 20px #ffd75a88}.plus{position:absolute;inset:0;display:grid;place-items:center;font-size:3rem;font-weight:1000;color:#fff;opacity:0;pointer-events:none}.player.hit .plus{animation:plus 650ms ease}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.winner{font-size:clamp(2.2rem,9vw,5rem);font-weight:1000;color:var(--g);text-shadow:0 0 25px #ffd75aaa,0 0 60px #b05dff88}.podium{display:grid;gap:10px;margin:20px 0}.rank{padding:14px 16px;border:1px solid #ffffff18;border-radius:16px;background:#ffffff08}.electric:before{content:"";position:fixed;inset:0;z-index:4;pointer-events:none;background:repeating-linear-gradient(120deg,transparent 0 47%,#fff 48%,#43ebff 49%,transparent 50%);mix-blend-mode:screen;opacity:.22;animation:zap .35s ease}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.06);box-shadow:0 0 100px #43ebff55}}@keyframes scorePop{40%{transform:scale(1.1);box-shadow:0 0 55px #43ebff88}}@keyframes plus{0%{opacity:0;transform:translateY(20px) scale(.5)}35%{opacity:1}100%{opacity:0;transform:translateY(-55px) scale(1.4)}}@keyframes zap{to{opacity:0;transform:translateX(8%)}}@media(max-width:560px){.wrap{padding:14px 11px 28px}.card{padding:18px;border-radius:23px}.grid,.actions{grid-template-columns:1fr}.wide{grid-column:auto}.question-shell{min-height:250px}.question-shell:before{width:220px;height:220px}.question-shell:after{width:180px;height:180px}.core{width:145px;height:145px}.players{grid-template-columns:repeat(2,1fr)}}</style></head><body><canvas id="fx"></canvas><div class="beam"></div><div class="wrap"><div class="top"><h1>ㄅ 注音挑戰</h1></div><section id="setup" class="card"><div class="grid"><div><label>題數</label><input id="total" type="number" min="1" max="100" value="10"></div><div><label>字數</label><select id="length"><option value="2">2 字</option><option value="3" selected>3 字</option><option value="4">4 字</option><option value="5">5 字</option><option value="random">隨機 2～5 字</option></select></div><div><label>玩家人數</label><input id="count" type="number" min="2" max="10" value="3"></div><div class="wide"><label>玩家名稱（每行一位）</label><textarea id="names" rows="4" placeholder="Ricky&#10;小明&#10;小美"></textarea></div></div><button id="start" class="primary" style="margin-top:16px">啟動競技場</button></section><section id="game" class="card hidden center"><div id="progress"></div><div class="question-shell"><div class="core"></div><div id="question" class="big"></div></div><div id="players" class="players"></div><div class="actions"><button id="prev" class="ghost">上一題</button><button id="reroll" class="ghost">重新抽題</button><button id="next" class="primary wide">無人得分／下一題（空白鍵）</button><button id="reset" class="ghost wide">重新開始</button></div></section><section id="done" class="card hidden center"><div class="winner" id="winner"></div><div id="podium" class="podium"></div><button onclick="location.reload()" class="primary">再玩一次</button></section></div><script>const $=id=>document.getElementById(id),symbols='ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙ'.split('');let qs=[],idx=0,players=[],audioCtx,scoring=false;const fx=$('fx'),cx=fx.getContext('2d');let conf=[];function resize(){fx.width=innerWidth*devicePixelRatio;fx.height=innerHeight*devicePixelRatio;fx.style.width=innerWidth+'px';fx.style.height=innerHeight+'px';cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();function burst(n=180){for(let i=0;i<n;i++)conf.push({x:innerWidth/2,y:innerHeight*.25,vx:(Math.random()-.5)*11,vy:-3-Math.random()*7,g:.15,l:100,w:4,h:9,c:`hsl(${Math.random()*360} 90% 62%)`})}(function draw(){cx.clearRect(0,0,innerWidth,innerHeight);conf=conf.filter(c=>c.l-->0);for(const c of conf){c.x+=c.vx;c.y+=c.vy;c.vy+=c.g;cx.fillStyle=c.c;cx.fillRect(c.x,c.y,c.w,c.h)}requestAnimationFrame(draw)})();function tone(f=700,d=.12,type='sine',vol=.1){audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}function speak(t){if(!('speechSynthesis'in window))return;const u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';u.rate=.95;speechSynthesis.cancel();speechSynthesis.speak(u)}function make(len){const p=[...symbols];for(let i=p.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[p[i],p[j]]=[p[j],p[i]]}return p.slice(0,len).join('　')}function effect(){document.body.classList.remove('electric');void document.body.offsetWidth;document.body.classList.add('electric');setTimeout(()=>document.body.classList.remove('electric'),350)}function renderPlayers(){const max=Math.max(...players.map(p=>p.score),0);$('players').innerHTML=players.map((p,i)=>`<div class="player ${scoring?'locked':''}" data-i="${i}"><div class="name">${p.name}</div><div class="score">${p.score}</div><div class="plus">+1</div>${p.score===max&&max>0?'<small>LEADER</small>':''}</div>`).join('');document.querySelectorAll('.player').forEach(el=>el.onclick=()=>score(+el.dataset.i,el))}function render(){effect();$('progress').textContent=`ROUND ${idx+1} / ${qs.length}`;$('question').textContent=qs[idx];$('prev').disabled=idx===0;renderPlayers()}function score(i,el){if(scoring)return;scoring=true;players[i].score++;tone(880,.15,'triangle',.12);speak(`${players[i].name}，加一分`);el.classList.add('hit');effect();setTimeout(()=>{scoring=false;next()},650)}function start(){audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();const n=Math.max(1,Math.min(100,+$('total').value||10)),count=Math.max(2,Math.min(10,+$('count').value||3)),names=$('names').value.split('\n').map(x=>x.trim()).filter(Boolean);players=Array.from({length:count},(_,i)=>({name:names[i]||`玩家 ${i+1}`,score:0}));localStorage.bopoSettings=JSON.stringify({total:n,length:$('length').value,count,names:$('names').value});qs=Array.from({length:n},()=>make($('length').value==='random'?2+Math.floor(Math.random()*4):+$('length').value));idx=0;$('setup').classList.add('hidden');$('game').classList.remove('hidden');render()}function next(){if(scoring)return;if(idx<qs.length-1){idx++;render()}else finish()}function finish(){const max=Math.max(...players.map(p=>p.score)),w=players.filter(p=>p.score===max).map(p=>p.name);$('game').classList.add('hidden');$('done').classList.remove('hidden');$('winner').textContent=w.length===1?`🏆 ${w[0]} 勝利！`:`🏆 ${w.join('、')} 並列冠軍！`;$('podium').innerHTML=[...players].sort((a,b)=>b.score-a.score).map((p,i)=>`<div class="rank">${i+1}. ${p.name} — ${p.score} 分</div>`).join('');burst();[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.35,'triangle',.12),i*120));speak(w.length===1?`恭喜${w[0]}獲勝`:`恭喜${w.join('、')}並列冠軍`)}$('start').onclick=start;$('next').onclick=next;$('prev').onclick=()=>{if(!scoring&&idx>0){idx--;render()}};$('reroll').onclick=()=>{if(!scoring){qs[idx]=make(qs[idx].split('　').length);render()}};$('reset').onclick=()=>location.reload();try{const s=JSON.parse(localStorage.bopoSettings||'{}');for(const k of ['total','length','count','names'])if(s[k]!=null)$(k).value=s[k]}catch{}addEventListener('keydown',e=>{if(e.repeat||scoring)return;if(e.code==='Space'&&!['INPUT','TEXTAREA','SELECT','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();next()}});</script></body></html>
