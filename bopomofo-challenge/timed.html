<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>ㄅㄆㄇ 限時挑戰</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 10%,#43ebff38,transparent 30%),linear-gradient(145deg,#040911,#0a1728 55%,#090712);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:680px;margin:auto;padding:22px 14px 42px}.top{text-align:center}.top small{color:#43ebff;letter-spacing:.16em;font-weight:900}.top h1{font-size:clamp(2rem,9vw,3.8rem);margin:10px 0 20px;text-shadow:0 0 25px #43ebff88}.card{background:#0b1b2ddd;border:1px solid #ffffff24;border-radius:24px;padding:20px;margin:14px 0;box-shadow:0 24px 70px #0008}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;color:#a9bfd1;font-size:.84rem;font-weight:900}input,select,button{width:100%;min-height:48px;margin-top:7px;border-radius:12px;border:1px solid #ffffff2a;background:#06101ddd;color:#fff;padding:11px 13px;font-size:1rem}button{cursor:pointer;font-weight:900}.primary{background:linear-gradient(135deg,#43ebff,#4b78ff);color:#03101b;border:0}.ghost{background:#ffffff0d}.toggle{display:flex;align-items:center;gap:10px;margin-top:14px;color:#c8d8e5}.toggle input{width:20px;min-height:20px;margin:0;accent-color:#43ebff}.hidden{display:none!important}.center{text-align:center}.game-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.progress{padding:8px 13px;border:1px solid #43ebff55;border-radius:999px;color:#43ebff;font-weight:900}.timer{--progress:100%;width:112px;height:112px;margin:4px auto 16px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#ffd75a var(--progress),#ffffff18 0);font-size:1.8rem;font-weight:1000;color:#fff;position:relative}.timer::before{content:"";position:absolute;inset:9px;border-radius:50%;background:#0b1b2d;box-shadow:inset 0 0 14px #0008}.timer span{position:relative;z-index:1}.timer.off{width:auto;height:auto;background:none;color:#9fb1c5;font-size:1.1rem;margin:12px 0}.timer.off::before{display:none}.timer.danger{color:#ff687d;animation:pulse .6s infinite alternate;background:conic-gradient(#ff687d var(--progress),#ffffff18 0)}.question{font-size:clamp(3.2rem,17vw,9rem);font-weight:1000;letter-spacing:.08em;text-align:center;color:#fff;text-shadow:0 0 25px #43ebff99;margin:10px 0 16px;line-height:1.15;white-space:nowrap;overflow:hidden}.hint{color:#a9bfd1;min-height:1.6em;margin:0 0 16px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions .wide{grid-column:1/-1}.result{font-size:clamp(2rem,9vw,3.5rem);font-weight:1000}.win{color:#ffd75a}.lose{color:#ff687d}.note{color:#9fb1c5;line-height:1.6}.heard{min-height:1.6em;margin:-6px 0 16px;font-size:1.15rem;font-weight:900;color:#c8d8e5}.heard.ok{color:#7dffb0}.heard.bad{color:#ff8b96}.xmas-only{display:none}body.xmas .xmas-only{display:block}body.xmas{background:radial-gradient(circle at 20% 10%,#d9344b40,transparent 32%),radial-gradient(circle at 85% 12%,#1f8a5550,transparent 34%),linear-gradient(145deg,#071b12,#0a1728 55%,#160b12)}.note#summary{white-space:pre-line}.presets{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 4px}.xmas-btn{background:linear-gradient(135deg,#ffd86b,#d9344b);color:#1d0a0a;border:0}@keyframes pulse{to{transform:scale(1.08)}}@media(max-width:520px){.wrap{padding:14px 11px 28px}.card{padding:17px;border-radius:20px}.grid,.actions{grid-template-columns:1fr}.actions .wide{grid-column:auto}.game-head{align-items:flex-start}.question{font-size:clamp(2.7rem,18vw,5.5rem)}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top"><small>PHONETIC TIME ATTACK</small><h1>ㄅㄆㄇ 限時挑戰</h1></header>
    <section id="setup" class="card">
      <div class="grid">
        <div><label for="goal">闖關方式</label><select id="goal"><option value="fixed" selected>固定題數</option><option value="endless">挑戰到輸為止</option></select></div>
        <div id="totalBox"><label for="total">題目數量</label><input id="total" type="number" min="1" max="100" value="10"></div>
        <div><label for="length">每題字數</label><select id="length"><option value="2" selected>2 字</option><option value="3">3 字</option><option value="4">4 字</option><option value="random">隨機 2～4 字</option></select></div>
        <div><label for="seconds">每題秒數</label><select id="seconds"><option value="5">5 秒</option><option value="10">10 秒</option><option value="15">15 秒</option><option value="20" selected>20 秒</option><option value="30">30 秒</option></select></div>
        <div><label for="mode">倒數模式</label><select id="mode"><option value="on" selected>開啟倒數</option><option value="off">不倒數</option></select></div>
      </div>
      <div class="xmas-only"><p class="note">🎄 聖誕挑戰：每關 <b id="xmasSec">10</b> 秒內說出用這些注音開頭的詞，全部過關就有禮物！（秒數、字數照上面的設定）</p><div class="presets"><button class="xmas-btn" data-total="5">🎁 挑戰 5 關</button><button class="xmas-btn" data-total="7">🎁 挑戰 7 關</button><button class="xmas-btn" data-total="10">🎁 挑戰 10 關</button><button class="xmas-btn" data-total="endless">♾️ 挑戰到輸為止</button></div></div>
      <label class="toggle"><input id="tick" type="checkbox" checked> ⏱ 倒數滴答音效</label>
      <label class="toggle"><input id="stt" type="checkbox" checked> 🎤 語音辨識自動判斷（說完按空白鍵或外接按鈕送出）</label>
      <p class="note">看見注音後，在時間內說出用這些注音開頭的詞，說完按空白鍵或外接按鈕：系統辨識答對就自動下一題並重新倒數，答錯可以再說一次。語音辨識不能用時，由主持人確認後按「答對，下一題」。固定題數全部完成就是勝利；「挑戰到輸為止」會一直出題，看能闖過幾關。任何一題時間到就是失敗。</p>
      <button id="start" class="primary">開始限時挑戰</button>
    </section>

    <section id="game" class="card hidden center">
      <div class="game-head"><div id="progress" class="progress"></div><strong>本題倒數</strong></div>
      <div id="timer" class="timer"><span></span></div>
      <div id="question" class="question"></div>
      <p id="hint" class="hint">請念出這組注音，答對後按下一題</p>
      <p id="heard" class="heard"></p>
      <div class="actions"><button id="next" class="primary wide">答對，下一題</button><button id="reroll" class="ghost">重新抽題</button><button id="reset" class="ghost">結束遊戲</button></div>
    </section>

    <section id="done" class="card hidden center"><div id="result" class="result"></div><p id="summary" class="note"></p><button id="again" class="primary">再玩一次</button></section>
  </main>
  <script src="combos.js?v=20261121a"></script>
  <script>
    const $=id=>document.getElementById(id), symbols='ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙ'.split('');
    let questions=[],index=0,timerId=null,left=0,seconds=10,useTimer=true,ended=false,endless=false,lengthSetting='2',used=new Set();const answers={};
    const xmas=new URLSearchParams(location.search).has('christmas');
    if(xmas){document.body.classList.add('xmas');document.title='🎄 ㄅㄆㄇ 聖誕限時挑戰';document.querySelector('.top h1').textContent='🎄 ㄅㄆㄇ 聖誕挑戰';document.querySelector('.top small').textContent='CHRISTMAS TIME ATTACK';$('total').value=5;$('seconds').value='10';$('length').value='2'}
    function make(length){const bank=(window.BOPO_COMBOS||{})[length];if(bank&&bank.length){let pool=bank.filter(([k])=>!used.has(k));if(!pool.length){used.clear();pool=bank}const [k,ans]=pool[Math.floor(Math.random()*pool.length)];used.add(k);const q=[...k].join('　');answers[q]=ans;return q}const list=[...symbols];for(let i=list.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]]}return list.slice(0,length).join('　')}
    // 題目字很大又不換行，3～4 個注音在窄螢幕會被切掉；逐步縮小字級直到整題放得下
    function fitQuestion(){const el=$('question');el.style.fontSize='';let size=parseFloat(getComputedStyle(el).fontSize);while(el.scrollWidth>el.clientWidth&&size>20){size*=.92;el.style.fontSize=size+'px'}}
    addEventListener('resize',()=>{if(!$('game').classList.contains('hidden'))fitQuestion()});
    function pickLength(){return lengthSetting==='random'?2+Math.floor(Math.random()*3):+lengthSetting}
    function syncSetup(){$('totalBox').classList.toggle('hidden',$('goal').value==='endless');$('xmasSec').textContent=$('seconds').value}
    // ── 倒數：用 deadline 計時，送出答案辨識時暫停、答錯再接著倒數 ──
    let deadline=0;
    // 倒數音效：沿用聖誕禮物爆炸的 tick.mp3，倒數進行中循環播放，暫停（辨識中）或結束就停
    let audioCtx=null,tickBuffer=null,tickSource=null;
    async function initTick(){if(tickBuffer||!(window.AudioContext||window.webkitAudioContext))return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')await audioCtx.resume();tickBuffer=await audioCtx.decodeAudioData(await fetch('tick.mp3?v=20261122a').then(r=>r.arrayBuffer()))}catch{tickBuffer=null}}
    function stopTick(){if(tickSource){try{tickSource.stop()}catch{}tickSource=null}}
    function startTick(){stopTick();if(!audioCtx||!tickBuffer||!$('tick').checked)return;tickSource=audioCtx.createBufferSource();tickSource.buffer=tickBuffer;tickSource.loop=true;tickSource.connect(audioCtx.destination);tickSource.start()}
    function stopTimer(){clearInterval(timerId);timerId=null;stopTick()}
    function pauseTimer(){stopTimer();return Math.max(0,deadline-Date.now())}
    function startTimer(ms){const timer=$('timer'),label=timer.querySelector('span');stopTimer();startTick();deadline=Date.now()+ms;const tick=()=>{if(ended)return;const remaining=Math.max(0,deadline-Date.now());left=Math.ceil(remaining/1000);label.textContent=`${left} 秒`;timer.style.setProperty('--progress',`${remaining/(seconds*1000)*100}%`);timer.classList.toggle('danger',left<=3);if(remaining<=0)finish(false,'本題時間已到，直接判定失敗。')};tick();timerId=setInterval(tick,100)}
    // ── 語音辨識：題目一出現就開始錄，按空白鍵／外接按鈕送到後台 /api/stt（Groq Whisper）判斷 ──
    let sttOn=false,stream=null,recorder=null,chunks=[],judging=false,renderId=0;
    async function setupStt(){sttOn=false;if(!$('stt').checked||!navigator.mediaDevices||!window.MediaRecorder)return;try{const h=await fetch('/api/stt/health').then(r=>r.ok?r.json():{});if(!h.configured)return;stream=stream||await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});sttOn=true}catch{sttOn=false}}
    function stopRecording(){return new Promise(r=>{const rec=recorder;recorder=null;if(!rec||rec.state==='inactive')return r(null);rec.onstop=()=>r(new Blob(chunks,{type:rec.mimeType||'audio/webm'}));rec.stop()})}
    async function startRecording(keepMsg=false){if(!sttOn||ended)return;await stopRecording();chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.start();if(!keepMsg)heard('🎤 聆聽中…說完按空白鍵或按鈕')}
    function heard(text,cls=''){$('heard').textContent=text;$('heard').className=`heard ${cls}`}
    async function submit(){
      if(ended||judging||$('game').classList.contains('hidden'))return;
      if(!sttOn)return next();
      if(!recorder){heard('麥克風還沒準備好，再按一次');startRecording(true);return}
      judging=true;const id=renderId,remaining=useTimer?pauseTimer():0;heard('🔍 辨識中…');
      const initials=[...questions[index]].filter(x=>x!=='　').join(''),blob=await stopRecording();
      let res=null;
      try{if(blob&&blob.size>800){const r=await fetch(`/api/stt?initials=${encodeURIComponent(initials)}`,{method:'POST',headers:{'Content-Type':blob.type.split(';')[0]},body:blob});res=await r.json().catch(()=>null);if(!r.ok)res={error:res?.message||`HTTP ${r.status}`}}}catch(e){res={error:'連線失敗'}}
      judging=false;if(ended||id!==renderId)return;
      if(res&&res.ok){heard(`✓ 聽到「${res.text}」→ ${res.matched}`,'ok');stopTimer();setTimeout(()=>{if(id===renderId&&!ended)next()},700);return}
      if(res&&res.error)heard(`辨識失敗（${res.error}），請主持人按「答對，下一題」判斷`,'bad');
      else heard(res&&res.text?`✗ 聽到「${res.text}」，不符合，再說一次`:'✗ 沒聽到聲音，再說一次','bad');
      if(useTimer)startTimer(remaining);startRecording(true)
    }
    function finish(win,reason){if(ended)return;ended=true;stopTimer();stopRecording();$('next').disabled=true;$('reroll').disabled=true;$('reset').disabled=true;$('game').classList.add('hidden');$('done').classList.remove('hidden');$('result').className=`result ${win?'win':'lose'}`;$('result').textContent=win?(xmas?'🎁 過關！領禮物':'🎉 勝利！'):(xmas?'⏰ GG！':'⏰ 失敗！');let msg=win?`全部 ${questions.length} 題完成！`:reason||'時間到，挑戰結束。';if(endless&&!win){const cleared=index;let best=0;try{best=Math.max(cleared,+localStorage.bopoEndlessBest||0);localStorage.bopoEndlessBest=best}catch{best=cleared}$('result').textContent=`🏁 闖過 ${cleared} 關！`;msg=`${reason||'時間到'}　最佳紀錄：${best} 關`}const ans=!win&&answers[questions[index]];$('summary').textContent=msg+(ans?`\n參考答案：${ans}`:'')}
    function render(){ended=false;judging=false;const id=++renderId;stopTimer();stopRecording();$('next').disabled=false;$('reroll').disabled=false;$('reset').disabled=false;$('progress').textContent=endless?`第 ${index+1} 關`:`第 ${index+1} / ${questions.length} 題`;$('question').textContent=questions[index];fitQuestion();$('hint').textContent=sttOn?'說出用這些注音開頭的詞，說完按空白鍵或按鈕':'請念出這組注音，答對後按下一題';heard('');startRecording();const timer=$('timer'),label=timer.querySelector('span');if(!useTimer){label.textContent='不倒數';timer.className='timer off';return}timer.className='timer';startTimer(seconds*1000)}
    async function start(){await initTick();const total=Math.max(1,Math.min(100,+$('total').value||10));lengthSetting=$('length').value;endless=$('goal').value==='endless';used.clear();questions=Array.from({length:endless?1:total},()=>make(pickLength()));seconds=+$('seconds').value||10;useTimer=$('mode').value==='on';index=0;ended=false;await setupStt();$('setup').classList.add('hidden');$('done').classList.add('hidden');$('game').classList.remove('hidden');render()}
    function next(){if(ended)return;if(index>=questions.length-1){if(!endless){finish(true);return}questions.push(make(pickLength()))}index++;render()}
    // 外接按鈕（藍牙翻頁器、自拍按鈕等）多半送出空白鍵、Enter、PageDown 或右方向鍵，都當作「送出答案」
    const SUBMIT_KEYS=['Space','Enter','NumpadEnter','PageDown','ArrowRight','ArrowDown','MediaPlayPause'];
    addEventListener('keydown',e=>{if(e.repeat||!SUBMIT_KEYS.includes(e.code||e.key)||$('game').classList.contains('hidden'))return;if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName))return;e.preventDefault();document.activeElement?.blur();submit()});
    const tap=fn=>e=>{e.currentTarget.blur();fn()};
    $('start').onclick=tap(start);document.querySelectorAll('.xmas-btn').forEach(b=>b.onclick=tap(()=>{const v=b.dataset.total;$('goal').value=v==='endless'?'endless':'fixed';if(v!=='endless')$('total').value=v;$('mode').value='on';syncSetup();start()}));$('goal').onchange=syncSetup;$('seconds').onchange=syncSetup;$('next').onclick=tap(next);$('reroll').onclick=tap(()=>{if(!ended){const n=[...questions[index]].filter(x=>x!=='　').length;questions[index]=make(n);render()}});$('reset').onclick=tap(()=>{stopTimer();stopRecording();ended=true;$('game').classList.add('hidden');$('setup').classList.remove('hidden')});$('again').onclick=()=>location.reload();syncSetup();
  </script>
</body>
</html>
