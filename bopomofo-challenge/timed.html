<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>ㄅㄆㄇ 限時挑戰</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 10%,#43ebff38,transparent 30%),linear-gradient(145deg,#040911,#0a1728 55%,#090712);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:680px;margin:auto;padding:22px 14px 42px}.top{text-align:center}.top small{color:#43ebff;letter-spacing:.16em;font-weight:900}.top h1{font-size:clamp(2rem,9vw,3.8rem);margin:10px 0 20px;text-shadow:0 0 25px #43ebff88}.card{background:#0b1b2ddd;border:1px solid #ffffff24;border-radius:24px;padding:20px;margin:14px 0;box-shadow:0 24px 70px #0008}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;color:#a9bfd1;font-size:.84rem;font-weight:900}input,select,button{width:100%;min-height:48px;margin-top:7px;border-radius:12px;border:1px solid #ffffff2a;background:#06101ddd;color:#fff;padding:11px 13px;font-size:1rem}button{cursor:pointer;font-weight:900}.primary{background:linear-gradient(135deg,#43ebff,#4b78ff);color:#03101b;border:0}.ghost{background:#ffffff0d}.toggle{display:flex;align-items:center;gap:10px;margin-top:14px;color:#c8d8e5}.toggle input{width:20px;min-height:20px;margin:0;accent-color:#43ebff}.hidden{display:none!important}.center{text-align:center}.game-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.progress{padding:8px 13px;border:1px solid #43ebff55;border-radius:999px;color:#43ebff;font-weight:900}.timer{--progress:100%;width:112px;height:112px;margin:4px auto 16px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#ffd75a var(--progress),#ffffff18 0);font-size:1.8rem;font-weight:1000;color:#fff;position:relative}.timer::before{content:"";position:absolute;inset:9px;border-radius:50%;background:#0b1b2d;box-shadow:inset 0 0 14px #0008}.timer span{position:relative;z-index:1}.timer.off{width:auto;height:auto;background:none;color:#9fb1c5;font-size:1.1rem;margin:12px 0}.timer.off::before{display:none}.timer.danger{color:#ff687d;animation:pulse .6s infinite alternate;background:conic-gradient(#ff687d var(--progress),#ffffff18 0)}.question{font-size:clamp(3.2rem,17vw,9rem);font-weight:1000;letter-spacing:.08em;text-align:center;color:#fff;text-shadow:0 0 25px #43ebff99;margin:10px 0 16px;line-height:1.15;white-space:nowrap;overflow:hidden}.hint{color:#a9bfd1;min-height:1.6em;margin:0 0 16px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions .wide{grid-column:1/-1}.result{font-size:clamp(2rem,9vw,3.5rem);font-weight:1000}.win{color:#ffd75a}.lose{color:#ff687d}.note{color:#9fb1c5;line-height:1.6}@keyframes pulse{to{transform:scale(1.08)}}@media(max-width:520px){.wrap{padding:14px 11px 28px}.card{padding:17px;border-radius:20px}.grid,.actions{grid-template-columns:1fr}.actions .wide{grid-column:auto}.game-head{align-items:flex-start}.question{font-size:clamp(2.7rem,18vw,5.5rem)}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top"><small>PHONETIC TIME ATTACK</small><h1>ㄅㄆㄇ 限時挑戰</h1></header>
    <section id="setup" class="card">
      <div class="grid">
        <div><label for="total">題目數量</label><input id="total" type="number" min="1" max="100" value="10"></div>
        <div><label for="length">每題字數</label><select id="length"><option value="2" selected>2 字</option><option value="3">3 字</option><option value="4">4 字</option><option value="5">5 字</option><option value="random">隨機 2～5 字</option></select></div>
        <div><label for="seconds">每題秒數</label><select id="seconds"><option value="5">5 秒</option><option value="10" selected>10 秒</option><option value="15">15 秒</option><option value="30">30 秒</option></select></div>
        <div><label for="mode">倒數模式</label><select id="mode"><option value="on" selected>開啟倒數</option><option value="off">不倒數</option></select></div>
      </div>
      <label class="toggle"><input id="voice" type="checkbox" checked> 開啟語音播報注音</label>
      <p class="note">看見注音後，在時間內念出答案；主持人確認答對後按「答對，下一題」。全部完成就是勝利，任何一題時間到就是失敗。</p>
      <button id="start" class="primary">開始限時挑戰</button>
    </section>

    <section id="game" class="card hidden center">
      <div class="game-head"><div id="progress" class="progress"></div><strong>本題倒數</strong></div>
      <div id="timer" class="timer"><span></span></div>
      <div id="question" class="question"></div>
      <p id="hint" class="hint">請念出這組注音，答對後按下一題</p>
      <div class="actions"><button id="next" class="primary wide">答對，下一題</button><button id="reroll" class="ghost">重新抽題</button><button id="reset" class="ghost">結束遊戲</button></div>
    </section>

    <section id="done" class="card hidden center"><div id="result" class="result"></div><p id="summary" class="note"></p><button id="again" class="primary">再玩一次</button></section>
  </main>
  <script>
    const $=id=>document.getElementById(id), symbols='ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙ'.split('');
    let questions=[],index=0,timerId=null,left=0,seconds=10,useTimer=true,ended=false;
    function make(length){const list=[...symbols];for(let i=list.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]]}return list.slice(0,length).join('　')}
    function speak(text){if(!$('voice').checked||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';u.rate=.8;speechSynthesis.speak(u)}
    function stopTimer(){clearInterval(timerId);timerId=null}
    function finish(win,reason){if(ended)return;ended=true;stopTimer();speechSynthesis?.cancel();$('next').disabled=true;$('reroll').disabled=true;$('reset').disabled=true;$('game').classList.add('hidden');$('done').classList.remove('hidden');$('result').className=`result ${win?'win':'lose'}`;$('result').textContent=win?'🎉 勝利！':'⏰ 失敗！';$('summary').textContent=win?`全部 ${questions.length} 題完成！`:reason||'時間到，挑戰結束。'}
    function render(){ended=false;stopTimer();$('next').disabled=false;$('reroll').disabled=false;$('reset').disabled=false;const total=questions.length;$('progress').textContent=`第 ${index+1} / ${total} 題`;$('question').textContent=questions[index];$('hint').textContent='請念出這組注音，答對後按下一題';speak([...questions[index]].filter(x=>x!=='　').join('，'));const timer=$('timer'),label=timer.querySelector('span');if(!useTimer){label.textContent='不倒數';timer.className='timer off';return}timer.className='timer';left=seconds;label.textContent=`${left} 秒`;timer.style.setProperty('--progress','100%');const deadline=Date.now()+seconds*1000;timerId=setInterval(()=>{if(ended)return;left=Math.max(0,Math.ceil((deadline-Date.now())/1000));const remaining=Math.max(0,deadline-Date.now());label.textContent=`${left} 秒`;timer.style.setProperty('--progress',`${remaining/(seconds*1000)*100}%`);if(left<=3)timer.classList.add('danger');if(Date.now()>=deadline)finish(false,'本題時間已到，直接判定失敗。')},100)}
    function start(){const total=Math.max(1,Math.min(100,+$('total').value||10)),selected=$('length').value;questions=Array.from({length:total},()=>make(selected==='random'?2+Math.floor(Math.random()*4):+selected));seconds=+$('seconds').value||10;useTimer=$('mode').value==='on';index=0;ended=false;$('setup').classList.add('hidden');$('done').classList.add('hidden');$('game').classList.remove('hidden');render()}
    function next(){if(ended)return;if(index>=questions.length-1){finish(true);return}index++;render()}
    $('start').onclick=start;$('next').onclick=next;$('reroll').onclick=()=>{if(!ended){const n=[...questions[index]].filter(x=>x!=='　').length;questions[index]=make(n);render()}};$('reset').onclick=()=>{stopTimer();ended=true;$('game').classList.add('hidden');$('setup').classList.remove('hidden')};$('again').onclick=()=>location.reload();
  </script>
</body>
</html>
