<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10060d"><title>節奏接龍</title><style>:root{--a:#ff8a1f;--b:#ff315f;--g:#ffe06b;--m:#b8a9bd}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07050b;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow-x:hidden;background:radial-gradient(circle at 20% 12%,#6b152c66,transparent 30%),radial-gradient(circle at 80% 10%,#7a3e1160,transparent 28%),linear-gradient(145deg,#08050c,#190814 55%,#09060d)}#fx{position:fixed;inset:0;z-index:0;pointer-events:none}.scan{position:fixed;inset:-45%;z-index:0;pointer-events:none;background:linear-gradient(115deg,transparent 43%,#ffb34712 48%,#fff5 50%,#ff315f14 52%,transparent 57%);animation:scan 7s linear infinite}.flash{position:fixed;inset:0;z-index:5;pointer-events:none;background:#ffb53b;opacity:0}.flash.on{animation:flash .12s}.wrap{position:relative;z-index:2;max-width:940px;margin:auto;padding:22px 16px 42px}.top{text-align:center}.top:before{content:"RHYTHM ARENA";display:inline-block;padding:7px 14px;border:1px solid #ffe06b70;border-radius:999px;color:var(--g);font-size:.72rem;font-weight:1000;letter-spacing:.22em;background:#ffe06b12;box-shadow:0 0 24px #ff8a1f28}h1{font-size:clamp(2.2rem,8vw,4.8rem);margin:12px 0 18px;text-shadow:0 0 18px #ff315f88,0 0 55px #ff8a1f45}.card{position:relative;overflow:hidden;background:linear-gradient(145deg,#251326e8,#100b18e8);border:1px solid #ffffff20;border-radius:30px;padding:24px;margin:18px 0;box-shadow:0 30px 90px #0009,0 0 55px #ff315f16,inset 0 1px #fff2;backdrop-filter:blur(20px)}.card:before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,transparent,var(--b),var(--g),var(--a),transparent);filter:drop-shadow(0 0 10px var(--a))}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.grid>div,.checkbox{padding:13px;border-radius:18px;background:#ffffff08;border:1px solid #ffffff12}.wide{grid-column:1/-1}label{display:block;color:var(--m);font-size:.82rem;font-weight:900;margin-bottom:7px}input,select,textarea,button{width:100%;min-height:50px;border-radius:15px;border:1px solid #ffffff1e;background:#08070dc7;color:#fff;padding:12px 14px;font-size:1rem;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--a);box-shadow:0 0 0 4px #ff8a1f22,0 0 24px #ff8a1f20}button{cursor:pointer;border:0;font-weight:1000;transition:.16s;box-shadow:0 9px 26px #0005}button:active{transform:translateY(2px) scale(.985)}.primary{background:linear-gradient(135deg,var(--g),var(--a));color:#261002}.skip{background:linear-gradient(135deg,#ffe99a,#eab432);color:#241900}.ghost{background:#ffffff0c;border:1px solid #ffffff1e}.hidden{display:none!important}.center{text-align:center}.progress{display:inline-flex;padding:8px 14px;border-radius:999px;background:#fff1;border:1px solid #fff2;color:var(--g);font-weight:1000}.topic{font-size:clamp(2.7rem,11vw,6rem);font-weight:1000;letter-spacing:-.06em;margin:22px 0 5px;background:linear-gradient(#fff,#ffd6ae);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 30px #ff8a1f44)}.phrase{min-height:2.8em;display:grid;place-items:center;font-size:clamp(1.1rem,4vw,1.8rem);font-weight:900;color:#ffe6c3}.pulse{position:relative;width:190px;height:190px;margin:22px auto;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#241329 42%,#0e0914 43%);box-shadow:0 0 0 10px #ff8a1f0a,0 0 55px #ff315f2b;transition:.12s}.pulse:before,.pulse:after{content:"";position:absolute;border-radius:50%;inset:-17px;border:2px dashed #ff8a1f66;animation:spin 9s linear infinite}.pulse:after{inset:-34px;border-color:#ff315f33;animation-direction:reverse}.pulse.on{background:radial-gradient(circle,#fff5a8,#ff9a24 45%,#ff315f);color:#220608;transform:scale(1.1);box-shadow:0 0 90px #ff8a1fcc}.beat{font-size:5rem;font-weight:1000}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:12px;margin:28px 0}.pill{position:relative;padding:18px 10px;border-radius:18px;color:#b9aebe;background:#ffffff09;border:1px solid #ffffff15;font-weight:1000;transition:.18s}.pill:not(:last-child):before{content:"";position:absolute;right:-15px;top:50%;width:18px;height:3px;background:linear-gradient(90deg,#ff8a1f33,#ffe06b);box-shadow:0 0 12px #ffe06b;opacity:.25}.pill.active{color:#251004;background:linear-gradient(135deg,var(--g),var(--a));transform:translateY(-7px) scale(1.06);box-shadow:0 18px 50px #ff8a1f66}.pill.active:after{content:"⚡ NOW";position:absolute;top:-13px;right:8px;background:#fff;color:#e52650;padding:4px 8px;border-radius:999px;font-size:.65rem}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.checkbox{display:flex;align-items:center;gap:10px}.checkbox input{width:20px;min-height:20px;accent-color:var(--a)}.countdown{min-height:1.2em;font-size:clamp(1.8rem,8vw,3.5rem);font-weight:1000;color:#ff7999;text-shadow:0 0 26px #ff315f}.note{color:#95899b;font-size:.82rem;line-height:1.65}.result-burst{font-size:clamp(4rem,16vw,8rem);animation:pop .6s ease}.beat-hit .card{animation:screenHit .18s ease}.electric:before{content:"";position:fixed;inset:0;z-index:4;pointer-events:none;background:repeating-linear-gradient(125deg,transparent 0 47%,#fff 48%,#ffde6b 49%,transparent 50%);mix-blend-mode:screen;opacity:.22;animation:zap .4s ease}@keyframes scan{to{transform:translateX(45%)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes flash{50%{opacity:.22}}@keyframes screenHit{50%{transform:scale(1.008)}}@keyframes zap{to{opacity:0;transform:translateX(8%)}}@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1)}}@media(max-width:600px){.wrap{padding:14px 11px 28px}.card{padding:18px;border-radius:23px}.grid,.actions{grid-template-columns:1fr}.wide{grid-column:auto}.pulse{width:150px;height:150px}.players{grid-template-columns:repeat(2,1fr)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important}}</style></head><body><canvas id="fx"></canvas><div class="scan"></div><div id="flash" class="flash"></div><div class="wrap"><div class="top"><h1>🥁 節奏接龍</h1></div><section id="setup" class="card"><div class="grid"><div><label>BPM</label><input id="bpm" type="number" min="40" max="200" value="80"></div><div><label>玩家人數／拍數</label><input id="count" type="number" min="2" max="10" value="3"></div><div><label>本局題數</label><input id="rounds" type="number" min="1" max="100" value="10"></div><div><label>每題結束後倒數秒數</label><input id="nextDelay" type="number" min="0" max="30" value="3"></div><div><label>題目模式</label><select id="topicMode"><option value="random">隨機題庫</option><option value="custom">自訂題目</option></select></div><div class="wide"><label>自訂題目（每行一題）</label><textarea id="customTopics" rows="4"></textarea></div><div class="wide"><label>玩家名稱（每行一位）</label><textarea id="names" rows="4" placeholder="玩家 1&#10;玩家 2&#10;玩家 3"></textarea></div><label class="checkbox"><input id="speak" type="checkbox" checked> 語音念完整題目</label><label class="checkbox"><input id="sound" type="checkbox" checked> 鼓點音效</label></div><button id="start" class="primary" style="margin-top:16px">進入競技場</button></section><section id="game" class="card hidden center"><div class="progress">ROUND <span id="doneView">0</span> / <span id="totalView">10</span></div><div id="topicView" class="topic">—</div><div id="phrase" class="phrase">準備開始</div><div id="pulse" class="pulse"><span id="beatView" class="beat">♪</span></div><div id="autoNextView" class="countdown"></div><div id="players" class="players"></div><div class="actions"><button id="pause" class="ghost">暫停</button><button id="skip" class="skip">跳過</button><button id="next" class="primary wide">下一題（空白鍵）</button><button id="reset" class="ghost wide">重新開始</button></div><p class="note">每拍切換一位玩家；鼓點會同步閃光、電流與玩家燈號。</p></section><section id="result" class="card hidden center"><div class="result-burst">🏆</div><div class="topic">挑戰完成</div><button onclick="location.reload()" class="primary">再玩一次</button></section></div><script>const $=id=>document.getElementById(id),TOPICS=['夜市小吃','水果','飲料','動物','國家','台灣地名','交通工具','便利商店商品','早餐店餐點','火鍋料','日本料理','甜點','冰品','職業','卡通角色','電影角色','歌手','家電','家具','文具','廚房用品','衣服','鞋子','顏色','程式語言','手機品牌','App','運動','台灣景點','超級英雄'],DRUM_URL='./drum_hit.wav';let players=[],topics=[],used=[],current='',bpm=80,total=10,done=0,nextDelay=3,running=false,paused=false,phase='idle',timer=null,token=0,drumBuffer=null,audioCtx=null;const fx=$('fx'),cx=fx.getContext('2d');let pts=[],conf=[];function resize(){fx.width=innerWidth*devicePixelRatio;fx.height=innerHeight*devicePixelRatio;fx.style.width=innerWidth+'px';fx.style.height=innerHeight+'px';cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();for(let i=0;i<(innerWidth<600?28:60);i++)pts.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:.5+Math.random()*1.8,v:.08+Math.random()*.3,a:.14+Math.random()*.4});function burst(n=120){for(let i=0;i<n;i++)conf.push({x:innerWidth/2,y:innerHeight*.27,vx:(Math.random()-.5)*9,vy:-2-Math.random()*6,g:.12+Math.random()*.08,l:70+Math.random()*45,w:3+Math.random()*5,h:6+Math.random()*10,c:`hsl(${Math.random()*360} 90% 62%)`})}(function draw(){cx.clearRect(0,0,innerWidth,innerHeight);for(const p of pts){p.y-=p.v;if(p.y<0){p.y=innerHeight;p.x=Math.random()*innerWidth}cx.globalAlpha=p.a;cx.fillStyle='#fff';cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill()}cx.globalAlpha=1;conf=conf.filter(c=>c.l-->0);for(const c of conf){c.x+=c.vx;c.y+=c.vy;c.vy+=c.g;cx.fillStyle=c.c;cx.fillRect(c.x,c.y,c.w,c.h)}requestAnimationFrame(draw)})();function hitFx(){document.body.classList.remove('beat-hit','electric');void document.body.offsetWidth;document.body.classList.add('beat-hit','electric');$('flash').classList.add('on');setTimeout(()=>{$('flash').classList.remove('on');document.body.classList.remove('electric')},400)}function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function nextTopic(){if(!topics.length){topics=shuffle(used.length?used:TOPICS);used=[]}let t=topics.shift();if(t===current&&topics.length){topics.push(t);t=topics.shift()}used.push(t);return current=t}function render(active=-1){$('players').innerHTML=players.map((p,i)=>`<div class="pill ${i===active?'active':''}">第 ${i+1} 拍<br>${p}</div>`).join('')}function sleep(ms,my){return new Promise(r=>timer=setTimeout(()=>r(my===token),ms))}async function loadDrum(){if(drumBuffer)return;audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();await audioCtx.resume();const res=await fetch(DRUM_URL+'?v=4');drumBuffer=await audioCtx.decodeAudioData(await res.arrayBuffer())}function playDrum(){if(!$('sound').checked||!drumBuffer)return;const s=audioCtx.createBufferSource(),g=audioCtx.createGain();g.gain.value=1.45;s.buffer=drumBuffer;s.connect(g).connect(audioCtx.destination);s.start();hitFx()}function speak(text){return new Promise(r=>{if(!$('speak').checked||!('speechSynthesis'in window)){r();return}const u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';u.rate=.95;u.onend=u.onerror=r;speechSynthesis.cancel();speechSynthesis.speak(u)})}async function beginRound(){if(!running||paused)return;phase='announce';const my=++token;current=nextTopic();$('topicView').textContent=current;$('phrase').textContent=`一想到 ${current}，我就想到`;$('autoNextView').textContent='';render();$('beatView').textContent='♪';await speak(`一想到${current}，我就想到`);if(my!==token||paused)return;phase='beats';for(let i=0;i<players.length;i++){if(my!==token||paused||!running)return;render(i);$('phrase').textContent=`第 ${i+1} 拍：${players[i]} 回答第 ${i+1} 個字`;$('beatView').textContent=i+1;playDrum();$('pulse').classList.add('on');setTimeout(()=>$('pulse').classList.remove('on'),130);if(i<players.length-1&&!await sleep(60000/bpm,my))return}render();phase='waiting';await autoNext(my)}async function autoNext(my){if(nextDelay===0){completeRound();return}for(let i=nextDelay;i>=1;i--){if(my!==token||paused||!running)return;$('autoNextView').textContent=`${i} 秒後下一題`;if(!await sleep(1000,my))return}$('autoNextView').textContent='';completeRound()}function completeRound(){if(!running||paused)return;done++;$('doneView').textContent=done;if(done>=total){finish();return}token++;clearTimeout(timer);beginRound()}async function start(){bpm=Math.max(40,Math.min(200,+$('bpm').value||80));total=Math.max(1,Math.min(100,+$('rounds').value||10));nextDelay=Math.max(0,Math.min(30,+$('nextDelay').value||0));const n=Math.max(2,Math.min(10,+$('count').value||3)),ns=$('names').value.split('\n').map(x=>x.trim()).filter(Boolean);players=Array.from({length:n},(_,i)=>ns[i]||`玩家 ${i+1}`);const custom=$('customTopics').value.split('\n').map(x=>x.trim()).filter(Boolean);topics=shuffle($('topicMode').value==='custom'&&custom.length?custom:TOPICS);used=[];done=0;running=true;paused=false;localStorage.rhythmSettings=JSON.stringify({bpm,count:n,rounds:total,nextDelay,topicMode:$('topicMode').value,customTopics:$('customTopics').value,names:$('names').value,speak:$('speak').checked,sound:$('sound').checked});$('setup').classList.add('hidden');$('game').classList.remove('hidden');$('doneView').textContent=0;$('totalView').textContent=total;render();try{await loadDrum()}catch(e){$('sound').checked=false;$('phrase').textContent='鼓聲載入失敗'}beginRound()}function next(){if(!running||paused)return;token++;clearTimeout(timer);$('autoNextView').textContent='';completeRound()}function skip(){if(!running||paused)return;token++;clearTimeout(timer);speechSynthesis?.cancel();$('autoNextView').textContent='';$('phrase').textContent='已跳過，不扣題數';setTimeout(beginRound,300)}function pause(){if(!running)return;paused=!paused;token++;clearTimeout(timer);speechSynthesis?.cancel();$('pause').textContent=paused?'繼續':'暫停';$('phrase').textContent=paused?'遊戲暫停':'重新開始本題';if(!paused)setTimeout(beginRound,300)}function finish(){running=false;token++;clearTimeout(timer);$('game').classList.add('hidden');$('result').classList.remove('hidden');burst()}function blur(){document.activeElement?.blur()}$('start').onclick=async()=>{blur();await start()};$('next').onclick=()=>{blur();next()};$('skip').onclick=()=>{blur();skip()};$('pause').onclick=()=>{blur();pause()};$('reset').onclick=()=>location.reload();try{const s=JSON.parse(localStorage.rhythmSettings||'{}');for(const k of ['bpm','count','rounds','nextDelay','topicMode','customTopics','names'])if(s[k]!=null)$(k).value=s[k];if(s.speak!=null)$('speak').checked=s.speak;if(s.sound!=null)$('sound').checked=s.sound}catch(e){}addEventListener('keydown',e=>{if(e.repeat)return;if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;if(e.code==='Space'){e.preventDefault();blur();next()}else if(e.key.toLowerCase()==='s'){e.preventDefault();blur();skip()}else if(e.key==='Escape')pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&running&&!paused)pause()});</script></body></html>
