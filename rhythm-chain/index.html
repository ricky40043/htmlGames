<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#140b13">
<title>節奏接龍</title>
<style>
:root{--accent:#ff8a1f;--accent2:#ff3d6e;--gold:#ffd35a;--panel:rgba(23,16,30,.82);--line:rgba(255,255,255,.12);--text:#fffaf4;--muted:#b9adbd}*{box-sizing:border-box}html{min-height:100%;background:#09070e}body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 15% 10%,rgba(255,61,110,.22),transparent 32%),radial-gradient(circle at 85% 20%,rgba(255,138,31,.2),transparent 30%),linear-gradient(145deg,#09070e 0%,#180b16 48%,#0c0913 100%);overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.23;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:32px 32px;mask-image:linear-gradient(to bottom,black,transparent 80%)}.wrap{position:relative;max-width:900px;margin:auto;padding:24px 18px 40px}.top{text-align:center;padding:10px 0 4px}.top:before{content:"RHYTHM PARTY";display:inline-block;padding:6px 12px;border:1px solid rgba(255,211,90,.45);border-radius:999px;color:var(--gold);font-size:.74rem;font-weight:900;letter-spacing:.18em;background:rgba(255,211,90,.08)}h1{margin:12px 0 4px;font-size:clamp(2rem,7vw,4rem);letter-spacing:-.04em;text-shadow:0 0 30px rgba(255,61,110,.35)}.card{position:relative;background:linear-gradient(145deg,rgba(35,24,42,.92),rgba(18,13,25,.9));border:1px solid var(--line);border-radius:28px;padding:24px;margin:18px 0;box-shadow:0 26px 70px rgba(0,0,0,.38),inset 0 1px rgba(255,255,255,.06);backdrop-filter:blur(18px);overflow:hidden}.card:before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,transparent,var(--accent2),var(--gold),transparent)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid>div,.checkbox{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);border-radius:18px;padding:13px}.wide{grid-column:1/-1}label{display:block;color:var(--muted);font-size:.82rem;font-weight:800;letter-spacing:.04em;margin-bottom:7px}input,select,textarea,button{width:100%;min-height:50px;border-radius:15px;border:1px solid rgba(255,255,255,.12);background:rgba(7,7,12,.72);color:#fff;padding:12px 14px;font-size:1rem;outline:none;transition:.2s}input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(255,138,31,.13)}textarea{resize:vertical}button{border:0;cursor:pointer;font-weight:900;letter-spacing:.02em;box-shadow:0 8px 24px rgba(0,0,0,.2);transform:translateY(0)}button:active{transform:translateY(2px) scale(.99)}.primary{background:linear-gradient(135deg,var(--gold),var(--accent));color:#241107}.skip{background:linear-gradient(135deg,#ffe98c,#f4bd38);color:#2c1b00}.ghost{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)}.hidden{display:none!important}.center{text-align:center}.progress{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--gold);font-weight:900}.topic{font-size:clamp(2.4rem,10vw,5.4rem);font-weight:1000;line-height:1.05;margin:24px 0 8px;letter-spacing:-.06em;background:linear-gradient(180deg,#fff,#ffd7ad);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 6px 24px rgba(255,138,31,.18))}.phrase{min-height:3em;display:grid;place-items:center;font-size:clamp(1.05rem,4vw,1.8rem);font-weight:850;color:#ffe4c2}.pulse{position:relative;width:180px;height:180px;border-radius:50%;margin:20px auto;display:grid;place-items:center;background:radial-gradient(circle,#221524 48%,#130d18 49%);border:1px solid rgba(255,255,255,.13);box-shadow:0 0 0 12px rgba(255,138,31,.04),0 0 55px rgba(255,61,110,.16);transition:.12s}.pulse:before,.pulse:after{content:"";position:absolute;border-radius:50%;border:2px solid rgba(255,138,31,.2);inset:-14px}.pulse:after{inset:-28px;border-color:rgba(255,61,110,.1)}.pulse.on{background:radial-gradient(circle,#ffd35a 0%,#ff8a1f 55%,#ff3d6e 100%);color:#2a0c0b;transform:scale(1.08);box-shadow:0 0 70px rgba(255,138,31,.55)}.beat{font-size:4.5rem;font-weight:1000}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:26px 0}.pill{position:relative;padding:18px 10px;border-radius:18px;background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.025));border:1px solid rgba(255,255,255,.1);font-weight:900;color:var(--muted);transition:.18s}.pill.active{color:#1d0c05;background:linear-gradient(135deg,var(--gold),var(--accent));transform:translateY(-5px) scale(1.04);box-shadow:0 18px 40px rgba(255,138,31,.35)}.pill.active:after{content:"NOW";position:absolute;top:-10px;right:10px;font-size:.65rem;background:#fff;color:#e53b4f;border-radius:999px;padding:4px 7px}.countdown{font-size:clamp(1.8rem,8vw,3.5rem);font-weight:1000;color:#ff8aa2;min-height:1.25em;text-shadow:0 0 25px rgba(255,61,110,.4)}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.checkbox{display:flex;align-items:center;gap:10px;margin:0;color:var(--muted)}.checkbox input{width:20px;min-height:20px;accent-color:var(--accent)}.note{margin:18px 0 0;color:#958a9d;font-size:.82rem;line-height:1.7}.result-burst{font-size:clamp(3rem,12vw,6rem);animation:pop .6s ease both}@keyframes pop{0%{transform:scale(.45) rotate(-8deg);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1)}}@media(max-width:600px){.wrap{padding:14px 12px 28px}.card{padding:18px;border-radius:23px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.pulse{width:150px;height:150px}.actions{grid-template-columns:1fr}.players{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><h1>🥁 節奏接龍</h1></div>
<section id="setup" class="card">
<div class="grid">
<div><label>BPM</label><input id="bpm" type="number" min="40" max="200" value="80"></div>
<div><label>玩家人數／拍數</label><input id="count" type="number" min="2" max="10" value="3"></div>
<div><label>本局題數</label><input id="rounds" type="number" min="1" max="100" value="10"></div>
<div><label>每題結束後倒數秒數</label><input id="nextDelay" type="number" min="0" max="30" value="3"></div>
<div><label>題目模式</label><select id="topicMode"><option value="random">隨機題庫</option><option value="custom">自訂題目</option></select></div>
<div class="wide"><label>自訂題目（每行一題）</label><textarea id="customTopics" rows="4"></textarea></div>
<div class="wide"><label>玩家名稱（每行一位）</label><textarea id="names" rows="4" placeholder="玩家 1&#10;玩家 2&#10;玩家 3"></textarea></div>
<label class="checkbox"><input id="speak" type="checkbox" checked> 語音念完整題目</label>
<label class="checkbox"><input id="sound" type="checkbox" checked> 本地鼓點音效</label>
</div>
<button id="start" class="primary" style="margin-top:16px">開始遊戲</button>
</section>
<section id="game" class="card hidden center">
<div class="progress">ROUND <span id="doneView">0</span> / <span id="totalView">10</span></div>
<div id="topicView" class="topic">—</div>
<div id="phrase" class="phrase">準備開始</div>
<div id="pulse" class="pulse"><span id="beatView" class="beat">♪</span></div>
<div id="autoNextView" class="countdown"></div>
<div id="players" class="players"></div>
<div class="actions"><button id="pause" class="ghost">暫停</button><button id="skip" class="skip">跳過</button><button id="next" class="primary wide">下一題（空白鍵）</button><button id="reset" class="ghost wide">重新開始</button></div>
<p class="note">題目一次念完後直接進入玩家拍點。每位玩家只亮一次，最後一拍後停止鼓聲，依設定秒數自動換題。跳過不扣題數。</p>
</section>
<section id="result" class="card hidden center"><div class="result-burst">🎉</div><div class="topic">遊戲完成</div><button onclick="location.reload()" class="primary">再玩一次</button></section>
</div>
<script>
const $=id=>document.getElementById(id);const TOPICS=['夜市小吃','水果','飲料','動物','國家','台灣地名','交通工具','便利商店商品','早餐店餐點','火鍋料','日本料理','甜點','冰品','職業','卡通角色','電影角色','歌手','家電','家具','文具','廚房用品','衣服','鞋子','顏色','程式語言','手機品牌','App','運動','台灣景點','超級英雄'];const DRUM_URL='./drum_hit.wav';let players=[],topics=[],used=[],current='',bpm=80,total=10,done=0,nextDelay=3,running=false,paused=false,phase='idle',timer=null,token=0,drumBuffer=null,audioCtx=null;function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function nextTopic(){if(!topics.length){topics=shuffle(used.length?used:TOPICS);used=[]}let t=topics.shift();if(t===current&&topics.length){topics.push(t);t=topics.shift()}used.push(t);current=t;return t}function render(active=-1){$('players').innerHTML=players.map((p,i)=>`<div class="pill ${i===active?'active':''}">第 ${i+1} 拍<br>${p}</div>`).join('')}function sleep(ms,my){return new Promise(r=>timer=setTimeout(()=>r(my===token),ms))}async function loadDrum(){if(drumBuffer)return;audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();await audioCtx.resume();const res=await fetch(DRUM_URL,{cache:'force-cache'});if(!res.ok)throw new Error('鼓聲載入失敗');drumBuffer=await audioCtx.decodeAudioData(await res.arrayBuffer())}function playDrum(){if(!$('sound').checked||!drumBuffer||!audioCtx)return;const s=audioCtx.createBufferSource();s.buffer=drumBuffer;s.connect(audioCtx.destination);s.start()}function speak(text){return new Promise(resolve=>{if(!$('speak').checked||!('speechSynthesis'in window)){resolve();return}const u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';u.rate=.95;u.onend=resolve;u.onerror=resolve;speechSynthesis.cancel();speechSynthesis.speak(u)})}async function beginRound(){if(!running||paused)return;phase='announce';const my=++token;current=nextTopic();$('topicView').textContent=current;$('phrase').textContent=`一想到 ${current}，我就想到`;$('autoNextView').textContent='';render(-1);$('beatView').textContent='♪';await speak(`一想到${current}，我就想到`);if(my!==token||paused)return;phase='beats';for(let i=0;i<players.length;i++){if(my!==token||paused||!running)return;render(i);$('phrase').textContent=`第 ${i+1} 拍：${players[i]} 回答第 ${i+1} 個字`;$('beatView').textContent=i+1;playDrum();$('pulse').classList.add('on');setTimeout(()=>$('pulse').classList.remove('on'),120);if(i<players.length-1&&!await sleep(60000/bpm,my))return}render(-1);phase='waiting';await autoNext(my)}async function autoNext(my){if(nextDelay===0){completeRound();return}for(let i=nextDelay;i>=1;i--){if(my!==token||paused||!running)return;$('autoNextView').textContent=`${i} 秒後下一題`;if(!await sleep(1000,my))return}$('autoNextView').textContent='';completeRound()}function completeRound(){if(!running||paused)return;done++;$('doneView').textContent=done;if(done>=total){finish();return}token++;clearTimeout(timer);beginRound()}async function start(){bpm=Math.max(40,Math.min(200,+$('bpm').value||80));total=Math.max(1,Math.min(100,+$('rounds').value||10));nextDelay=Math.max(0,Math.min(30,+$('nextDelay').value||0));const n=Math.max(2,Math.min(10,+$('count').value||3));const names=$('names').value.split('\n').map(x=>x.trim()).filter(Boolean);players=Array.from({length:n},(_,i)=>names[i]||`玩家 ${i+1}`);const custom=$('customTopics').value.split('\n').map(x=>x.trim()).filter(Boolean);topics=shuffle($('topicMode').value==='custom'&&custom.length?custom:TOPICS);used=[];done=0;running=true;paused=false;localStorage.rhythmSettings=JSON.stringify({bpm,count:n,rounds:total,nextDelay,topicMode:$('topicMode').value,customTopics:$('customTopics').value,names:$('names').value,speak:$('speak').checked,sound:$('sound').checked});$('setup').classList.add('hidden');$('game').classList.remove('hidden');$('doneView').textContent=0;$('totalView').textContent=total;render(-1);try{await loadDrum()}catch(e){$('sound').checked=false;$('phrase').textContent='本地鼓聲載入失敗，已切成靜音模式'}beginRound()}function next(){if(!running||paused)return;token++;clearTimeout(timer);$('autoNextView').textContent='';completeRound()}function skip(){if(!running||paused)return;token++;clearTimeout(timer);speechSynthesis?.cancel();$('autoNextView').textContent='';$('phrase').textContent='已跳過，不扣題數';setTimeout(beginRound,300)}function pause(){if(!running)return;paused=!paused;token++;clearTimeout(timer);speechSynthesis?.cancel();$('pause').textContent=paused?'繼續':'暫停';$('phrase').textContent=paused?'遊戲暫停':'重新開始本題';$('autoNextView').textContent='';if(!paused)setTimeout(beginRound,300)}function finish(){running=false;phase='done';token++;clearTimeout(timer);speechSynthesis?.cancel();$('game').classList.add('hidden');$('result').classList.remove('hidden')}function blurControl(){if(document.activeElement instanceof HTMLElement)document.activeElement.blur()}$('start').onclick=async()=>{blurControl();await start()};$('next').onclick=()=>{blurControl();next()};$('skip').onclick=()=>{blurControl();skip()};$('pause').onclick=()=>{blurControl();pause()};$('reset').onclick=()=>location.reload();try{const s=JSON.parse(localStorage.rhythmSettings||'{}');for(const k of ['bpm','count','rounds','nextDelay','topicMode','customTopics','names'])if(s[k]!=null)$(k).value=s[k];if(s.speak!=null)$('speak').checked=s.speak;if(s.sound!=null)$('sound').checked=s.sound}catch(e){}addEventListener('keydown',e=>{if(e.repeat)return;const tag=document.activeElement?.tagName;if(['INPUT','TEXTAREA','SELECT'].includes(tag))return;if(e.code==='Space'){e.preventDefault();blurControl();next();return}if(e.key.toLowerCase()==='s'){e.preventDefault();blurControl();skip();return}if(e.key==='Escape'){e.preventDefault();blurControl();pause()}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&running&&!paused)pause()});
</script>
</body>
</html>
