<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0d0d14">
<title>節奏接龍</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d0d14;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.wrap{max-width:800px;margin:auto;padding:18px}.top{display:flex;justify-content:center;align-items:center}.card{background:#171721;border:1px solid #29293a;border-radius:20px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{display:block;color:#aaa;font-size:.9rem;margin-bottom:6px}input,select,textarea,button{width:100%;min-height:46px;border-radius:12px;border:1px solid #343447;background:#20202d;color:#fff;padding:10px;font-size:1rem}button{font-weight:800}.primary{background:#f7971e;color:#111;border:0}.skip{background:#ffd166;color:#111;border:0}.ghost{background:#242433}.hidden{display:none!important}.center{text-align:center}.topic{font-size:clamp(2rem,9vw,4.2rem);font-weight:900;margin:10px 0}.phrase{font-size:clamp(1.25rem,5vw,2.1rem);font-weight:800;color:#ffd166;min-height:2.6em;display:grid;place-items:center}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:18px 0}.pill{padding:16px 8px;border-radius:14px;background:#272738;border:2px solid transparent;font-weight:800;transition:.1s}.pill.active{background:#f7971e;color:#111;border-color:#fff;transform:scale(1.06);box-shadow:0 0 28px rgba(247,151,30,.45)}.pulse{width:145px;height:145px;border-radius:50%;margin:16px auto;background:#2b2b3c;display:grid;place-items:center}.pulse.on{background:#f7971e;color:#111;transform:scale(1.12)}.beat{font-size:3.4rem;font-weight:900}.progress{font-weight:800;color:#ffd166}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.wide{grid-column:1/-1}.checkbox{display:flex;align-items:center;gap:8px}.checkbox input{width:auto;min-height:auto}.note{font-size:.85rem;color:#888;line-height:1.55}.countdown{font-size:clamp(2rem,9vw,4rem);font-weight:900;color:#ff8d96;min-height:1.2em}@media(max-width:560px){.grid{grid-template-columns:1fr}.wrap{padding:12px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><h1>🥁 節奏接龍</h1></div>
<section id="setup" class="card">
<div class="grid">
<div><label>BPM</label><input id="bpm" type="number" min="40" max="200" value="80"></div>
<div><label>玩家人數／拍數</label><input id="count" type="number" min="2" max="10" value="3"></div>
<div><label>本局題數</label><input id="rounds" type="number" min="1" max="100" value="10"></div>
<div><label>每題結束後倒數秒數</label><input id="nextDelay" type="number" min="0" max="30" value="3"></div>
<div><label>題目模式</label><select id="topicMode"><option value="random">隨機題庫</option><option value="custom">自訂題目</option></select></div>
<div class="wide"><label>自訂題目（每行一題）</label><textarea id="customTopics" rows="4"></textarea></div>
<div class="wide"><label>玩家名稱（每行一位）</label><textarea id="names" rows="4" placeholder="玩家 1&#10;玩家 2&#10;玩家 3"></textarea></div>
<label class="checkbox"><input id="speak" type="checkbox" checked> 語音念完整題目</label>
<label class="checkbox"><input id="sound" type="checkbox" checked> 真實 TR-808 鼓聲</label>
</div>
<button id="start" class="primary" style="margin-top:14px">開始遊戲</button>
</section>
<section id="game" class="card hidden center">
<div class="progress">完成 <span id="doneView">0</span> / <span id="totalView">10</span> 題</div>
<div id="topicView" class="topic">—</div>
<div id="phrase" class="phrase">準備開始</div>
<div id="pulse" class="pulse"><span id="beatView" class="beat">♪</span></div>
<div id="autoNextView" class="countdown"></div>
<div id="players" class="players"></div>
<div class="actions">
<button id="pause" class="ghost">暫停</button>
<button id="skip" class="skip">跳過</button>
<button id="next" class="primary wide">立即下一題（空白鍵）</button>
<button id="reset" class="ghost wide">重新開始</button>
</div>
<p class="note">題目會一次完整念完，接著直接開始玩家拍點，不再有預備拍。每位玩家只亮一次；最後一拍結束後停止鼓聲，依設定秒數自動換下一題。設為 0 秒時立即換題。跳過不扣題數。</p>
</section>
<section id="result" class="card hidden center"><div class="topic">遊戲完成 🎉</div><button onclick="location.reload()" class="primary">再玩一次</button></section>
</div>
<script>
const $=id=>document.getElementById(id);
const TOPICS=['夜市小吃','水果','飲料','動物','國家','台灣地名','交通工具','便利商店商品','早餐店餐點','火鍋料','日本料理','甜點','冰品','職業','卡通角色','電影角色','歌手','家電','家具','文具','廚房用品','衣服','鞋子','顏色','程式語言','手機品牌','App','運動','台灣景點','超級英雄'];
const DRUM_URL='https://danigb.github.io/samples/audio/drum-machines/TR-808/bd/bd5000.mp3';
let players=[],topics=[],used=[],current='',bpm=80,total=10,nextDelay=3,done=0,running=false,paused=false,phase='idle',timer=null,token=0,drumBuffer=null,audioCtx=null;
function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function nextTopic(){if(!topics.length){topics=shuffle(used.length?used:TOPICS);used=[]}let t=topics.shift();if(t===current&&topics.length){topics.push(t);t=topics.shift()}used.push(t);current=t;return t}
function render(active=-1){$('players').innerHTML=players.map((p,i)=>`<div class="pill ${i===active?'active':''}">第 ${i+1} 拍<br>${p}</div>`).join('')}
function sleep(ms,my){return new Promise(r=>timer=setTimeout(()=>r(my===token),ms))}
async function loadDrum(){if(drumBuffer)return;audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();await audioCtx.resume();const res=await fetch(DRUM_URL);if(!res.ok)throw new Error('鼓聲載入失敗');drumBuffer=await audioCtx.decodeAudioData(await res.arrayBuffer())}
function playDrum(){if(!$('sound').checked||!drumBuffer||!audioCtx)return;const s=audioCtx.createBufferSource();s.buffer=drumBuffer;s.connect(audioCtx.destination);s.start()}
function speak(text){return new Promise(resolve=>{if(!$('speak').checked||!('speechSynthesis'in window)){resolve();return}const u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';u.rate=.95;u.onend=resolve;u.onerror=resolve;speechSynthesis.cancel();speechSynthesis.speak(u)})}
async function beginRound(){if(!running||paused)return;phase='announce';const my=++token;current=nextTopic();$('topicView').textContent=current;$('phrase').textContent=`一想到 ${current}，我就想到`;$('beatView').textContent='♪';$('autoNextView').textContent='';render(-1);await speak(`一想到${current}，我就想到`);if(my!==token||paused||!running)return;await runSingleCycle(my)}
async function runSingleCycle(my){phase='beats';const beatMs=60000/bpm;for(let i=0;i<players.length;i++){if(my!==token||paused||!running)return;render(i);$('phrase').textContent=`第 ${i+1} 拍：${players[i]} 回答第 ${i+1} 個字`;$('beatView').textContent=i+1;playDrum();$('pulse').classList.add('on');setTimeout(()=>$('pulse').classList.remove('on'),120);if(!await sleep(beatMs,my))return}if(my!==token||paused||!running)return;render(-1);$('beatView').textContent='✓';$('phrase').textContent='本題結束';completeRound(my)}
async function completeRound(my){phase='waiting';done++;$('doneView').textContent=done;if(done>=total){finish();return}if(nextDelay===0){beginRound();return}for(let sec=nextDelay;sec>=1;sec--){if(my!==token||paused||!running||phase!=='waiting')return;$('autoNextView').textContent=`${sec} 秒後下一題`;if(!await sleep(1000,my))return}$('autoNextView').textContent='';if(my===token&&!paused&&running)beginRound()}
async function start(){bpm=Math.max(40,Math.min(200,+$('bpm').value||80));total=Math.max(1,Math.min(100,+$('rounds').value||10));nextDelay=Math.max(0,Math.min(30,Number($('nextDelay').value)||0));const n=Math.max(2,Math.min(10,+$('count').value||3));const names=$('names').value.split('\n').map(x=>x.trim()).filter(Boolean);players=Array.from({length:n},(_,i)=>names[i]||`玩家 ${i+1}`);const custom=$('customTopics').value.split('\n').map(x=>x.trim()).filter(Boolean);topics=shuffle($('topicMode').value==='custom'&&custom.length?custom:TOPICS);used=[];done=0;running=true;paused=false;localStorage.rhythmSettings=JSON.stringify({bpm,total,count:n,nextDelay,topicMode:$('topicMode').value,customTopics:$('customTopics').value,names:$('names').value,speak:$('speak').checked,sound:$('sound').checked});$('setup').classList.add('hidden');$('game').classList.remove('hidden');$('doneView').textContent=0;$('totalView').textContent=total;render(-1);try{await loadDrum()}catch(e){$('sound').checked=false;$('phrase').textContent='真實鼓聲載入失敗，已切成靜音模式'}beginRound()}
function manualNext(){if(!running||paused||!['beats','waiting'].includes(phase))return;token++;clearTimeout(timer);speechSynthesis?.cancel();if(phase==='beats'){done++;$('doneView').textContent=done}if(done>=total){finish();return}beginRound()}
function skip(){if(!running||paused)return;token++;clearTimeout(timer);speechSynthesis?.cancel();$('phrase').textContent='已跳過，不扣題數';$('autoNextView').textContent='';setTimeout(()=>{if(running&&!paused)beginRound()},300)}
function pause(){if(!running)return;paused=!paused;token++;clearTimeout(timer);speechSynthesis?.cancel();$('pause').textContent=paused?'繼續':'暫停';$('phrase').textContent=paused?'遊戲暫停':'重新開始本題';$('autoNextView').textContent='';if(!paused)setTimeout(beginRound,300)}
function finish(){running=false;phase='done';token++;clearTimeout(timer);speechSynthesis?.cancel();$('game').classList.add('hidden');$('result').classList.remove('hidden')}
function blurControl(){if(document.activeElement instanceof HTMLElement)document.activeElement.blur()}
$('start').onclick=async()=>{blurControl();await start()};$('next').onclick=()=>{blurControl();manualNext()};$('skip').onclick=()=>{blurControl();skip()};$('pause').onclick=()=>{blurControl();pause()};$('reset').onclick=()=>location.reload();
try{const s=JSON.parse(localStorage.rhythmSettings||'{}');if(s.bpm!=null)$('bpm').value=s.bpm;if(s.total!=null)$('rounds').value=s.total;if(s.count!=null)$('count').value=s.count;if(s.nextDelay!=null)$('nextDelay').value=s.nextDelay;if(s.topicMode)$('topicMode').value=s.topicMode;if(s.customTopics!=null)$('customTopics').value=s.customTopics;if(s.names!=null)$('names').value=s.names;if(s.speak!=null)$('speak').checked=s.speak;if(s.sound!=null)$('sound').checked=s.sound}catch(e){}
addEventListener('keydown',e=>{if(e.repeat)return;const tag=document.activeElement?.tagName;if(['INPUT','TEXTAREA','SELECT'].includes(tag))return;if(e.code==='Space'){e.preventDefault();blurControl();manualNext();return}if(e.key.toLowerCase()==='s'){e.preventDefault();blurControl();skip();return}if(e.key==='Escape'){e.preventDefault();blurControl();pause()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&running&&!paused)pause()});
</script>
</body>
</html>
