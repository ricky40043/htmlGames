<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0d0d14"><title>節奏接龍</title><style>*{box-sizing:border-box}body{margin:0;background:#0d0d14;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}a{color:#8ec5ff}.wrap{max-width:760px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.card{background:#171721;border:1px solid #29293a;border-radius:20px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{display:block;color:#aaa;font-size:.9rem;margin-bottom:6px}input,select,textarea,button{width:100%;min-height:46px;border-radius:12px;border:1px solid #343447;background:#20202d;color:#fff;padding:10px;font-size:1rem}button{cursor:pointer;font-weight:700}.primary{background:#f7971e;color:#111;border:0}.danger{background:#d94b55;border:0}.ghost{background:#242433}.hidden{display:none!important}.center{text-align:center}.big{font-size:clamp(3rem,14vw,7rem);font-weight:900;line-height:1.1}.topic{font-size:clamp(1.8rem,8vw,3.5rem);font-weight:800}.muted{color:#888}.players{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.pill{padding:8px 12px;border-radius:999px;background:#272738}.active{background:#f7971e;color:#111}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.wide{grid-column:1/-1}.pulse{width:130px;height:130px;border-radius:50%;margin:18px auto;background:#2b2b3c;display:grid;place-items:center;transition:.12s}.pulse.on{transform:scale(1.14);background:#f7971e;color:#111}@media(max-width:520px){.grid{grid-template-columns:1fr}.actions{grid-template-columns:1fr 1fr}.wrap{padding:14px}}</style></head><body><div class="wrap"><div class="top"><a href="../index.html">← 回首頁</a><h1>🥁 節奏接龍</h1><span></span></div><section id="setup" class="card"><div class="grid"><div><label>BPM</label><input id="bpm" type="number" min="40" max="200" value="80"></div><div><label>玩家人數</label><input id="count" type="number" min="2" max="10" value="3"></div><div><label>每人回答拍數</label><input id="beats" type="number" min="2" max="8" value="3"></div><div><label>題目</label><select id="topic"><option>夜市小吃</option><option>水果</option><option>動物</option><option>國家</option><option>台灣地名</option><option>交通工具</option><option>便利商店商品</option><option value="custom">自訂</option></select></div><div class="wide"><label>自訂題目</label><input id="custom" placeholder="選擇自訂時使用"></div><div class="wide"><label>玩家名稱（每行一位，可留空）</label><textarea id="names" rows="4" placeholder="Ricky&#10;小明&#10;小美"></textarea></div><div><label><input id="speak" type="checkbox" style="width:auto;min-height:auto"> 播報題目</label></div><div><label><input id="sound" type="checkbox" checked style="width:auto;min-height:auto"> 節拍音效</label></div></div><button id="start" class="primary" style="margin-top:14px">開始遊戲</button></section><section id="game" class="card hidden center"><div class="muted">題目</div><div id="topicView" class="topic"></div><div id="player" class="topic" style="margin-top:18px"></div><div id="pulse" class="pulse"><span id="beatView" class="big" style="font-size:3rem">1</span></div><div id="players" class="players"></div><div class="actions" style="margin-top:18px"><button id="pause" class="ghost">暫停</button><button id="fail" class="danger">失敗</button><button id="success" class="primary wide">回答成功／下一位（空白鍵）</button><button id="reset" class="ghost wide">重新開始</button></div></section></div><script>const $=id=>document.getElementById(id);let ctx,nextTime,timer,running=false,paused=false,beat=0,player=0,players=[],beatsPer=3,bpm=80;function save(){localStorage.rhythmSettings=JSON.stringify({bpm:$('bpm').value,count:$('count').value,beats:$('beats').value,topic:$('topic').value,custom:$('custom').value,names:$('names').value,sound:$('sound').checked,speak:$('speak').checked})}try{const s=JSON.parse(localStorage.rhythmSettings||'{}');for(const k of ['bpm','count','beats','topic','custom','names'])if(s[k]!=null)$(k).value=s[k];if(s.sound!=null)$('sound').checked=s.sound;if(s.speak!=null)$('speak').checked=s.speak}catch(e){}function click(accent=false){if(!$('sound').checked)return;const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=accent?900:600;g.gain.setValueAtTime(.12,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.08);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.09)}function schedule(){if(!running||paused)return;while(nextTime<ctx.currentTime+.12){const delay=Math.max(0,(nextTime-ctx.currentTime)*1000);setTimeout(()=>{beat=(beat%beatsPer)+1;$('beatView').textContent=beat;click(beat===1);$('pulse').classList.add('on');setTimeout(()=>$('pulse').classList.remove('on'),120)},delay);nextTime+=60/bpm}timer=setTimeout(schedule,25)}function render(){$('player').textContent='目前玩家：'+players[player];$('players').innerHTML=players.map((p,i)=>`<span class="pill ${i===player?'active':''}">${p}</span>`).join('')}async function start(){save();bpm=Math.max(40,Math.min(200,+$('bpm').value));beatsPer=Math.max(2,Math.min(8,+$('beats').value));const n=Math.max(2,Math.min(10,+$('count').value));let ns=$('names').value.split('\n').map(x=>x.trim()).filter(Boolean);players=Array.from({length:n},(_,i)=>ns[i]||`玩家 ${i+1}`);player=0;beat=0;ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();$('topicView').textContent=$('topic').value==='custom'?($('custom').value.trim()||'自訂題目'):$('topic').value;$('setup').classList.add('hidden');$('game').classList.remove('hidden');render();if($('speak').checked&&speechSynthesis){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance('題目是：'+$('topicView').textContent))}running=true;paused=false;nextTime=ctx.currentTime+.3;schedule()}function next(){if(!running||paused)return;player=(player+1)%players.length;beat=0;render()}$('start').onclick=start;$('success').onclick=next;$('fail').onclick=()=>{if(!running)return;alert(players[player]+' 本輪失敗');next()};$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'繼續':'暫停';if(!paused){nextTime=ctx.currentTime+.2;schedule()}};$('reset').onclick=()=>location.reload();addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&!['INPUT','TEXTAREA','SELECT','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();next()}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&running&&!paused)$('pause').click()});</script></body></html>
