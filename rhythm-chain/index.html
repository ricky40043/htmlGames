<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10060d"><title>節奏接龍</title><style>:root{--a:#ff8a1f;--b:#ff315f;--g:#ffe06b;--m:#b8a9bd}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07050b;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow-x:hidden;background:radial-gradient(circle at 20% 12%,#6b152c66,transparent 30%),radial-gradient(circle at 80% 10%,#7a3e1160,transparent 28%),linear-gradient(145deg,#08050c,#190814 55%,#09060d)}.scan{position:fixed;inset:-45%;pointer-events:none;background:linear-gradient(115deg,transparent 43%,#ffb34712 48%,#fff5 50%,#ff315f14 52%,transparent 57%);animation:scan 7s linear infinite}.flash{position:fixed;inset:0;z-index:8;pointer-events:none;background:#ffb53b;opacity:0}.flash.on{animation:flash .12s}.wrap{position:relative;z-index:2;max-width:940px;margin:auto;padding:22px 16px 42px}.top{text-align:center}.top:before{content:"RHYTHM ARENA";display:inline-block;padding:7px 14px;border:1px solid #ffe06b70;border-radius:999px;color:var(--g);font-size:.72rem;font-weight:900;letter-spacing:.22em;background:#ffe06b12;box-shadow:0 0 24px #ff8a1f28}h1{font-size:clamp(2.2rem,8vw,4.8rem);margin:12px 0 18px;text-shadow:0 0 18px #ff315f88,0 0 55px #ff8a1f45}.card{position:relative;overflow:hidden;background:linear-gradient(145deg,#251326e8,#100b18e8);border:1px solid #ffffff20;border-radius:30px;padding:24px;margin:18px 0;box-shadow:0 30px 90px #0009,0 0 55px #ff315f16,inset 0 1px #fff2;backdrop-filter:blur(20px)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.grid>div,.checkbox,.mode-panel{padding:13px;border-radius:18px;background:#ffffff08;border:1px solid #ffffff12}.wide,.mode-panel{grid-column:1/-1}label{display:block;color:var(--m);font-size:.82rem;font-weight:900;margin-bottom:7px}input,select,textarea,button{width:100%;min-height:50px;border-radius:15px;border:1px solid #ffffff1e;background:#08070dc7;color:#fff;padding:12px 14px;font-size:1rem;outline:none}button{cursor:pointer;border:0;font-weight:900;box-shadow:0 9px 26px #0005}.primary{background:linear-gradient(135deg,var(--g),var(--a));color:#261002}.skip{background:linear-gradient(135deg,#ffe99a,#eab432);color:#241900}.ghost{background:#ffffff0c;border:1px solid #ffffff1e}.hidden{display:none!important}.center{text-align:center}.progress{display:inline-flex;padding:8px 14px;border-radius:999px;background:#fff1;border:1px solid #fff2;color:var(--g);font-weight:900}.topic{font-size:clamp(2.7rem,11vw,6rem);font-weight:1000;letter-spacing:-.06em;margin:22px 0 5px;background:linear-gradient(#fff,#ffd6ae);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 30px #ff8a1f44)}.phrase{min-height:2.8em;display:grid;place-items:center;font-size:clamp(1.1rem,4vw,1.8rem);font-weight:900;color:#ffe6c3}.pulse{position:relative;width:190px;height:190px;margin:22px auto;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#241329 42%,#0e0914 43%);box-shadow:0 0 55px #ff315f2b;transition:.12s}.pulse:before,.pulse:after{content:"";position:absolute;border-radius:50%;inset:-17px;border:2px dashed #ff8a1f66;animation:spin 9s linear infinite}.pulse:after{inset:-34px;border-color:#ff315f33;animation-direction:reverse}.pulse.on{background:radial-gradient(circle,#fff5a8,#ff9a24 45%,#ff315f);color:#220608;transform:scale(1.1);box-shadow:0 0 90px #ff8a1fcc}.beat{font-size:5rem;font-weight:1000}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:12px;margin:28px 0}.pill{position:relative;padding:18px 10px;border-radius:18px;color:#b9aebe;background:#ffffff09;border:1px solid #ffffff15;font-weight:1000;transition:.18s}.pill.active{color:#251004;background:linear-gradient(135deg,var(--g),var(--a));transform:translateY(-7px) scale(1.06);box-shadow:0 18px 50px #ff8a1f66}.pill.active:after{content:"⚡ NOW";position:absolute;top:-13px;right:8px;background:#fff;color:#e52650;padding:4px 8px;border-radius:999px;font-size:.65rem}.actions,.setup-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.checkbox{display:flex;align-items:center;gap:10px}.checkbox input{width:20px;min-height:20px;accent-color:var(--a)}.countdown{min-height:1.2em;font-size:clamp(1.8rem,8vw,3.5rem);font-weight:1000;color:#ff7999}.note{color:#95899b;font-size:.82rem}.topic-tools{display:flex;gap:9px;margin:8px 0 12px}.topic-tools button{min-height:40px;padding:8px 12px}.topic-checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px;max-height:300px;overflow:auto;padding:5px}.topic-option{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:13px;background:#09070f;border:1px solid #ffffff17;color:#f7e8ef;font-size:.9rem;cursor:pointer}.topic-option input{width:18px;min-height:18px;accent-color:var(--a)}.pick-order{margin-left:auto;min-width:24px;height:24px;display:grid;place-items:center;border-radius:50%;background:linear-gradient(135deg,var(--g),var(--a));color:#251004;font-size:.75rem}.pick-order:empty{display:none}.intro{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(circle,#4a1835dd,#09040df7 65%)}.intro-num{font-size:clamp(7rem,32vw,15rem);font-weight:1000;text-shadow:0 0 35px #ff315f,0 0 95px #ff8a1f}.electric:before{content:"";position:fixed;inset:0;z-index:4;pointer-events:none;background:repeating-linear-gradient(125deg,transparent 0 47%,#fff 48%,#ffde6b 49%,transparent 50%);mix-blend-mode:screen;opacity:.22;animation:zap .4s ease}@keyframes scan{to{transform:translateX(45%)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes flash{50%{opacity:.22}}@keyframes zap{to{opacity:0;transform:translateX(8%)}}@media(max-width:600px){.wrap{padding:14px 11px 28px}.card{padding:18px;border-radius:23px}.grid,.actions,.setup-actions{grid-template-columns:1fr}.wide{grid-column:auto}.pulse{width:150px;height:150px}.players{grid-template-columns:repeat(2,1fr)}.topic-checks{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><div class="scan"></div><div id="flash" class="flash"></div><div id="intro" class="intro hidden"><div id="introNum" class="intro-num">3</div></div><div class="wrap"><div class="top"><h1>🥁 節奏接龍</h1></div><section id="setup" class="card"><div class="grid"><div><label>BPM</label><input id="bpm" type="number" min="40" max="200" value="80"></div><div><label>玩家人數／拍數</label><input id="count" type="number" min="2" max="10" value="3"></div><div><label>本局題數</label><input id="rounds" type="number" min="1" max="100" value="10"></div><div><label>每題結束後倒數秒數</label><input id="nextDelay" type="number" min="0" max="30" value="3"></div><div class="wide"><label>題目來源</label><select id="topicMode"><option value="random">隨機：完整題庫</option><option value="selected">勾選：依勾選順序出題</option><option value="custom">自訂：每行一題</option></select></div><div id="bankPanel" class="mode-panel"><label>內建題庫（數字代表出題順序）</label><div class="topic-tools"><button id="selectAll" type="button" class="ghost">全選</button><button id="clearAll" type="button" class="ghost">清除</button></div><div id="topicChecks" class="topic-checks"></div></div><div id="customPanel" class="wide hidden"><label>自訂題目（每行一題）</label><textarea id="customTopics" rows="5"></textarea></div><div class="wide"><label>玩家名稱（每行一位）</label><textarea id="names" rows="4"></textarea></div><div class="wide"><label>人聲選擇</label><select id="voice"><option value="">系統預設中文人聲</option></select></div><label class="checkbox"><input id="speak" type="checkbox" checked> 語音念完整題目</label><label class="checkbox"><input id="sound" type="checkbox" checked> 鼓點音效</label></div><div class="setup-actions"><button id="preview" class="ghost">試玩題目與拍點</button><button id="start" class="primary">進入競技場</button></div></section><section id="game" class="card hidden center"><div class="progress">ROUND <span id="doneView">0</span> / <span id="totalView">10</span></div><div id="topicView" class="topic">—</div><div id="phrase" class="phrase">準備開始</div><div id="pulse" class="pulse"><span id="beatView" class="beat">♪</span></div><div id="autoNextView" class="countdown"></div><div id="players" class="players"></div><div class="actions"><button id="pause" class="ghost">暫停</button><button id="skip" class="skip">跳過</button><button id="next" class="primary wide">下一題（空白鍵）</button><button id="reset" class="ghost wide">重新開始</button></div><p class="note">勾選模式會依照點選順序出題；取消後重新勾選會排到最後。</p></section><section id="result" class="card hidden center"><div class="topic">🏆 挑戰完成</div><button onclick="location.reload()" class="primary">再玩一次</button></section></div><script>const $=id=>document.getElementById(id),TOPICS=['夜市小吃','水果','飲料','動物','國家','台灣地名','交通工具','便利商店商品','早餐店餐點','火鍋料','日本料理','甜點','冰品','職業','卡通角色','電影角色','歌手','家電','家具','文具','廚房用品','衣服','鞋子','顏色','程式語言','手機品牌','App','運動','台灣景點','超級英雄'],DRUM_URL='./drum_hit.wav';let players=[],topics=[],orderedSource=[],current='',bpm=80,total=10,done=0,nextDelay=3,running=false,paused=false,starting=false,timer=null,token=0,audioCtx=null,drumBuffer=null,voices=[],selectedOrder=[];function esc(t){return t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function renderBank(list=TOPICS){selectedOrder=[...list];$('topicChecks').innerHTML=TOPICS.map(t=>{const i=selectedOrder.indexOf(t);return `<label class="topic-option"><input type="checkbox" value="${esc(t)}" ${i>=0?'checked':''}><span>${esc(t)}</span><b class="pick-order">${i>=0?i+1:''}</b></label>`}).join('');$('topicChecks').querySelectorAll('input').forEach(x=>x.onchange=()=>{if(x.checked){if(!selectedOrder.includes(x.value))selectedOrder.push(x.value)}else selectedOrder=selectedOrder.filter(t=>t!==x.value);updateOrder()})}function updateOrder(){$('topicChecks').querySelectorAll('.topic-option').forEach(l=>{const i=selectedOrder.indexOf(l.querySelector('input').value);l.querySelector('b').textContent=i>=0?i+1:''})}function selectedTopics(){return selectedOrder.filter(t=>TOPICS.includes(t))}function syncMode(){const m=$('topicMode').value;$('bankPanel').classList.toggle('hidden',m==='custom');$('customPanel').classList.toggle('hidden',m!=='custom')}function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function sleep(ms,my){return new Promise(r=>timer=setTimeout(()=>r(my===token),ms))}function render(active=-1){$('players').innerHTML=players.map((p,i)=>`<div class="pill ${i===active?'active':''}">第 ${i+1} 拍<br>${p}</div>`).join('')}function nextTopic(){if(!topics.length)topics=orderedSource.length?[...orderedSource]:shuffle(TOPICS);return current=topics.shift()}async function loadDrum(){if(drumBuffer)return;audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();await audioCtx.resume();const r=await fetch(DRUM_URL+'?v=7');drumBuffer=await audioCtx.decodeAudioData(await r.arrayBuffer())}function hitFx(){document.body.classList.remove('electric');void document.body.offsetWidth;document.body.classList.add('electric');$('flash').classList.add('on');setTimeout(()=>{$('flash').classList.remove('on');document.body.classList.remove('electric')},350)}function playDrum(){hitFx();if(!$('sound').checked||!drumBuffer)return;const s=audioCtx.createBufferSource(),g=audioCtx.createGain();g.gain.value=1.45;s.buffer=drumBuffer;s.connect(g).connect(audioCtx.destination);s.start()}function loadVoices(){if(!speechSynthesis)return;voices=speechSynthesis.getVoices();const prev=$('voice').value;$('voice').innerHTML='<option value="">系統預設中文人聲</option>'+voices.map((v,i)=>({v,i})).filter(x=>/^zh/i.test(x.v.lang)).map(x=>`<option value="${x.i}">${x.v.name}（${x.v.lang}）</option>`).join('');$('voice').value=prev}function utter(t){const u=new SpeechSynthesisUtterance(t),i=$('voice').value;if(i!==''&&voices[+i])u.voice=voices[+i];u.lang=u.voice?.lang||'zh-TW';u.rate=Math.max(.4,Math.min(2,bpm/100));return u}function warmSpeech(){return new Promise(r=>{if(!$('speak').checked||!speechSynthesis)return r();const u=utter('準備');u.volume=.01;u.rate=2;u.onend=u.onerror=r;speechSynthesis.cancel();speechSynthesis.speak(u);setTimeout(r,900)})}function speak(t){return new Promise(r=>{if(!$('speak').checked||!speechSynthesis)return r();const u=utter(t);let done=false;const finish=()=>{if(done)return;done=true;r()};u.onend=u.onerror=finish;speechSynthesis.cancel();speechSynthesis.speak(u);setTimeout(()=>{if(!speechSynthesis.speaking) speechSynthesis.speak(u)},700);setTimeout(finish,15000)})}async function intro(){const my=token;$('intro').classList.remove('hidden');for(let n=3;n>=1;n--){$('introNum').textContent=n;if(!await sleep(1000,my))return false}$('introNum').textContent='GO!';if(!await sleep(600,my))return false;$('intro').classList.add('hidden');return true}async function beginRound(){if(!running||paused)return;const my=++token,current=nextTopic();$('topicView').textContent=current;$('phrase').textContent=`一想到 ${current}，我就想到`;$('autoNextView').textContent='';render();$('beatView').textContent='♪';await speak(`一想到${current}，我就想到`);if(my!==token||paused||!running)return;const beatMs=60000/bpm;for(let i=0;i<players.length;i++){render(i);$('phrase').textContent=`第 ${i+1} 拍：${players[i]}`;$('beatView').textContent=i+1;playDrum();$('pulse').classList.add('on');setTimeout(()=>$('pulse').classList.remove('on'),150);if(!await sleep(beatMs,my))return}render();if(nextDelay===0)return completeRound();for(let i=nextDelay;i>=1;i--){$('autoNextView').textContent=`${i} 秒後下一題`;if(!await sleep(1000,my))return}completeRound()}function completeRound(){if(!running||paused)return;done++;$('doneView').textContent=done;if(done>=total)return finish();token++;clearTimeout(timer);beginRound()}async function start(){if(starting)return;starting=true;bpm=Math.max(40,Math.min(200,+$('bpm').value||80));total=Math.max(1,Math.min(100,+$('rounds').value||10));nextDelay=Math.max(0,Math.min(30,+$('nextDelay').value||0));const n=Math.max(2,Math.min(10,+$('count').value||3)),names=$('names').value.split('\n').map(x=>x.trim()).filter(Boolean);players=Array.from({length:n},(_,i)=>names[i]||`玩家 ${i+1}`);const mode=$('topicMode').value,custom=$('customTopics').value.split('\n').map(x=>x.trim()).filter(Boolean),chosen=selectedTopics();let source=TOPICS;if(mode==='selected')source=chosen.length?chosen:TOPICS;if(mode==='custom')source=custom.length?custom:TOPICS;orderedSource=mode==='selected'?[...source]:[];topics=mode==='selected'?[...source]:shuffle(source);done=0;running=true;paused=false;token++;localStorage.rhythmSettings=JSON.stringify({bpm,count:n,rounds:total,nextDelay,topicMode:mode,customTopics:$('customTopics').value,names:$('names').value,speak:$('speak').checked,sound:$('sound').checked,voice:$('voice').value,selectedTopics:selectedOrder});$('setup').classList.add('hidden');$('game').classList.remove('hidden');$('doneView').textContent=0;$('totalView').textContent=total;render();try{await loadDrum()}catch{}await warmSpeech();const ok=await intro();starting=false;if(ok)beginRound()}async function preview(){bpm=+$('bpm').value||80;try{await loadDrum()}catch{}await warmSpeech();await speak('一想到夜市小吃，我就想到');for(let i=0;i<3;i++){playDrum();await new Promise(r=>setTimeout(r,60000/bpm))}}function next(){if(!running||paused||starting)return;token++;clearTimeout(timer);completeRound()}function skip(){if(!running||paused||starting)return;token++;clearTimeout(timer);speechSynthesis?.cancel();setTimeout(beginRound,250)}function pause(){if(!running||starting)return;paused=!paused;token++;clearTimeout(timer);speechSynthesis?.cancel();$('pause').textContent=paused?'繼續':'暫停';if(!paused)setTimeout(beginRound,250)}function finish(){running=false;token++;clearTimeout(timer);$('game').classList.add('hidden');$('result').classList.remove('hidden')}function blur(){document.activeElement?.blur()}$('topicMode').onchange=syncMode;$('selectAll').onclick=()=>renderBank(TOPICS);$('clearAll').onclick=()=>renderBank([]);$('preview').onclick=()=>{blur();preview()};$('start').onclick=()=>{blur();start()};$('next').onclick=()=>{blur();next()};$('skip').onclick=()=>{blur();skip()};$('pause').onclick=()=>{blur();pause()};$('reset').onclick=()=>location.reload();let saved={};try{saved=JSON.parse(localStorage.rhythmSettings||'{}');for(const k of ['bpm','count','rounds','nextDelay','topicMode','customTopics','names'])if(saved[k]!=null)$(k).value=saved[k];if(saved.speak!=null)$('speak').checked=saved.speak;if(saved.sound!=null)$('sound').checked=saved.sound}catch{}renderBank(Array.isArray(saved.selectedTopics)?saved.selectedTopics:TOPICS);syncMode();loadVoices();speechSynthesis.onvoiceschanged=loadVoices;addEventListener('keydown',e=>{if(e.repeat||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;if(e.code==='Space'){e.preventDefault();blur();next()}else if(e.key.toLowerCase()==='s'){e.preventDefault();blur();skip()}else if(e.key==='Escape')pause()});</script></body></html>
