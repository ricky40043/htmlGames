<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0d0d14">
<title>節奏接龍</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d0d14;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}a{color:#8ec5ff}.wrap{max-width:800px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.top h1{margin:0;font-size:1.45rem}.card{background:#171721;border:1px solid #29293a;border-radius:20px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{display:block;color:#aaa;font-size:.9rem;margin-bottom:6px}input,select,textarea,button{width:100%;min-height:46px;border-radius:12px;border:1px solid #343447;background:#20202d;color:#fff;padding:10px;font-size:1rem}button{cursor:pointer;font-weight:750}.primary{background:#f7971e;color:#111;border:0}.danger{background:#d94b55;border:0}.skip{background:#ffd166;color:#111;border:0}.ghost{background:#242433}.hidden{display:none!important}.center{text-align:center}.topic{font-size:clamp(2rem,9vw,4.2rem);font-weight:900;line-height:1.15;margin:10px 0}.phrase{font-size:clamp(1.3rem,5vw,2.2rem);font-weight:800;color:#ffd166;min-height:2.7em;display:grid;place-items:center}.muted{color:#888}.players{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.pill{padding:8px 12px;border-radius:999px;background:#272738}.active{background:#f7971e;color:#111}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.wide{grid-column:1/-1}.pulse{width:140px;height:140px;border-radius:50%;margin:18px auto;background:#2b2b3c;display:grid;place-items:center;transition:.1s}.pulse.on{transform:scale(1.14);background:#f7971e;color:#111}.beat{font-size:3.2rem;font-weight:900}.status{font-size:1.05rem;color:#aaa;margin:8px 0}.progress{font-weight:800;color:#ffd166}.countdown{font-size:clamp(2.8rem,14vw,6rem);font-weight:900;color:#ff8d96;min-height:1.2em}.checkbox{display:flex;align-items:center;gap:8px;color:#ddd}.checkbox input{width:auto;min-height:auto}.note{font-size:.85rem;color:#777;line-height:1.5}.topic-list{font-size:.82rem;color:#777;margin-top:8px}.flash{animation:flash .25s}@keyframes flash{50%{transform:scale(1.04)}}
@media(max-width:560px){.grid{grid-template-columns:1fr}.actions{grid-template-columns:1fr 1fr}.wrap{padding:12px}.card{padding:16px}.top h1{font-size:1.2rem}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><a href="../index.html">← 回首頁</a><h1>🥁 節奏接龍</h1><span></span></div>
<section id="setup" class="card">
<div class="grid">
<div><label>BPM</label><input id="bpm" type="number" min="40" max="200" value="80"></div>
<div><label>玩家人數</label><input id="count" type="number" min="2" max="10" value="3"></div>
<div><label>本局完成題數</label><input id="rounds" type="number" min="1" max="100" value="10"></div>
<div><label>回答後等待秒數</label><input id="waitSeconds" type="number" min="1" max="10" value="3"></div>
<div class="wide"><label>題目模式</label><select id="topicMode"><option value="random">隨機題庫</option><option value="custom">自訂題目清單</option></select></div>
<div class="wide"><label>自訂題目（每行一題）</label><textarea id="customTopics" rows="4" placeholder="夜市小吃&#10;水果&#10;交通工具"></textarea></div>
<div class="wide"><label>玩家名稱（每行一位，可留空）</label><textarea id="names" rows="4" placeholder="Ricky&#10;小明&#10;小美"></textarea></div>
<label class="checkbox"><input id="speak" type="checkbox" checked> AI 語音念題目</label>
<label class="checkbox"><input id="sound" type="checkbox" checked> 節拍音效</label>
</div>
<p class="topic-list">內建題庫：夜市小吃、水果、飲料、動物、國家、台灣地名、交通工具、便利商店商品、早餐店餐點、火鍋料、日本料理、甜點、冰品、職業、卡通角色、電影角色、歌手、家電、家具、文具、廚房用品、衣服、鞋子、顏色、程式語言、手機品牌、App、運動、台灣景點、超級英雄。</p>
<button id="start" class="primary" style="margin-top:14px">開始遊戲</button>
</section>
<section id="game" class="card hidden center">
<div class="progress">完成 <span id="doneView">0</span> / <span id="totalView">10</span> 題</div>
<div class="muted" style="margin-top:10px">目前題目</div>
<div id="topicView" class="topic">—</div>
<div id="phrase" class="phrase">準備開始</div>
<div id="player" class="status"></div>
<div id="pulse" class="pulse"><span id="beatView" class="beat">♪</span></div>
<div id="waitView" class="countdown"></div>
<div id="players" class="players"></div>
<div class="actions" style="margin-top:18px">
<button id="pause" class="ghost">暫停</button>
<button id="skip" class="skip">跳過題目</button>
<button id="complete" class="primary wide">回答完成（空白鍵）</button>
<button id="reset" class="ghost wide">重新開始</button>
</div>
<p class="note">AI 念完「一想到 XX，我就想到」後開始回答。按空白鍵表示回答完成，等待設定秒數後自動換下一位與下一題。跳過不會扣除本局題數。</p>
</section>
<section id="result" class="card hidden center">
<div class="topic">遊戲完成 🎉</div>
<p id="resultText" class="status"></p>
<div class="actions"><button id="again" class="primary">再玩一次</button><button onclick="location.href='../index.html'" class="ghost">回首頁</button></div>
</section>
</div>
<script>
const $=id=>document.getElementById(id);
const DEFAULT_TOPICS=['夜市小吃','水果','飲料','動物','國家','台灣地名','交通工具','便利商店商品','早餐店餐點','火鍋料','日本料理','甜點','冰品','職業','卡通角色','電影角色','歌手','家電','家具','文具','廚房用品','衣服','鞋子','顏色','程式語言','手機品牌','App','運動','台灣景點','超級英雄'];
let ctx=null,tickTimer=null,waitTimer=null,running=false,paused=false,phase='idle',bpm=80,waitSeconds=3,totalRounds=10,completed=0,playerIndex=0,players=[],topicPool=[],usedTopics=[],currentTopic='',beatNo=0,phaseToken=0;
function save(){localStorage.rhythmSettings=JSON.stringify({bpm:$('bpm').value,count:$('count').value,rounds:$('rounds').value,waitSeconds:$('waitSeconds').value,topicMode:$('topicMode').value,customTopics:$('customTopics').value,names:$('names').value,sound:$('sound').checked,speak:$('speak').checked})}
try{const s=JSON.parse(localStorage.rhythmSettings||'{}');for(const k of ['bpm','count','rounds','waitSeconds','topicMode','customTopics','names'])if(s[k]!=null)$(k).value=s[k];if(s.sound!=null)$('sound').checked=s.sound;if(s.speak!=null)$('speak').checked=s.speak}catch(e){}
function clearTimers(){clearTimeout(tickTimer);clearTimeout(waitTimer);tickTimer=waitTimer=null;speechSynthesis?.cancel()}
function audioClick(accent=false){if(!$('sound').checked||!ctx)return;const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=accent?920:620;g.gain.setValueAtTime(.14,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.08);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.09)}
function sleep(ms,token){return new Promise(resolve=>{waitTimer=setTimeout(()=>resolve(token===phaseToken),ms)})}
function speak(text,rate=1){return new Promise(resolve=>{if(!$('speak').checked||!('speechSynthesis'in window)){resolve();return}const u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';u.rate=rate;u.onend=resolve;u.onerror=resolve;speechSynthesis.cancel();speechSynthesis.speak(u)})}
function beatDuration(){return 60000/bpm}
async function beatPhrase(text,beats,token){$('phrase').textContent=text;for(let i=1;i<=beats;i++){if(token!==phaseToken||paused||!running)return false;beatNo=i;$('beatView').textContent=i;audioClick(i===1);$('pulse').classList.add('on');setTimeout(()=>$('pulse').classList.remove('on'),110);const ok=await sleep(beatDuration(),token);if(!ok)return false}return true}
function shuffled(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function nextTopic(){if(!topicPool.length){topicPool=shuffled(usedTopics.length?usedTopics:DEFAULT_TOPICS);usedTopics=[]}let t=topicPool.shift();if(t===currentTopic&&topicPool.length){topicPool.push(t);t=topicPool.shift()}usedTopics.push(t);currentTopic=t;return t}
function renderPlayers(){$('player').textContent='目前玩家：'+players[playerIndex];$('players').innerHTML=players.map((p,i)=>`<span class="pill ${i===playerIndex?'active':''}">${p}</span>`).join('')}
async function announceRound(){if(!running||paused)return;phase='announce';const token=++phaseToken;currentTopic=nextTopic();$('topicView').textContent=currentTopic;$('waitView').textContent='';renderPlayers();await beatPhrase('一想到',3,token);if(token!==phaseToken||paused)return;$('phrase').textContent=currentTopic;await Promise.all([speak(currentTopic,.95),beatPhrase(currentTopic,Math.max(2,Math.min(6,[...currentTopic].length+1)),token)]);if(token!==phaseToken||paused)return;await beatPhrase('我就想到',4,token);if(token!==phaseToken||paused)return;$('phrase').textContent='請回答！';$('beatView').textContent='GO';audioClick(true);phase='answer'}
async function start(){save();bpm=Math.max(40,Math.min(200,+$('bpm').value||80));waitSeconds=Math.max(1,Math.min(10,+$('waitSeconds').value||3));totalRounds=Math.max(1,Math.min(100,+$('rounds').value||10));const n=Math.max(2,Math.min(10,+$('count').value||3));const names=$('names').value.split('\n').map(x=>x.trim()).filter(Boolean);players=Array.from({length:n},(_,i)=>names[i]||`玩家 ${i+1}`);const custom=$('customTopics').value.split('\n').map(x=>x.trim()).filter(Boolean);topicPool=shuffled($('topicMode').value==='custom'&&custom.length?custom:DEFAULT_TOPICS);usedTopics=[];completed=0;playerIndex=0;running=true;paused=false;phase='idle';ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();$('setup').classList.add('hidden');$('result').classList.add('hidden');$('game').classList.remove('hidden');$('doneView').textContent=completed;$('totalView').textContent=totalRounds;$('pause').textContent='暫停';renderPlayers();announceRound()}
async function completeAnswer(){if(!running||paused||phase!=='answer')return;phase='waiting';completed++;$('doneView').textContent=completed;$('phrase').textContent='回答完成';for(let i=waitSeconds;i>=1;i--){if(paused||!running||phase!=='waiting')return;$('waitView').textContent=i;await new Promise(r=>waitTimer=setTimeout(r,1000))}$('waitView').textContent='';if(completed>=totalRounds){finish();return}playerIndex=(playerIndex+1)%players.length;announceRound()}
function skipTopic(){if(!running||paused||!['announce','answer'].includes(phase))return;phaseToken++;speechSynthesis?.cancel();clearTimeout(waitTimer);$('phrase').textContent='已跳過，不計題數';$('waitView').textContent='';setTimeout(()=>{if(running&&!paused)announceRound()},500)}
function togglePause(){if(!running)return;paused=!paused;phaseToken++;clearTimers();$('pause').textContent=paused?'繼續':'暫停';$('phrase').textContent=paused?'遊戲暫停':'重新準備';if(!paused){ctx?.resume();setTimeout(announceRound,300)}}
function finish(){running=false;phase='done';phaseToken++;clearTimers();$('game').classList.add('hidden');$('result').classList.remove('hidden');$('resultText').textContent=`完成 ${completed} 題，共 ${players.length} 位玩家參加。`}
$('start').onclick=start;$('complete').onclick=completeAnswer;$('skip').onclick=skipTopic;$('pause').onclick=togglePause;$('reset').onclick=()=>location.reload();$('again').onclick=()=>location.reload();
addEventListener('keydown',e=>{if(e.repeat||['INPUT','TEXTAREA','SELECT','BUTTON'].includes(document.activeElement.tagName))return;if(e.code==='Space'){e.preventDefault();completeAnswer()}if(e.key.toLowerCase()==='s'){e.preventDefault();skipTopic()}if(e.key==='Escape'){e.preventDefault();togglePause()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&running&&!paused)togglePause()});
</script>
</body>
</html>
