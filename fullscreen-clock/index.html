<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>全螢幕防休眠電子鐘</title>
    <style>
        :root {
            --bg-color: #000;
            --text-color: #fff;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            cursor: pointer;
        }

        #clock-container {
            text-align: center;
            -webkit-user-select: none;
            user-select: none;
        }

        #time {
            font-size: 21vw;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: 900;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.045em;
            line-height: 1;
            white-space: nowrap;
        }

        /* 用背景直接畫兩顆圓點，避免 iPhone Safari 的 inline-flex / pseudo-element 跑版。 */
        #time .colon {
            --colon-color: var(--text-color);
            --colon-glow: transparent;
            display: inline-block;
            width: 0.22em;
            height: 0.62em;
            margin: 0 0.025em;
            vertical-align: -0.06em;
            color: transparent;
            font-size: 1em;
            background:
                radial-gradient(circle, var(--colon-color) 0 48%, transparent 52%) 50% 20% / 0.18em 0.18em no-repeat,
                radial-gradient(circle, var(--colon-color) 0 48%, transparent 52%) 50% 80% / 0.18em 0.18em no-repeat;
            filter: drop-shadow(0 0 0.07em var(--colon-glow));
            transition: filter 0.06s ease;
        }

        #left-colon.is-flashing {
            --colon-color: #ff4fd8;
            --colon-glow: #ff4fd8;
        }

        #right-colon.is-flashing {
            --colon-color: #00e5ff;
            --colon-glow: #00e5ff;
        }

        #date {
            font-size: 5.5vw;
            font-weight: 700;
            margin-top: 10px;
            opacity: 0.8;
        }

        #landscape-button {
            position: fixed;
            top: 16px;
            right: 16px;
            padding: 10px 14px;
            color: #fff;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 999px;
            font: 600 14px/1 -apple-system, "Helvetica Neue", Arial, sans-serif;
            cursor: pointer;
        }

        #landscape-button:active {
            background: rgba(255, 255, 255, 0.24);
        }

        #status {
            position: fixed;
            bottom: 10px;
            left: 10px;
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            font-family: sans-serif;
        }
    </style>
</head>
<body>

    <div id="clock-container">
        <div id="time"><span id="hours">00</span><span id="left-colon" class="colon">:</span><span id="minutes">00</span><span id="right-colon" class="colon">:</span><span id="seconds">00</span></div>
        <div id="date">YYYY/MM/DD</div>
    </div>

    <button id="landscape-button" type="button">↔ 打橫顯示</button>
    <div id="status" aria-live="polite">防黑屏啟動中…</div>

    <script>
        const hoursDisplay = document.getElementById('hours');
        const minutesDisplay = document.getElementById('minutes');
        const secondsDisplay = document.getElementById('seconds');
        const leftColon = document.getElementById('left-colon');
        const rightColon = document.getElementById('right-colon');
        const dateDisplay = document.getElementById('date');
        const statusDisplay = document.getElementById('status');
        const landscapeButton = document.getElementById('landscape-button');
        const bodyElem = document.body;

        let wakeLock = null;
        let leftColonActive = true;
        const BEAT_MS = 750;

        // --- 1. 電子時鐘邏輯 ---
        function updateClock() {
            const now = new Date();

            // 格式化時間 (HH:MM:SS)
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            hoursDisplay.textContent = hours;
            minutesDisplay.textContent = minutes;
            secondsDisplay.textContent = seconds;

            // 格式化日期
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const date = String(now.getDate()).padStart(2, '0');
            const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const day = weekdays[now.getDay()];
            dateDisplay.textContent = `${year}/${month}/${date} ${day}`;
        }

        // 每 0.75 秒左右交替閃色；沒在閃的冒號保持白色。
        function updateColonBeat() {
            leftColon.classList.toggle('is-flashing', leftColonActive);
            rightColon.classList.toggle('is-flashing', !leftColonActive);
            leftColonActive = !leftColonActive;
        }

        // 時鐘數字每秒更新；冒號節拍獨立以 0.75 秒運作。
        setInterval(updateClock, 1000);
        updateClock();

        updateColonBeat();
        setInterval(updateColonBeat, BEAT_MS);

        // --- 2. 防休眠 (Wake Lock) 邏輯 ---
        async function requestWakeLock(showStatus = true) {
            if (!('wakeLock' in navigator)) {
                if (showStatus) statusDisplay.textContent = '此瀏覽器不支援防黑屏';
                return false;
            }

            try {
                if (wakeLock === null) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLock.addEventListener('release', () => {
                        wakeLock = null;
                        if (document.visibilityState === 'visible') {
                            statusDisplay.textContent = '防黑屏已暫停，點一下畫面重新啟動';
                        }
                    });
                }
                if (showStatus) statusDisplay.textContent = '防黑屏已啟動';
                return true;
            } catch (err) {
                if (showStatus) statusDisplay.textContent = '防黑屏無法自動啟動，點一下畫面重試';
                console.error(err);
                return false;
            }
        }

        function isDocumentFullscreen() {
            return document.fullscreenElement || document.webkitFullscreenElement;
        }

        async function enterFullscreen() {
            const docElem = document.documentElement;
            if (docElem.requestFullscreen) {
                await docElem.requestFullscreen();
            } else if (docElem.webkitRequestFullscreen) {
                await docElem.webkitRequestFullscreen();
            }
        }

        async function lockLandscape() {
            try {
                if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock('landscape');
                    return true;
                }
            } catch (err) {
                console.warn('橫屏鎖定被系統拒絕，請手動旋轉手機。', err);
            }
            return false;
        }

        async function activateLandscapeMode() {
            try {
                if (!isDocumentFullscreen()) await enterFullscreen();
            } catch (err) {
                console.warn('無法進入全螢幕，仍嘗試打橫顯示。', err);
            }

            const landscapeLocked = await lockLandscape();
            const wakeLockEnabled = await requestWakeLock(false);
            statusDisplay.textContent = landscapeLocked
                ? `已打橫顯示${wakeLockEnabled ? ' · 防黑屏已啟動' : ''}`
                : `無法自動打橫，請手動旋轉${wakeLockEnabled ? ' · 防黑屏已啟動' : ''}`;
        }

        // 點擊空白處可切換全螢幕，並同時嘗試打橫及防黑屏。
        async function activateFullFeatures() {
            if (isDocumentFullscreen()) {
                if (document.exitFullscreen) await document.exitFullscreen();
                return;
            }

            await activateLandscapeMode();
        }

        landscapeButton.addEventListener('click', async (event) => {
            event.stopPropagation();
            await activateLandscapeMode();
        });

        // 預設先申請防黑屏；若瀏覽器限制自動啟動，使用者可再點按畫面或打橫按鈕。
        requestWakeLock();

        // 回到此頁時，重新申請防黑屏。
        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState === 'visible' && wakeLock === null) {
                await requestWakeLock();
            }
        });

        // 綁定點擊事件
        bodyElem.addEventListener('click', activateFullFeatures);
    </script>
    <script src="/stats.js"></script>
</body>
</html>
