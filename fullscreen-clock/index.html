<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>全螢幕防休眠電子鐘</title>
    <style>
        :root {
            --bg-color: #000;
            --text-color: #fff;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            cursor: pointer;
        }

        #clock-container {
            text-align: center;
            -webkit-user-select: none;
            user-select: none;
        }

        #time {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: nowrap;
            font-size: 21vw;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: 900;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.045em;
            line-height: 1;
            white-space: nowrap;
        }

        #time > span:not(.colon) {
            display: block;
            line-height: 1;
        }

        /* 冒號是獨立 flex item，不再依賴文字 baseline / vertical-align。 */
        #time .colon {
            --colon-color: var(--text-color);
            --colon-glow: transparent;
            display: block;
            flex: 0 0 0.30em;
            width: 0.30em;
            height: 0.78em;
            margin: 0 0.015em;
            color: transparent;
            background:
                radial-gradient(circle, var(--colon-color) 0 49%, transparent 52%) 50% 27% / 0.24em 0.24em no-repeat,
                radial-gradient(circle, var(--colon-color) 0 49%, transparent 52%) 50% 73% / 0.24em 0.24em no-repeat;
            filter: drop-shadow(0 0 0.075em var(--colon-glow));
            transition: filter 0.06s ease;
        }

        #left-colon.is-flashing {
            --colon-color: #ff4fd8;
            --colon-glow: #ff4fd8;
        }

        #right-colon.is-flashing {
            --colon-color: #00e5ff;
            --colon-glow: #00e5ff;
        }

        #date {
            font-size: 5.5vw;
            font-weight: 700;
            margin-top: 10px;
            opacity: 0.8;
        }

        #landscape-button {
            position: fixed;
            top: 16px;
            right: 16px;
            padding: 10px 14px;
            color: #fff;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 999px;
            font: 600 14px/1 -apple-system, "Helvetica Neue", Arial, sans-serif;
            cursor: pointer;
        }

        #landscape-button:active {
            background: rgba(255, 255, 255, 0.24);
        }

        #status {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            padding: 8px 14px;
            color: rgba(255, 255, 255, 0.85);
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 999px;
            font: 14px/1.2 -apple-system, "Helvetica Neue", Arial, sans-serif;
            white-space: nowrap;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="clock-container">
        <div id="time"><span id="hours">00</span><span id="left-colon" class="colon" aria-hidden="true"></span><span id="minutes">00</span><span id="right-colon" class="colon" aria-hidden="true"></span><span id="seconds">00</span></div>
        <div id="date">YYYY/MM/DD</div>
    </div>

    <button id="landscape-button" type="button">↔ 打橫顯示</button>
    <div id="status" aria-live="polite">防黑屏啟動中…</div>

    <!-- 舊版 iOS / 不支援 Screen Wake Lock 的瀏覽器使用影片播放相容模式。 -->
    <script src="https://cdn.jsdelivr.net/npm/nosleep.js@0.12.0/dist/NoSleep.min.js"></script>
    <script>
        const hoursDisplay = document.getElementById('hours');
        const minutesDisplay = document.getElementById('minutes');
        const secondsDisplay = document.getElementById('seconds');
        const leftColon = document.getElementById('left-colon');
        const rightColon = document.getElementById('right-colon');
        const dateDisplay = document.getElementById('date');
        const statusDisplay = document.getElementById('status');
        const landscapeButton = document.getElementById('landscape-button');
        const bodyElem = document.body;

        const supportsNativeWakeLock = 'wakeLock' in navigator;
        let wakeLock = null;
        let legacyNoSleep = null;
        let legacyNoSleepEnabled = false;
        let clockTimer = null;
        let colonTimer = null;
        const BEAT_MS = 750;

        // --- 1. 電子時鐘邏輯 ---
        function updateClock() {
            const now = new Date();

            // 格式化時間 (HH:MM:SS)
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            hoursDisplay.textContent = hours;
            minutesDisplay.textContent = minutes;
            secondsDisplay.textContent = seconds;

            // 格式化日期
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const date = String(now.getDate()).padStart(2, '0');
            const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const day = weekdays[now.getDay()];
            dateDisplay.textContent = `${year}/${month}/${date} ${day}`;
        }

        // 以每分鐘的牆上時間作為節拍基準：0、3、6 秒都從左冒號開始。
        // 0.75 秒輪流一次，重新整理頁面也會回到目前正確的相位，不會累積漂移。
        function updateColonBeat() {
            const now = new Date();
            const elapsedInMinute = now.getSeconds() * 1000 + now.getMilliseconds();
            const cyclePosition = elapsedInMinute % (BEAT_MS * 2);
            const leftColonActive = cyclePosition < BEAT_MS;

            leftColon.classList.toggle('is-flashing', leftColonActive);
            rightColon.classList.toggle('is-flashing', !leftColonActive);

            // 對準下一個絕對節拍邊界，避免 setTimeout 延遲後逐步偏移。
            const nextBeatIn = BEAT_MS - (cyclePosition % BEAT_MS);
            clearTimeout(colonTimer);
            colonTimer = setTimeout(updateColonBeat, Math.max(1, nextBeatIn));
        }

        // 數字也對準牆上時鐘的整秒更新，避免從載入時間開始而逐漸錯開。
        function scheduleClockUpdate() {
            updateClock();
            const nextSecondIn = 1000 - (Date.now() % 1000);
            clearTimeout(clockTimer);
            clockTimer = setTimeout(scheduleClockUpdate, Math.max(1, nextSecondIn));
        }

        // 時鐘數字與冒號節拍都以目前時間重新計算，不累積 setInterval 漂移。
        scheduleClockUpdate();
        updateColonBeat();

        // --- 2. 防休眠邏輯 ---
        // 新瀏覽器：Screen Wake Lock API
        // 舊 iOS / 舊瀏覽器：NoSleep.js 影片播放相容模式
        function getLegacyNoSleep() {
            if (legacyNoSleep) return legacyNoSleep;
            if (typeof NoSleep !== 'function') return null;

            legacyNoSleep = new NoSleep();

            // NoSleep.js 的影片預設不必放進 DOM；但舊版 iOS 對背景媒體較挑剔，
            // 保留一個幾乎不可見、仍位於 viewport 內的 1px 影片可提高相容性。
            if (legacyNoSleep.noSleepVideo && !legacyNoSleep.noSleepVideo.isConnected) {
                const video = legacyNoSleep.noSleepVideo;
                video.setAttribute('playsinline', '');
                video.setAttribute('webkit-playsinline', '');
                video.style.position = 'fixed';
                video.style.left = '0';
                video.style.bottom = '0';
                video.style.width = '1px';
                video.style.height = '1px';
                video.style.opacity = '0.01';
                video.style.pointerEvents = 'none';
                video.style.zIndex = '-1';
                document.body.appendChild(video);
            }

            return legacyNoSleep;
        }

        async function enableLegacyNoSleep(showStatus = true) {
            const noSleep = getLegacyNoSleep();

            if (!noSleep) {
                legacyNoSleepEnabled = false;
                if (showStatus) statusDisplay.textContent = '相容模式載入失敗，請重新整理後再試';
                return false;
            }

            try {
                // 這一行必須直接由 click/touch 事件觸發；舊 iOS 不允許網頁載入後自動播放。
                await noSleep.enable();
                legacyNoSleepEnabled = true;
                if (showStatus) statusDisplay.textContent = '防黑屏已啟動（相容模式）';
                return true;
            } catch (err) {
                legacyNoSleepEnabled = false;
                if (showStatus) statusDisplay.textContent = '相容模式啟動失敗，請再點一下畫面';
                console.error('Legacy no-sleep failed:', err);
                return false;
            }
        }

        function isLegacyNoSleepActive() {
            if (!legacyNoSleepEnabled || !legacyNoSleep) return false;

            if (legacyNoSleep.noSleepVideo) {
                return !legacyNoSleep.noSleepVideo.paused;
            }

            return legacyNoSleep.isEnabled === true;
        }

        async function requestWakeLock(showStatus = true, fromUserGesture = false) {
            if (!supportsNativeWakeLock) {
                if (!fromUserGesture) {
                    if (showStatus) {
                        statusDisplay.textContent = isLegacyNoSleepActive()
                            ? '防黑屏已啟動（相容模式）'
                            : '點一下畫面啟動防黑屏（相容模式）';
                    }
                    return isLegacyNoSleepActive();
                }

                return enableLegacyNoSleep(showStatus);
            }

            try {
                if (wakeLock === null) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLock.addEventListener('release', () => {
                        wakeLock = null;
                        if (document.visibilityState === 'visible') {
                            statusDisplay.textContent = '防黑屏已暫停，點一下畫面重新啟動';
                        }
                    });
                }
                if (showStatus) statusDisplay.textContent = '防黑屏已啟動';
                return true;
            } catch (err) {
                if (showStatus) statusDisplay.textContent = '防黑屏無法自動啟動，點一下畫面重試';
                console.error(err);
                return false;
            }
        }

        function isDocumentFullscreen() {
            return document.fullscreenElement || document.webkitFullscreenElement;
        }

        async function enterFullscreen() {
            const docElem = document.documentElement;
            if (docElem.requestFullscreen) {
                await docElem.requestFullscreen();
            } else if (docElem.webkitRequestFullscreen) {
                await docElem.webkitRequestFullscreen();
            }
        }

        async function lockLandscape() {
            try {
                if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock('landscape');
                    return true;
                }
            } catch (err) {
                console.warn('橫屏鎖定被系統拒絕，請手動旋轉手機。', err);
            }
            return false;
        }

        async function activateLandscapeMode() {
            // 舊 iOS 的影片播放必須保留「使用者點擊」權限，因此先啟動相容模式，
            // 再執行 fullscreen / orientation 等可能消耗 user activation 的 await。
            const legacyNoSleepPromise = supportsNativeWakeLock
                ? null
                : enableLegacyNoSleep(false);

            try {
                if (!isDocumentFullscreen()) await enterFullscreen();
            } catch (err) {
                console.warn('無法進入全螢幕，仍嘗試打橫顯示。', err);
            }

            const landscapeLocked = await lockLandscape();
            const wakeLockEnabled = supportsNativeWakeLock
                ? await requestWakeLock(false, true)
                : await legacyNoSleepPromise;

            const wakeLockLabel = wakeLockEnabled
                ? (supportsNativeWakeLock ? ' · 防黑屏已啟動' : ' · 防黑屏相容模式已啟動')
                : '';

            statusDisplay.textContent = landscapeLocked
                ? `已打橫顯示${wakeLockLabel}`
                : `無法自動打橫，請手動旋轉${wakeLockLabel}`;
        }

        // 點擊空白處可切換全螢幕，並同時嘗試打橫及防黑屏。
        async function activateFullFeatures() {
            if (isDocumentFullscreen()) {
                if (document.exitFullscreen) await document.exitFullscreen();
                return;
            }

            await activateLandscapeMode();
        }

        landscapeButton.addEventListener('click', async (event) => {
            event.stopPropagation();
            await activateLandscapeMode();
        });

        // 新瀏覽器可以直接申請 Wake Lock；舊 iOS 必須等第一次使用者點擊。
        requestWakeLock();

        // 回到此頁時同步時間。原生 Wake Lock 可重新申請；舊 iOS 若影片被系統暫停，要求再點一下。
        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState === 'visible') {
                scheduleClockUpdate();
                updateColonBeat();

                if (supportsNativeWakeLock) {
                    if (wakeLock === null) {
                        await requestWakeLock();
                    }
                } else if (!isLegacyNoSleepActive()) {
                    legacyNoSleepEnabled = false;
                    statusDisplay.textContent = '點一下畫面重新啟動防黑屏（相容模式）';
                }
            }
        });

        // 綁定點擊事件
        bodyElem.addEventListener('click', activateFullFeatures);
    </script>
    <script src="/stats.js"></script>
</body>
</html>
