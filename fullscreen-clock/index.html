<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>全螢幕防休眠電子鐘</title>
    <style>
        :root {
            --bg-color: #000;
            --text-color: #fff;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            cursor: pointer;
        }

        #clock-container {
            text-align: center;
            -webkit-user-select: none;
            user-select: none;
        }

        #time {
            font-size: 21vw;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: 900;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.045em;
            line-height: 1;
        }

        #time .colon {
            display: inline-block;
            color: var(--text-color);
            font-weight: 900;
            transform: scale(1.28);
            transform-origin: center;
            transition: color 0.12s ease, text-shadow 0.12s ease;
        }

        #left-colon.is-flashing {
            color: #ff4fd8;
            text-shadow: 0 0 24px #ff4fd8;
        }

        #right-colon.is-flashing {
            color: #00e5ff;
            text-shadow: 0 0 24px #00e5ff;
        }

        #date {
            font-size: 5.5vw;
            font-weight: 700;
            margin-top: 10px;
            opacity: 0.8;
        }

        #landscape-button {
            position: fixed;
            top: 16px;
            right: 16px;
            padding: 10px 14px;
            color: #fff;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 999px;
            font: 600 14px/1 -apple-system, "Helvetica Neue", Arial, sans-serif;
            cursor: pointer;
        }

        #landscape-button:active {
            background: rgba(255, 255, 255, 0.24);
        }

        #status {
            position: fixed;
            bottom: 10px;
            left: 10px;
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            font-family: sans-serif;
        }
    </style>
</head>
<body>

    <div id="clock-container">
        <div id="time"><span id="hours">00</span><span id="left-colon" class="colon">:</span><span id="minutes">00</span><span id="right-colon" class="colon">:</span><span id="seconds">00</span></div>
        <div id="date">YYYY/MM/DD</div>
    </div>

    <button id="landscape-button" type="button">↔ 打橫顯示</button>
    <div id="status" aria-live="polite">防黑屏啟動中…</div>

    <script>
        const hoursDisplay = document.getElementById('hours');
        const minutesDisplay = document.getElementById('minutes');
        const secondsDisplay = document.getElementById('seconds');
        const leftColon = document.getElementById('left-colon');
        const rightColon = document.getElementById('right-colon');
        const dateDisplay = document.getElementById('date');
        const statusDisplay = document.getElementById('status');
        const landscapeButton = document.getElementById('landscape-button');
        const bodyElem = document.body;

        let wakeLock = null;

        // --- 1. 電子時鐘邏輯 ---
        function updateClock() {
            const now = new Date();

            // 格式化時間 (HH:MM:SS)
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            hoursDisplay.textContent = hours;
            minutesDisplay.textContent = minutes;
            secondsDisplay.textContent = seconds;

            // 格式化日期
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const date = String(now.getDate()).padStart(2, '0');
            const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const day = weekdays[now.getDay()];
            dateDisplay.textContent = `${year}/${month}/${date} ${day}`;

            // 每 6 秒依序閃爍左右冒號。
            if (now.getSeconds() % 6 === 0) {
                flashColons();
            }
        }

        // 左冒號先亮洋紅色 0.5 秒，再換右冒號亮青色 0.5 秒。
        function flashColons() {
            leftColon.classList.add('is-flashing');

            setTimeout(() => {
                leftColon.classList.remove('is-flashing');
                rightColon.classList.add('is-flashing');
            }, 500);

            setTimeout(() => {
                rightColon.classList.remove('is-flashing');
            }, 1000);
        }

        // 啟動時鐘，每秒更新
        setInterval(updateClock, 1000);
        updateClock();

        // --- 2. 防休眠 (Wake Lock) 邏輯 ---
        async function requestWakeLock(showStatus = true) {
            if (!('wakeLock' in navigator)) {
                if (showStatus) statusDisplay.textContent = '此瀏覽器不支援防黑屏';
                return false;
            }

            try {
                if (wakeLock === null) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLock.addEventListener('release', () => {
                        wakeLock = null;
                        if (document.visibilityState === 'visible') {
                            statusDisplay.textContent = '防黑屏已暫停，點一下畫面重新啟動';
                        }
                    });
                }
                if (showStatus) statusDisplay.textContent = '防黑屏已啟動';
                return true;
            } catch (err) {
                if (showStatus) statusDisplay.textContent = '防黑屏無法自動啟動，點一下畫面重試';
                console.error(err);
                return false;
            }
        }

        function isDocumentFullscreen() {
            return document.fullscreenElement || document.webkitFullscreenElement;
        }

        async function enterFullscreen() {
            const docElem = document.documentElement;
            if (docElem.requestFullscreen) {
                await docElem.requestFullscreen();
            } else if (docElem.webkitRequestFullscreen) {
                await docElem.webkitRequestFullscreen();
            }
        }

        async function lockLandscape() {
            try {
                if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock('landscape');
                    return true;
                }
            } catch (err) {
                console.warn('橫屏鎖定被系統拒絕，請手動旋轉手機。', err);
            }
            return false;
        }

        async function activateLandscapeMode() {
            try {
                if (!isDocumentFullscreen()) await enterFullscreen();
            } catch (err) {
                console.warn('無法進入全螢幕，仍嘗試打橫顯示。', err);
            }

            const landscapeLocked = await lockLandscape();
            const wakeLockEnabled = await requestWakeLock(false);
            statusDisplay.textContent = landscapeLocked
                ? `已打橫顯示${wakeLockEnabled ? ' · 防黑屏已啟動' : ''}`
                : `無法自動打橫，請手動旋轉${wakeLockEnabled ? ' · 防黑屏已啟動' : ''}`;
        }

        // 點擊空白處可切換全螢幕，並同時嘗試打橫及防黑屏。
        async function activateFullFeatures() {
            if (isDocumentFullscreen()) {
                if (document.exitFullscreen) await document.exitFullscreen();
                return;
            }

            await activateLandscapeMode();
        }

        landscapeButton.addEventListener('click', async (event) => {
            event.stopPropagation();
            await activateLandscapeMode();
        });

        // 預設先申請防黑屏；若瀏覽器限制自動啟動，使用者可再點按畫面或打橫按鈕。
        requestWakeLock();

        // 回到此頁時，重新申請防黑屏。
        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState === 'visible' && wakeLock === null) {
                await requestWakeLock();
            }
        });

        // 綁定點擊事件
        bodyElem.addEventListener('click', activateFullFeatures);
    </script>
    <script src="/stats.js"></script>
</body>
</html>
