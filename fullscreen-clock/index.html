<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>全螢幕防休眠電子鐘</title>
    <style>
        :root {
            --bg-color: #000;
            --text-color: #fff;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            cursor: pointer;
        }

        /* 維持黑色底，只讓左右兩側依序短暫閃爍。 */
        #flash-left,
        #flash-right {
            position: fixed;
            top: 0;
            bottom: 0;
            width: 50%;
            background-color: rgba(255, 255, 255, 0.28);
            opacity: 0;
            pointer-events: none;
            z-index: 0;
        }

        #flash-left {
            left: 0;
        }

        #flash-right {
            right: 0;
        }

        #clock-container {
            text-align: center;
            -webkit-user-select: none;
            user-select: none;
            position: relative;
            z-index: 1;
        }

        #time {
            font-size: 20vw;
            font-weight: bold;
            line-height: 1;
        }

        #date {
            font-size: 5vw;
            margin-top: 10px;
            opacity: 0.8;
        }

        #status {
            position: fixed;
            bottom: 10px;
            left: 10px;
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            font-family: sans-serif;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div id="flash-left" aria-hidden="true"></div>
    <div id="flash-right" aria-hidden="true"></div>

    <div id="clock-container">
        <div id="time">00:00:00</div>
        <div id="date">YYYY/MM/DD</div>
    </div>

    <div id="status">點擊螢幕開啟全螢幕 (防休眠/自動打橫)</div>

    <script>
        const timeDisplay = document.getElementById('time');
        const dateDisplay = document.getElementById('date');
        const statusDisplay = document.getElementById('status');
        const bodyElem = document.body;

        let wakeLock = null;
        let isFullscreen = false;

        // --- 1. 電子時鐘邏輯 ---
        function updateClock() {
            const now = new Date();

            // 格式化時間 (HH:MM:SS)
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            timeDisplay.textContent = `${hours}:${minutes}:${seconds}`;

            // 格式化日期
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const date = String(now.getDate()).padStart(2, '0');
            const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const day = weekdays[now.getDay()];
            dateDisplay.textContent = `${year}/${month}/${date} ${day}`;

            // --- 3. 每 6 秒左右依序閃爍 ---
            // 當秒數能被 6 整除時 (例如 00, 06, 12...)
            if (now.getSeconds() % 6 === 0) {
                flashSides();
            }
        }

        // 左半秒閃左側，右半秒閃右側；底色維持原本黑色。
        function flashSides() {
            const leftFlash = document.getElementById('flash-left');
            const rightFlash = document.getElementById('flash-right');

            leftFlash.style.opacity = '1';
            rightFlash.style.opacity = '0';

            setTimeout(() => {
                leftFlash.style.opacity = '0';
                rightFlash.style.opacity = '1';
            }, 500);

            setTimeout(() => {
                rightFlash.style.opacity = '0';
            }, 1000);
        }

        // 啟動時鐘，每秒更新
        setInterval(updateClock, 1000);
        updateClock();

        // --- 2. 防休眠 (Wake Lock) 邏輯 ---
        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    statusDisplay.textContent = '全螢幕中 - 防休眠已啟動';

                    // 監聽 Wake Lock 釋放事件（例如系統強制介入）
                    wakeLock.addEventListener('release', () => {
                        console.log('Wake Lock 被釋放');
                    });
                } catch (err) {
                    statusDisplay.textContent = `防休眠失敗: ${err.message}`;
                    console.error(err);
                }
            } else {
                statusDisplay.textContent = '此瀏覽器不支援防休眠 API';
            }
        }

        // --- 4. 點擊觸發全螢幕、打橫、防休眠 ---
        async function activateFullFeatures() {
            // 如果已經是全螢幕，則退出
            if (document.fullscreenElement) {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
                return;
            }

            try {
                // 1. 請求進入全螢幕 (放大)
                const docElem = document.documentElement;
                if (docElem.requestFullscreen) {
                    await docElem.requestFullscreen();
                } else if (docElem.webkitRequestFullscreen) { /* Safari/iOS */
                    await docElem.webkitRequestFullscreen();
                }

                // 2. 請求鎖定橫屏
                // 註：iOS Safari 往往會拒絕此請求，除非是在播放原生影片
                if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock('landscape').catch(err => {
                        console.warn('橫屏鎖定被系統拒絕，請手動旋轉手機。', err);
                        statusDisplay.textContent = '全螢幕中 - 請手動旋轉至橫屏';
                    });
                }

                // 3. 請求防休眠
                await requestWakeLock();

            } catch (err) {
                console.error('啟動失敗:', err);
            }
        }

        // 監聽全螢幕變化，如果使用者退出全螢幕，也釋放 Wake Lock
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                isFullscreen = false;
                if (wakeLock !== null) {
                    wakeLock.release();
                    wakeLock = null;
                }
                statusDisplay.textContent = '點擊螢幕開啟全螢幕 (防休眠/自動打橫)';
            } else {
                isFullscreen = true;
            }
        });

        // 監聽分頁可見性，如果切換 App 回來，重新申請 Wake Lock
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible' && isFullscreen) {
                await requestWakeLock();
            }
        });

        // 綁定點擊事件
        bodyElem.addEventListener('click', activateFullFeatures);
    </script>
    <script src="/stats.js"></script>
</body>
</html>
