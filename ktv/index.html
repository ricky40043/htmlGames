<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101115">
  <title>KTV 主持播放台</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,"Noto Sans TC",system-ui,sans-serif;color:#f8f7f3;background:#101115;--muted:#9c9da4;--panel:#1d1e23e8;--line:#ffffff17;--yellow:#ffcf54;--coral:#ff725e}*{box-sizing:border-box}body{min-height:100vh;margin:0;background:radial-gradient(circle at 12% 0%,#ff725e2b,transparent 30rem),radial-gradient(circle at 95% 18%,#ffcf541c,transparent 32rem),#101115}button,input{font:inherit}button{color:inherit}.shell{width:min(1180px,calc(100% - 32px));margin:auto;padding:30px 0 54px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:26px}.brand{display:flex;align-items:center;gap:13px}.brand-mark{display:grid;width:45px;height:45px;place-items:center;border-radius:14px;background:var(--yellow);color:#17140d;font-size:23px;box-shadow:0 12px 35px #ffcf5433}h1{margin:0;font-size:21px;letter-spacing:.02em}.eyebrow{margin:0 0 3px;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.16em}.track-count{color:var(--muted);font-size:14px}.layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(330px,.75fr);gap:22px;align-items:start}.player,.playlist{border:1px solid var(--line);background:var(--panel);box-shadow:0 28px 80px #0004;backdrop-filter:blur(24px)}.player{position:sticky;top:22px;overflow:hidden;border-radius:30px}.art{position:relative;display:grid;min-height:330px;place-items:center;overflow:hidden;background:linear-gradient(145deg,#292b32,#17181d)}.art:before{content:"";position:absolute;width:390px;height:390px;border-radius:50%;background:conic-gradient(from 10deg,#34363d,#121318,#3b3d45,#111216,#34363d);box-shadow:0 30px 80px #0009}.art:after{content:"";position:absolute;width:104px;height:104px;border:20px solid var(--coral);border-radius:50%;background:var(--yellow);box-shadow:0 0 0 4px #15161b}.is-playing .art:before{animation:spin 8s linear infinite}.bars{position:absolute;z-index:2;bottom:30px;left:30px;display:flex;height:30px;align-items:end;gap:5px}.bars i{display:block;width:5px;height:25%;border-radius:8px;background:var(--yellow)}.is-playing .bars i{animation:bounce .65s ease-in-out infinite alternate}.bars i:nth-child(2){animation-delay:-.4s!important;height:60%}.bars i:nth-child(3){animation-delay:-.2s!important;height:95%}.bars i:nth-child(4){animation-delay:-.5s!important;height:45%}.bars i:nth-child(5){animation-delay:-.1s!important;height:75%}.status-pill{position:absolute;z-index:2;top:24px;left:24px;display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:#0c0d10b3;color:#d5d5d8;font-size:12px;font-weight:750}.status-dot{width:7px;height:7px;border-radius:50%;background:#777981}.is-playing .status-dot{background:#72e1a5;box-shadow:0 0 0 5px #72e1a51f}.player-body{padding:28px 30px 30px}.song-number{color:var(--yellow);font-size:12px;font-weight:850;letter-spacing:.13em}.now-title{margin:7px 0 2px;font-size:clamp(30px,5vw,48px);line-height:1.12;letter-spacing:-.035em}.now-artist{margin:0 0 27px;color:var(--muted);font-size:17px}.timeline{width:100%;height:6px;margin:0;border-radius:999px;outline:none;background:linear-gradient(to right,var(--yellow) 0 var(--progress,0%),#44464e var(--progress,0%) 100%);appearance:none;cursor:pointer}.timeline::-webkit-slider-thumb{width:17px;height:17px;border:4px solid var(--yellow);border-radius:50%;background:#fff;box-shadow:0 2px 9px #0008;appearance:none}.time-row{display:flex;justify-content:space-between;margin-top:9px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}.transport{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:23px}.control{display:grid;width:54px;height:54px;padding:0;place-items:center;border:1px solid var(--line);border-radius:50%;background:#292a30;cursor:pointer;transition:.16s}.control:hover{transform:translateY(-2px);background:#34363d}.control:active{transform:scale(.95)}.control:disabled{opacity:.35;cursor:not-allowed}.control.skip{width:64px;height:64px;font-size:13px;font-weight:850}.control.play{width:76px;height:76px;border:0;background:var(--yellow);color:#17140d;font-size:27px;box-shadow:0 13px 35px #ffcf5433}.playlist{overflow:hidden;border-radius:24px}.playlist-head{padding:22px 22px 15px}.playlist h2{margin:0;font-size:19px}.playlist p{margin:5px 0 0;color:var(--muted);font-size:13px}.songs{padding:0 10px 12px}.song-row{display:grid;width:100%;grid-template-columns:39px minmax(0,1fr) 34px;align-items:center;gap:10px;padding:13px 12px;border:1px solid transparent;border-radius:14px;background:transparent;text-align:left;cursor:pointer;transition:.16s}.song-row:hover{background:#ffffff0e;transform:translateX(2px)}.song-row.active{border-color:#ffcf5438;background:#ffcf5417}.row-number{color:#777981;font-size:13px;font-weight:750}.active .row-number{color:var(--yellow)}.song-meta{min-width:0}.song-meta strong,.song-meta small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.song-meta strong{font-size:15px}.song-meta small{margin-top:3px;color:var(--muted);font-size:12px}.row-state{display:grid;width:30px;height:30px;place-items:center;border-radius:50%;color:#8f9097;font-size:12px}.active .row-state{background:var(--yellow);color:#17140d}.message{margin-bottom:18px;padding:12px 15px;border:1px solid #ff725e47;border-radius:12px;background:#ff725e1a;color:#ffb1a6;font-size:14px}.message:empty{display:none}.shortcut{margin:18px 0 0;color:#777981;font-size:11px;text-align:center}audio{display:none}@keyframes spin{to{transform:rotate(360deg)}}@keyframes bounce{to{height:100%}}@media(max-width:820px){.shell{width:min(100% - 20px,620px);padding-top:18px}.layout{grid-template-columns:1fr}.player{position:static}.art{min-height:250px}.art:before{width:290px;height:290px}.art:after{width:82px;height:82px;border-width:16px}.track-count{display:none}}@media(max-width:420px){.player-body{padding:23px 20px 25px}.art{min-height:220px}.transport{gap:7px}.control{width:48px;height:48px}.control.skip{width:55px;height:55px}.control.play{width:68px;height:68px}}@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important}}
  </style>
</head>
<body><main class="shell">
  <header class="topbar"><div class="brand"><span class="brand-mark">♪</span><div><p class="eyebrow">HOST MUSIC CONSOLE</p><h1>KTV 主持播放台</h1></div></div><span class="track-count">11 首歌曲</span></header>
  <div id="message" class="message" role="alert"></div>
  <div class="layout">
    <section id="player" class="player" aria-label="目前播放歌曲">
      <div class="art"><div class="status-pill"><span class="status-dot"></span><span id="statusText">準備播放</span></div><div class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div></div>
      <div class="player-body"><div id="songNumber" class="song-number"></div><h2 id="title" class="now-title"></h2><p id="artist" class="now-artist"></p><input id="timeline" class="timeline" type="range" min="0" max="100" value="0" step="0.1" aria-label="歌曲播放進度"><div class="time-row"><span id="currentTime">0:00</span><span id="duration">0:00</span></div><div class="transport"><button id="prevBtn" class="control" type="button" aria-label="上一首">❮</button><button id="backBtn" class="control skip" type="button" aria-label="倒退 5 秒">−5秒</button><button id="playBtn" class="control play" type="button" aria-label="播放">▶</button><button id="forwardBtn" class="control skip" type="button" aria-label="快轉 5 秒">+5秒</button><button id="nextBtn" class="control" type="button" aria-label="下一首">❯</button></div><p class="shortcut">空白鍵：播放／暫停　← →：倒退／快轉 5 秒</p></div>
      <audio id="audio" preload="metadata"></audio>
    </section>
    <section class="playlist" aria-label="歌曲清單"><div class="playlist-head"><h2>歌曲清單</h2><p>點選歌曲後會立即播放</p></div><div id="songRows" class="songs"></div></section>
  </div>
</main><script src="./app.js?v=player-20261003"></script></body></html>
