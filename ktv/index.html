<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KTV 猜歌控制台</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1400px;margin:0 auto;padding:28px 24px 60px}.head,.actions,.controls,.nav{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.head{justify-content:space-between;margin-bottom:20px}h1{margin:0;font-size:clamp(28px,4vw,48px)}button{font:inherit;border:1px solid #d5dbea;border-radius:10px;background:#fff;color:#26324a;padding:12px 18px;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:#3457d5;border-color:#3457d5;color:white}.download{background:#172d61;color:#fff;border-color:#172d61}.message{padding:12px 16px;border-radius:8px;margin:12px 0}.error{background:#fff0f2;color:#a82d45}.ok{background:#e7f8ef;color:#176f47}.stage{background:linear-gradient(145deg,#111d40,#1d3d7d);color:#fff;border-radius:18px;padding:42px;text-align:center}.num{color:#b9cafc;font-size:20px;font-weight:700}.title{font-size:clamp(42px,7vw,82px);font-weight:850;line-height:1.15;margin:16px 0 4px}.artist{font-size:28px;color:#d2dcff;margin-bottom:30px}.controls{justify-content:center}.controls button,.nav button{font-size:22px;font-weight:750;min-height:60px}.play{background:#42d39a;border-color:#42d39a;color:#082b25;min-width:230px}.nav{justify-content:center;margin-top:24px}.nav button{background:transparent;color:#fff;border-color:#7892d7;min-width:210px}.list,.settings{background:#fff;border:1px solid #e4e8f1;border-radius:14px;margin-top:22px;padding:20px}.row{width:100%;display:grid;grid-template-columns:58px 1fr auto;align-items:center;gap:12px;border:0;border-top:1px solid #edf0f6;border-radius:0;text-align:left}.row.now{background:#eaf0ff;box-shadow:inset 5px #3457d5}.row strong{font-size:20px}.row small{display:block;color:#77819a}.state{font-size:13px;color:#5d6c8f;font-weight:700}.edit{display:grid;grid-template-columns:38px 1fr 1fr 2fr 120px 120px 100px;gap:8px;align-items:center;border-top:1px solid #edf0f6;padding:10px 0}.edit input{width:100%;padding:9px;border:1px solid #d5dbea;border-radius:7px}.muted{color:#77819a}
    @media(max-width:850px){.edit{grid-template-columns:32px 1fr 1fr}.edit input:nth-of-type(3){grid-column:span 2}.edit label{font-size:12px}.row{grid-template-columns:45px 1fr}.state{grid-column:2}.stage{padding:30px 14px}.controls button,.nav button{width:100%}}
  </style>
</head>
<body><main class="wrap">
  <header class="head"><h1>🎤 KTV 猜歌控制台</h1><div class="actions"><button id="hostBtn" class="primary">主持模式</button><button id="settingsBtn">設定模式</button><button id="allBtn" class="download">全部下載</button></div></header>
  <div id="message"></div>
  <section class="stage"><div class="num" id="num"></div><div class="title" id="title"></div><div class="artist" id="artist"></div><div class="controls"><button class="play" id="playBtn">▶ 播放提示</button><button id="pauseBtn">⏸ 暫停</button><button id="stopBtn">■ 停止</button><button id="replayBtn">↺ 從頭播放</button></div><div class="nav"><button id="prevBtn">← 上一題</button><button id="nextBtn">下一題 →</button></div><audio id="audio"></audio></section>
  <section id="settings" class="settings" hidden><h2>歌曲設定</h2><p class="muted">修改會保存在此瀏覽器。</p><div id="editRows"></div></section>
  <section class="list"><h2>題目清單</h2><p class="muted">Space 播放／暫停　← → 換題　Esc 停止　R 重播</p><div id="songRows"></div></section>
</main><script src="./app.js"></script></body></html>
