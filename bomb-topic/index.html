<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#ff4444" />
  <title>定時炸彈桌遊</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Arial", "Helvetica", sans-serif;
      background: #1a1a1a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* ── SCREENS ── */
    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      width: 100%;
      max-width: 600px;
      padding: 40px 24px 80px;
      min-height: 100vh;
    }
    .screen.active { display: flex; }

    h1 {
      font-size: 2.4rem;
      letter-spacing: 3px;
    }

    /* ── BUTTON ── */
    .btn {
      padding: 14px 48px;
      font-size: 1.6rem;
      font-weight: bold;
      background: linear-gradient(135deg, #c01a1a, #ff4444);
      color: #fff;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 24px rgba(255,50,50,0.45);
      letter-spacing: 2px;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .btn:active { transform: scale(0.96); box-shadow: 0 2px 10px rgba(255,50,50,0.3); }

    /* ── TIME SETTINGS ── */
    .time-settings {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 14px;
      padding: 14px 22px;
      font-size: 1.1rem;
    }
    .time-settings label { color: #aaa; font-size: 0.95rem; }
    .time-settings input[type="number"] {
      width: 68px;
      padding: 6px 8px;
      font-size: 1.25rem;
      text-align: center;
      background: #3a3a3a;
      color: #fff;
      border: 1px solid #666;
      border-radius: 8px;
    }
    .time-settings .sep { color: #888; font-size: 1.3rem; }
    .time-error {
      color: #ff6b6b;
      font-size: 0.9rem;
      min-height: 1.2em;
    }

    /* ── RUNNING: TOPIC ── */
    #topic-display {
      font-size: clamp(1.8rem, 5.5vw, 2.8rem);
      font-weight: bold;
      padding: 24px 32px;
      border-radius: 20px;
      border: 2px solid rgba(255,80,80,0.35);
      background: rgba(255,40,40,0.07);
      max-width: 92%;
      line-height: 1.45;
      text-align: center;
      animation: topic-pulse 2s ease-in-out infinite;
    }
    @keyframes topic-pulse {
      0%,100% {
        text-shadow: 0 0 10px rgba(255,120,120,0.4);
        box-shadow: 0 0 20px rgba(255,50,50,0.1);
        border-color: rgba(255,80,80,0.3);
      }
      50% {
        text-shadow: 0 0 28px rgba(255,130,130,1), 0 0 55px rgba(255,60,60,0.45);
        box-shadow: 0 0 55px rgba(255,50,50,0.35);
        border-color: rgba(255,100,100,0.85);
      }
    }

    /* ── RUNNING: BOMB ── */
    .bomb-wrapper {
      position: relative;
      width: 140px;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #bomb-emoji {
      font-size: 7rem;
      display: inline-block;
      animation: bomb-sway 1.6s ease-in-out infinite;
      filter: drop-shadow(0 0 18px rgba(255,120,0,0.5));
    }
    @keyframes bomb-sway {
      0%,100% { transform: rotate(-8deg) scale(1); }
      50%      { transform: rotate(8deg)  scale(1.05); }
    }

    /* sparks */
    .spark {
      position: absolute;
      border-radius: 50%;
      animation: spark-fly var(--dur) ease-out infinite;
      animation-delay: var(--delay);
    }
    @keyframes spark-fly {
      0%   { opacity: 1; transform: translate(0,0) scale(1); }
      100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0.1); }
    }

    /* ── RUNNING: WARNING DOTS ── */
    .warning-strip {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .w-dot {
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #ff2222;
      animation: w-blink 1s ease-in-out infinite;
    }
    .w-dot:nth-child(3) { animation-delay: 0.33s; }
    .w-dot:nth-child(5) { animation-delay: 0.66s; }
    @keyframes w-blink {
      0%,100% { opacity: 0.15; box-shadow: none; }
      50%      { opacity: 1;    box-shadow: 0 0 8px #ff2222, 0 0 18px #ff0000; }
    }
    .w-label {
      font-size: 0.82rem;
      letter-spacing: 5px;
      color: #555;
      font-weight: bold;
    }

    /* ── RUNNING: MARQUEE ── */
    .marquee-outer {
      position: fixed;
      bottom: 0; left: 0;
      width: 100%;
      overflow: hidden;
      background: rgba(255,0,0,0.07);
      border-top: 1px solid rgba(255,0,0,0.18);
      padding: 7px 0;
    }
    .marquee-inner {
      display: inline-flex;
      white-space: nowrap;
      animation: marquee-scroll 14s linear infinite;
      color: #ff4444;
      font-size: 0.85rem;
      letter-spacing: 3px;
      font-weight: bold;
    }
    @keyframes marquee-scroll {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    /* ── EDGE GLOW ── */
    #edge-glow {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 50;
      transition: box-shadow 0.6s;
    }

    /* ── FLASH ── */
    #flash {
      position: fixed; inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 200;
      transition: opacity 0.08s;
    }

    /* ── BOOM SCREEN ── */
    .boom-explosion { font-size: 5.5rem; animation: boom-shake 0.3s infinite; }
    .boom-text {
      font-size: 5rem;
      font-weight: bold;
      color: #ff2020;
      animation: boom-shake 0.3s infinite;
      text-shadow: 0 0 30px #ff0000, 0 0 60px #ff6600;
    }
    @keyframes boom-shake {
      0%   { transform: translate(2px,  2px) rotate(0deg);  }
      14%  { transform: translate(-2px,-3px) rotate(-2deg); }
      28%  { transform: translate(-4px, 0  ) rotate(2deg);  }
      42%  { transform: translate(4px,  3px) rotate(0deg);  }
      57%  { transform: translate(2px, -2px) rotate(2deg);  }
      71%  { transform: translate(-2px, 3px) rotate(-2deg); }
      85%  { transform: translate(-3px, 1px) rotate(0deg);  }
      100% { transform: translate(3px, -2px) rotate(1deg);  }
    }
  </style>
</head>
<body>

  <div id="flash"></div>
  <div id="edge-glow"></div>

  <!-- ── IDLE SCREEN ── -->
  <div id="screen-idle" class="screen active">
    <h1>🎲 定時炸彈桌遊</h1>
    <div class="time-settings">
      <label>倒數時間</label>
      <input type="number" id="time-min" value="15" min="1" max="300" />
      <span class="sep">～</span>
      <input type="number" id="time-max" value="60" min="1" max="300" />
      <label>秒</label>
    </div>
    <div class="time-error" id="time-error"></div>
    <button class="btn" onclick="startGame()">開始遊戲</button>
  </div>

  <!-- ── RUNNING SCREEN ── -->
  <div id="screen-running" class="screen">
    <div id="topic-display"></div>
    <div class="bomb-wrapper">
      <span id="bomb-emoji">💣</span>
      <span class="spark" style="width:7px;height:7px;background:#ff6600;top:18px;right:30px;--tx:9px;--ty:-22px;--dur:0.45s;--delay:0s"></span>
      <span class="spark" style="width:5px;height:5px;background:#ffaa00;top:12px;right:23px;--tx:-6px;--ty:-26px;--dur:0.5s;--delay:0.15s"></span>
      <span class="spark" style="width:4px;height:4px;background:#ffffff;top:20px;right:18px;--tx:13px;--ty:-16px;--dur:0.38s;--delay:0.28s"></span>
      <span class="spark" style="width:6px;height:6px;background:#ff3300;top:14px;right:34px;--tx:-9px;--ty:-18px;--dur:0.55s;--delay:0.4s"></span>
    </div>
    <div class="warning-strip">
      <div class="w-dot"></div>
      <span class="w-label">DANGER</span>
      <div class="w-dot"></div>
      <span class="w-label">DANGER</span>
      <div class="w-dot"></div>
    </div>
    <div class="marquee-outer">
      <div class="marquee-inner" id="marquee-inner">
        ⚠&nbsp;&nbsp;計時中&nbsp;&nbsp;⚠&nbsp;&nbsp;小心炸彈&nbsp;&nbsp;⚠&nbsp;&nbsp;快點回答&nbsp;&nbsp;⚠&nbsp;&nbsp;計時中&nbsp;&nbsp;⚠&nbsp;&nbsp;小心炸彈&nbsp;&nbsp;⚠&nbsp;&nbsp;快點回答&nbsp;&nbsp;⚠&nbsp;&nbsp;計時中&nbsp;&nbsp;⚠&nbsp;&nbsp;小心炸彈&nbsp;&nbsp;⚠&nbsp;&nbsp;快點回答&nbsp;&nbsp;⚠&nbsp;&nbsp;計時中&nbsp;&nbsp;⚠&nbsp;&nbsp;小心炸彈&nbsp;&nbsp;⚠&nbsp;&nbsp;快點回答&nbsp;&nbsp;
      </div>
    </div>
  </div>

  <!-- ── BOOM SCREEN ── -->
  <div id="screen-boom" class="screen">
    <div class="boom-explosion">💥</div>
    <div class="boom-text">BOOM！</div>
    <button class="btn" onclick="resetGame()" style="margin-top:8px">再玩一次</button>
  </div>

  <script>
    const topics = [
      "操場上可以看到的東西",
      "宇宙中可能有的事物",
      "廁所裡會突然冒出的驚嚇",
      "夢境中可能遇到的怪事",
      "平行世界的你會做的工作",
      "叢林探險會遇到的驚嚇",
      "時間旅行者會帶的裝備",
      "如果恐龍還在會看到的場景",
      "手機突然變成魔法神器的功能",
      "平常不會說出口的內心OS",
      "派對上最怕聽到的爆料",
      "戶外露營可能遇到的神秘生物",
      "科技展上讓人驚呼的發明",
      "假裝成熟時會做的奇妙舉動",
      "穿越到古代必備的現代物品",
      "電影片場會發生的NG狀況",
      "動物園裡動物的內心OS",
      "美食家會挑剔的奇怪理由",
      "劇場彩排時最怕出錯的橋段",
      "如果恐怖片主角很理性的反應",
      "超級英雄退休後會做的事",
      "新年會許的絕妙願望",
      "下雨天可以自嗨的活動",
      "晴天爆汗也想玩的戶外活動",
      "從老闆口中聽到會崩潰的句子",
      "工作摸魚的最佳偽裝技巧",
      "夜市攤販的奇怪招客方式",
      "超商架上讓人困惑的物品",
      "廚房裡會偷吃你食物的兇手",
      "冰箱裡最不想看到的東西",
      "睡前一定會做的放鬆儀式",
      "旅行最怕忘記帶的必需品",
      "登山包裡藏著的秘密物品",
      "寵物店會賣的可愛又奇怪的東西",
      "半夜肚子餓會做的特製料理",
      "海邊野餐一定會帶的東西",
      "如果你是忍者會用的武器",
      "童年卡通角色長大後的職業",
      "兒童主題樂園會看到的設施",
      "當你變成一隻貓第一件事",
      "超級市場結帳時最怕聽到的狀況",
      "打開鞋櫃會掉出來的東西",
      "電梯裡會遇到的尷尬情境",
      "長輩聚會一定會問的問題",
      "社群媒體上令人崩潰的貼文",
      "戀愛中會做的超幼稚舉動",
      "暗戀對象不小心看到會崩潰的東西",
      "假日百貨公司會看到的景象",
      "過年團圓飯一定會出現的菜",
      "室友最常犯的地雷行為",
      "下班前五分鐘的內心戲",
      "健身教練會糾正的習慣",
      "如果你中了樂透會先買的物品",
      "朋友生日驚喜會準備的小道具",
      "交通工具上最怕遇到的旅伴",
      "博物館裡會看到的奇妙展品",
      "夏天避暑會做的行程安排",
      "冬天保暖最離奇的方法",
    ];

    // ── Audio ──
    let audioCtx = null, tickBuffer = null, boomBuffer = null, tickSource = null;
    let useAudioElements = false, tickAudio = null, boomAudio = null;

    async function initAudio() {
      if (audioCtx || useAudioElements) return;
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") await audioCtx.resume();
        function decode(ab) {
          return new Promise((res, rej) => audioCtx.decodeAudioData(ab, res, rej));
        }
        const [tickData, boomData] = await Promise.all([
          fetch("tick.mp3").then(r => r.arrayBuffer()),
          fetch("boom.mp3").then(r => r.arrayBuffer()),
        ]);
        tickBuffer = await decode(tickData);
        boomBuffer = await decode(boomData);
      } catch (e) {
        audioCtx = null;
        useAudioElements = true;
        tickAudio = new Audio("tick.mp3");
        boomAudio = new Audio("boom.mp3");
        tickAudio.loop = true;
      }
    }

    function playTick() {
      if (useAudioElements) { tickAudio.currentTime = 0; tickAudio.play(); return; }
      if (!audioCtx || !tickBuffer) return;
      tickSource = audioCtx.createBufferSource();
      tickSource.buffer = tickBuffer;
      tickSource.loop = true;
      tickSource.connect(audioCtx.destination);
      tickSource.start();
    }

    function stopTick() {
      if (useAudioElements) { tickAudio.pause(); return; }
      if (tickSource) { tickSource.stop(); tickSource = null; }
    }

    function playBoom() {
      if (useAudioElements) { boomAudio.currentTime = 0; boomAudio.play(); return; }
      if (!audioCtx || !boomBuffer) return;
      const src = audioCtx.createBufferSource();
      src.buffer = boomBuffer;
      src.connect(audioCtx.destination);
      src.start();
    }

    // ── Screens ──
    function showScreen(id) {
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      document.getElementById("screen-" + id).classList.add("active");
    }

    // ── Tension system ──
    let countdownTotal = 0, elapsed = 0;
    let bombTimer = null, tensionInterval = null;

    function updateTension(p) {
      // Bomb sway speed
      document.getElementById("bomb-emoji").style.animationDuration =
        Math.max(0.25, 1.6 - p * 1.35) + "s";
      // Topic pulse speed
      document.getElementById("topic-display").style.animationDuration =
        Math.max(0.35, 2 - p * 1.6) + "s";
      // Warning blink speed
      document.querySelectorAll(".w-dot").forEach(d =>
        d.style.animationDuration = Math.max(0.12, 1 - p * 0.85) + "s"
      );
      // Marquee speed
      document.getElementById("marquee-inner").style.animationDuration =
        Math.max(2.5, 14 - p * 11.5) + "s";
      // Edge glow intensity
      const glow = Math.floor(p * 90);
      const alpha = (p * 0.55).toFixed(2);
      document.getElementById("edge-glow").style.boxShadow =
        `inset 0 0 ${glow}px rgba(255,0,0,${alpha})`;
      // Background color shift → dark red
      const r = Math.round(26 + p * 64);
      const gb = Math.round(Math.max(0, 26 - p * 22));
      document.body.style.background = `rgb(${r},${gb},${gb})`;
    }

    // ── Game logic ──
    async function startGame() {
      const minVal = parseInt(document.getElementById("time-min").value, 10);
      const maxVal = parseInt(document.getElementById("time-max").value, 10);
      const errorEl = document.getElementById("time-error");

      if (isNaN(minVal) || isNaN(maxVal) || minVal < 1 || maxVal < 1) {
        errorEl.textContent = "請輸入有效的秒數（最小 1 秒）";
        return;
      }
      if (minVal > maxVal) {
        errorEl.textContent = "最小秒數不能大於最大秒數";
        return;
      }
      errorEl.textContent = "";

      await initAudio();

      const topic = topics[Math.floor(Math.random() * topics.length)];
      document.getElementById("topic-display").textContent = topic;

      countdownTotal = Math.floor(Math.random() * (maxVal - minVal + 1)) + minVal;
      elapsed = 0;
      updateTension(0);
      showScreen("running");
      stopTick();
      playTick();

      clearTimeout(bombTimer);
      clearInterval(tensionInterval);

      tensionInterval = setInterval(() => {
        elapsed++;
        updateTension(Math.min(elapsed / countdownTotal, 1));
      }, 1000);

      bombTimer = setTimeout(triggerBoom, countdownTotal * 1000);
    }

    function triggerBoom() {
      clearInterval(tensionInterval);
      stopTick();

      const flash = document.getElementById("flash");
      flash.style.opacity = "1";
      setTimeout(() => { flash.style.opacity = "0"; }, 160);

      document.body.style.background = "#1a1a1a";
      document.getElementById("edge-glow").style.boxShadow = "none";

      setTimeout(() => {
        showScreen("boom");
        playBoom();
      }, 220);
    }

    function resetGame() {
      document.body.style.background = "#1a1a1a";
      document.getElementById("edge-glow").style.boxShadow = "none";
      showScreen("idle");
    }
  </script>
</body>
</html>
