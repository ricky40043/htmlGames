
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#ff4444" />
  <title>定時炸彈桌遊</title>
  <style>
    body {
      font-family: "Arial", sans-serif;
      background-color: #222;
      color: #fff;
      text-align: center;
      padding-top: 100px;
    }
    #topic {
      font-size: 2rem;
      margin: 20px;
    }
    #boom {
      font-size: 4rem;
      color: red;
      display: none;
      animation: shake 0.5s infinite;
    }
    button {
      padding: 10px 20px;
      font-size: 1.5rem;
      cursor: pointer;
    }

    @keyframes shake {
      0% { transform: translate(1px, 1px) rotate(0deg); }
      10% { transform: translate(-1px, -2px) rotate(-1deg); }
      20% { transform: translate(-3px, 0px) rotate(1deg); }
      30% { transform: translate(3px, 2px) rotate(0deg); }
      40% { transform: translate(1px, -1px) rotate(1deg); }
      50% { transform: translate(-1px, 2px) rotate(-1deg); }
      60% { transform: translate(-3px, 1px) rotate(0deg); }
      70% { transform: translate(3px, 1px) rotate(-1deg); }
      80% { transform: translate(-1px, -1px) rotate(1deg); }
      90% { transform: translate(1px, 2px) rotate(0deg); }
      100% { transform: translate(1px, -2px) rotate(-1deg); }
    }
  </style>
</head>
<body>
  <h1>🎲 定時炸彈桌遊</h1>
  <div id="topic">請按下開始</div>
  <div id="boom">💣 BOOM！</div>
  <button onclick="startGame()">開始遊戲</button>

  <audio id="tick-sound" src="tick.mp3" preload="auto"></audio>
  <audio id="boom-sound" src="boom.mp3" preload="auto"></audio>

  <script>
    const topics = [
      "操場上可以看到的東西",
      "宇宙中可能有的事物",
      "廁所裡會突然冒出的驚嚇",
      "夢境中可能遇到的怪事",
      "平行世界的你會做的工作",
      "叢林探險會遇到的驚嚇",
      "時間旅行者會帶的裝備",
      "如果恐龍還在會看到的場景",
      "手機突然變成魔法神器的功能",
      "平常不會說出口的內心OS",
      "派對上最怕聽到的爆料",
      "戶外露營可能遇到的神秘生物",
      "科技展上讓人驚呼的發明",
      "假裝成熟時會做的奇妙舉動",
      "穿越到古代必備的現代物品",
      "電影片場會發生的NG狀況",
      "動物園裡動物的內心OS",
      "美食家會挑剔的奇怪理由",
      "劇場彩排時最怕出錯的橋段",
      "如果恐怖片主角很理性的反應",
      "超級英雄退休後會做的事",
      "新年會許的絕妙願望",
      "下雨天可以自嗨的活動",
      "晴天爆汗也想玩的戶外活動",
      "從老闆口中聽到會崩潰的句子",
      "工作摸魚的最佳偽裝技巧",
      "夜市攤販的奇怪招客方式",
      "超商架上讓人困惑的物品",
      "廚房裡會偷吃你食物的兇手",
      "冰箱裡最不想看到的東西",
      "睡前一定會做的放鬆儀式",
      "旅行最怕忘記帶的必需品",
      "登山包裡藏著的秘密物品",
      "寵物店會賣的可愛又奇怪的東西",
      "半夜肚子餓會做的特製料理",
      "海邊野餐一定會帶的東西",
      "如果你是忍者會用的武器",
      "童年卡通角色長大後的職業",
      "兒童主題樂園會看到的設施",
      "當你變成一隻貓第一件事",
      "超級市場結帳時最怕聽到的狀況",
      "打開鞋櫃會掉出來的東西",
      "電梯裡會遇到的尷尬情境",
      "長輩聚會一定會問的問題",
      "社群媒體上令人崩潰的貼文",
      "戀愛中會做的超幼稚舉動",
      "暗戀對象不小心看到會崩潰的東西",
      "假日百貨公司會看到的景象",
      "過年團圓飯一定會出現的菜",
      "室友最常犯的地雷行為",
      "下班前五分鐘的內心戲",
      "健身教練會糾正的習慣",
      "如果你中了樂透會先買的物品",
      "朋友生日驚喜會準備的小道具",
      "交通工具上最怕遇到的旅伴",
      "博物館裡會看到的奇妙展品",
      "夏天避暑會做的行程安排",
      "冬天保暖最離奇的方法",
    ];

    let timer;

    function startGame() {
      document.getElementById("boom").style.display = "none";

      const topic = topics[Math.floor(Math.random() * topics.length)];
      document.getElementById("topic").textContent = topic;

      const countdown = Math.floor(Math.random() * 61) + 60;
      const tickSound = document.getElementById("tick-sound");
      const boomSound = document.getElementById("boom-sound");

      tickSound.loop = true;
      tickSound.play();

      clearTimeout(timer);
      timer = setTimeout(() => {
        tickSound.pause();
        boomSound.play();
        document.getElementById("boom").style.display = "block";
      }, countdown * 1000);
    }
  </script>
</body>
</html>
