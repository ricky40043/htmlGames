<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#ff4444" />
  <title>定時炸彈桌遊</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Arial", "Helvetica", sans-serif;
      background: #1a1a1a;
      color: #fff;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* ── SCREENS ── */
    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      width: 100%;
      max-width: 540px;
      padding: 24px 20px 48px;
      min-height: 100vh;
      min-height: 100dvh;
    }
    .screen.active { display: flex; }

    h1 {
      font-size: 2.2rem;
      letter-spacing: 2px;
    }

    /* ── BUTTON ── */
    .btn {
      padding: 14px 48px;
      font-size: 1.5rem;
      font-weight: bold;
      background: linear-gradient(135deg, #c01a1a, #ff4444);
      color: #fff;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 24px rgba(255,50,50,0.45);
      letter-spacing: 2px;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .btn:active { transform: scale(0.96); box-shadow: 0 2px 10px rgba(255,50,50,0.3); }

    /* ── TIME SETTINGS ── */
    .time-config-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .time-toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid #444;
      border-radius: 999px;
      padding: 6px 16px;
      font-size: 0.85rem;
      color: #888;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
    }
    .time-toggle-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ccc;
      border-color: #666;
    }
    .time-settings {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: #242424;
      border: 1px solid #444;
      border-radius: 14px;
      padding: 12px 20px;
      font-size: 1.05rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      animation: panel-fade 0.2s ease-out;
    }
    .time-settings label { color: #aaa; font-size: 0.95rem; }
    .time-settings input[type="number"] {
      width: 68px;
      padding: 6px 8px;
      font-size: 1.25rem;
      text-align: center;
      background: #333;
      color: #fff;
      border: 1px solid #666;
      border-radius: 8px;
    }
    .time-settings .sep { color: #888; font-size: 1.3rem; }
    .time-error {
      color: #ff6b6b;
      font-size: 0.9rem;
      min-height: 1.2em;
    }

    /* ── RUNNING: TOPIC ── */
    #topic-display {
      font-size: clamp(1.8rem, 5.5vw, 2.8rem);
      font-weight: bold;
      padding: 24px 32px;
      border-radius: 20px;
      border: 2px solid rgba(255,80,80,0.35);
      background: rgba(255,40,40,0.07);
      max-width: 92%;
      line-height: 1.45;
      text-align: center;
      animation: topic-pulse 2s ease-in-out infinite;
    }
    @keyframes topic-pulse {
      0%,100% {
        text-shadow: 0 0 10px rgba(255,120,120,0.4);
        box-shadow: 0 0 20px rgba(255,50,50,0.1);
        border-color: rgba(255,80,80,0.3);
      }
      50% {
        text-shadow: 0 0 28px rgba(255,130,130,1), 0 0 55px rgba(255,60,60,0.45);
        box-shadow: 0 0 55px rgba(255,50,50,0.35);
        border-color: rgba(255,100,100,0.85);
      }
    }

    /* ── RUNNING: BOMB ── */
    .bomb-wrapper {
      position: relative;
      width: 140px;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #bomb-emoji {
      font-size: 7rem;
      display: inline-block;
      animation: bomb-sway 1.6s ease-in-out infinite;
      filter: drop-shadow(0 0 18px rgba(255,120,0,0.5));
    }
    @keyframes bomb-sway {
      0%,100% { transform: rotate(-8deg) scale(1); }
      50%      { transform: rotate(8deg)  scale(1.05); }
    }

    /* sparks */
    .spark {
      position: absolute;
      border-radius: 50%;
      animation: spark-fly var(--dur) ease-out infinite;
      animation-delay: var(--delay);
    }
    @keyframes spark-fly {
      0%   { opacity: 1; transform: translate(0,0) scale(1); }
      100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0.1); }
    }

    /* ── RUNNING: WARNING DOTS ── */
    .warning-strip {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .w-dot {
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #ff2222;
      animation: w-blink 1s ease-in-out infinite;
    }
    .w-dot:nth-child(3) { animation-delay: 0.33s; }
    .w-dot:nth-child(5) { animation-delay: 0.66s; }
    @keyframes w-blink {
      0%,100% { opacity: 0.15; box-shadow: none; }
      50%      { opacity: 1;    box-shadow: 0 0 8px #ff2222, 0 0 18px #ff0000; }
    }
    .w-label {
      font-size: 0.82rem;
      letter-spacing: 5px;
      color: #555;
      font-weight: bold;
    }

    /* ── RUNNING: MARQUEE ── */
    .marquee-outer {
      position: fixed;
      bottom: 0; left: 0;
      width: 100%;
      overflow: hidden;
      background: rgba(255,0,0,0.07);
      border-top: 1px solid rgba(255,0,0,0.18);
      padding: 7px 0;
    }
    .marquee-inner {
      display: inline-flex;
      white-space: nowrap;
      animation: marquee-scroll 14s linear infinite;
      color: #ff4444;
      font-size: 0.85rem;
      letter-spacing: 3px;
      font-weight: bold;
    }
    @keyframes marquee-scroll {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    /* ── EDGE GLOW ── */
    #edge-glow {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 50;
      transition: box-shadow 0.6s;
    }

    /* ── FLASH ── */
    #flash {
      position: fixed; inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 200;
      transition: opacity 0.08s;
    }

    /* ── BOOM SCREEN ── */
    .boom-explosion { font-size: 5.5rem; animation: boom-shake 0.3s infinite; }
    .boom-text {
      font-size: 5rem;
      font-weight: bold;
      color: #ff2020;
      animation: boom-shake 0.3s infinite;
      text-shadow: 0 0 30px #ff0000, 0 0 60px #ff6600;
    }
    @keyframes boom-shake {
      0%   { transform: translate(2px,  2px) rotate(0deg);  }
      14%  { transform: translate(-2px,-3px) rotate(-2deg); }
      28%  { transform: translate(-4px, 0  ) rotate(2deg);  }
      42%  { transform: translate(4px,  3px) rotate(0deg);  }
      57%  { transform: translate(2px, -2px) rotate(2deg);  }
      71%  { transform: translate(-2px, 3px) rotate(-2deg); }
      85%  { transform: translate(-3px, 1px) rotate(0deg);  }
      100% { transform: translate(3px, -2px) rotate(1deg);  }
    }

    /* ── MODE SELECTION TABS ── */
    .mode-tabs {
      display: flex;
      background: #242424;
      border: 1px solid #444;
      border-radius: 12px;
      padding: 4px;
      gap: 6px;
      width: 100%;
      max-width: 400px;
    }
    .mode-tab {
      flex: 1;
      padding: 10px 14px;
      font-size: 1rem;
      font-weight: bold;
      color: #999;
      background: transparent;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .mode-tab:hover {
      color: #fff;
    }
    .mode-tab.active {
      background: linear-gradient(135deg, #c01a1a, #ff4444);
      color: #fff;
      box-shadow: 0 2px 12px rgba(255, 68, 68, 0.35);
    }

    /* ── CUSTOM TOPICS PANEL ── */
    .custom-panel {
      width: 100%;
      max-width: 480px;
      background: #242424;
      border: 1px solid #3d3d3d;
      border-radius: 16px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      animation: panel-fade 0.25s ease-out;
    }
    @keyframes panel-fade {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .custom-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
    }
    .custom-panel-title {
      font-size: 0.95rem;
      font-weight: bold;
      color: #ff8888;
      letter-spacing: 1px;
    }
    .custom-count-badge {
      font-size: 0.8rem;
      background: #333;
      color: #ccc;
      padding: 3px 8px;
      border-radius: 999px;
    }
    .custom-inputs-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 220px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .custom-inputs-list::-webkit-scrollbar {
      width: 6px;
    }
    .custom-inputs-list::-webkit-scrollbar-track {
      background: #1a1a1a;
      border-radius: 4px;
    }
    .custom-inputs-list::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 4px;
    }
    .custom-inputs-list::-webkit-scrollbar-thumb:hover {
      background: #666;
    }
    .custom-row {
      display: flex;
      align-items: center;
      gap: 8px;
      animation: row-in 0.2s ease-out;
    }
    @keyframes row-in {
      from { opacity: 0; transform: translateX(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .custom-idx {
      font-size: 0.85rem;
      font-weight: bold;
      color: #888;
      width: 28px;
      text-align: center;
      flex-shrink: 0;
    }
    .custom-input {
      flex: 1;
      padding: 9px 12px;
      font-size: 0.95rem;
      background: #2e2e2e;
      color: #fff;
      border: 1px solid #555;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .custom-input:focus {
      border-color: #ff5555;
      box-shadow: 0 0 8px rgba(255, 85, 85, 0.35);
    }
    .custom-del-btn {
      width: 32px;
      height: 32px;
      background: #382424;
      color: #ff6666;
      border: 1px solid #5c3030;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }
    .custom-del-btn:hover {
      background: #5a2020;
      color: #fff;
      border-color: #ff4444;
    }
    .custom-actions {
      display: flex;
      gap: 8px;
      justify-content: space-between;
      flex-wrap: wrap;
    }
    .btn-sm {
      padding: 6px 12px;
      font-size: 0.85rem;
      font-weight: bold;
      background: #363636;
      color: #eee;
      border: 1px solid #555;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-sm:hover {
      background: #484848;
      border-color: #777;
      color: #fff;
    }
    .btn-sm.btn-add {
      background: rgba(255, 68, 68, 0.18);
      border-color: rgba(255, 80, 80, 0.4);
      color: #ff8888;
    }
    .btn-sm.btn-add:hover {
      background: rgba(255, 68, 68, 0.35);
      border-color: #ff6666;
      color: #fff;
    }

    /* ── ROUND BADGE (RUNNING) ── */
    .round-badge {
      font-size: 0.95rem;
      letter-spacing: 2px;
      padding: 6px 18px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ff9999;
      font-weight: bold;
    }

    /* ── TOPIC PACKS SELECTION ── */
    .pack-panel {
      width: 100%;
      max-width: 480px;
      background: #242424;
      border: 1px solid #3d3d3d;
      border-radius: 16px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.35);
      animation: panel-fade 0.25s ease-out;
    }
    .pack-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #333;
      padding-bottom: 8px;
    }
    .pack-panel-title {
      font-size: 0.95rem;
      font-weight: bold;
      color: #ff8888;
      letter-spacing: 1px;
    }
    .pack-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pack-link-btn {
      background: none;
      border: none;
      color: #aaa;
      font-size: 0.85rem;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      transition: color 0.15s, background 0.15s;
    }
    .pack-link-btn:hover {
      color: #ff7777;
      background: rgba(255, 255, 255, 0.05);
    }
    .pack-sep {
      color: #555;
      font-size: 0.8rem;
    }
    .pack-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .pack-card {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #2b2b2b;
      border: 1px solid #444;
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
    }
    .pack-card:hover {
      border-color: #666;
      background: #333;
    }
    .pack-card.checked {
      background: rgba(255, 68, 68, 0.12);
      border-color: rgba(255, 80, 80, 0.6);
      box-shadow: 0 0 10px rgba(255, 68, 68, 0.18);
    }
    .pack-card input[type="checkbox"] {
      accent-color: #ff3333;
      width: 18px;
      height: 18px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .pack-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
      flex: 1;
    }
    .pack-name {
      font-size: 0.9rem;
      font-weight: bold;
      color: #eee;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pack-card.checked .pack-name {
      color: #fff;
    }
    .pack-sub {
      font-size: 0.75rem;
      color: #888;
    }
    .pack-stats {
      font-size: 0.8rem;
      color: #aaa;
      text-align: right;
    }

    /* ── RUNNING ACTIONS (返回上一頁、換一題) ── */
    .running-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      width: 100%;
      max-width: 420px;
      margin-top: 4px;
      z-index: 10;
    }
    .run-action-btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 18px;
      font-size: 1.05rem;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
      letter-spacing: 1px;
    }
    .run-action-btn:active {
      transform: scale(0.96);
    }
    .run-btn-back {
      background: rgba(45, 45, 45, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #ddd;
      backdrop-filter: blur(8px);
    }
    .run-btn-back:hover {
      background: rgba(65, 65, 65, 0.9);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.35);
    }
    .run-btn-skip {
      background: rgba(255, 68, 68, 0.18);
      border: 1px solid rgba(255, 90, 90, 0.45);
      color: #ff9999;
      backdrop-filter: blur(8px);
      box-shadow: 0 2px 10px rgba(255, 50, 50, 0.15);
    }
    .run-btn-skip:hover {
      background: rgba(255, 68, 68, 0.32);
      border-color: #ff6666;
      color: #fff;
      box-shadow: 0 4px 16px rgba(255, 68, 68, 0.3);
    }

    /* ── BOOM SCREEN ENHANCEMENTS ── */
    .boom-info {
      text-align: center;
      max-width: 460px;
    }
    .boom-topic-revealed {
      font-size: 1.15rem;
      color: #ccc;
      margin-top: 4px;
      line-height: 1.4;
    }
    .boom-topic-revealed span {
      color: #ff8888;
      font-weight: bold;
    }
    .boom-next-box {
      background: rgba(255, 50, 50, 0.12);
      border: 1px solid rgba(255, 80, 80, 0.35);
      padding: 14px 20px;
      border-radius: 12px;
      margin: 4px 0 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
    }
    .boom-next-title {
      font-size: 1rem;
      color: #ffaaaa;
      font-weight: bold;
    }
    .boom-auto-hint {
      font-size: 0.85rem;
      color: #bbb;
    }
    .boom-auto-hint b {
      color: #ff4444;
      font-size: 1.1rem;
      display: inline-block;
      min-width: 14px;
    }
    .boom-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 320px;
      align-items: stretch;
    }
    .btn-secondary {
      padding: 10px 24px;
      font-size: 1rem;
      font-weight: bold;
      background: #2d2d2d;
      color: #bbb;
      border: 1px solid #555;
      border-radius: 10px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: all 0.15s;
    }
    .btn-secondary:hover {
      background: #3d3d3d;
      color: #fff;
    }

    /* ── MOBILE SOUND TIP (手機靜音模式提醒) ── */
    .mobile-sound-tip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 170, 0, 0.12);
      border: 1px solid rgba(255, 185, 0, 0.35);
      border-radius: 999px;
      padding: 7px 18px;
      font-size: 0.85rem;
      color: #ffd175;
      letter-spacing: 0.5px;
      line-height: 1.4;
      max-width: 92%;
      text-align: center;
      box-shadow: 0 2px 12px rgba(255, 170, 0, 0.08);
      animation: tip-glow 3s ease-in-out infinite alternate;
    }
    .mobile-sound-tip b {
      color: #fff;
    }
    .tip-icon {
      font-size: 1rem;
      flex-shrink: 0;
      animation: tip-shake 2.5s ease-in-out infinite;
    }
    @keyframes tip-shake {
      0%, 80%, 100% { transform: rotate(0); }
      85% { transform: rotate(14deg); }
      90% { transform: rotate(-14deg); }
      95% { transform: rotate(8deg); }
    }
    @keyframes tip-glow {
      from { border-color: rgba(255, 185, 0, 0.25); }
      to   { border-color: rgba(255, 185, 0, 0.6); box-shadow: 0 0 12px rgba(255, 170, 0, 0.2); }
    }

    /* ── MOBILE RESPONSIVE OPTIMIZATION (手機版排版優化) ── */
    @media (max-width: 600px) {
      .screen {
        padding: 16px 16px 36px;
        gap: 12px;
        justify-content: flex-start;
      }
      h1 {
        font-size: 1.75rem;
        letter-spacing: 1.5px;
        margin-top: 2px;
      }
      .mobile-sound-tip {
        padding: 5px 12px;
        font-size: 0.78rem;
        gap: 6px;
      }
      .mode-tabs {
        max-width: 100%;
        padding: 3px;
      }
      .mode-tab {
        padding: 8px 10px;
        font-size: 0.88rem;
      }
      .pack-panel {
        padding: 10px 12px;
        gap: 8px;
        max-width: 100%;
      }
      .pack-grid {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .pack-card {
        padding: 8px 10px;
        gap: 8px;
        border-radius: 8px;
      }
      .pack-card input[type="checkbox"] {
        width: 16px;
        height: 16px;
      }
      .pack-name {
        font-size: 0.82rem;
      }
      .pack-sub {
        font-size: 0.68rem;
      }
      .pack-stats {
        font-size: 0.75rem;
      }
      .custom-panel {
        padding: 12px 14px;
        gap: 10px;
        max-width: 100%;
      }
      .custom-inputs-list {
        max-height: 150px;
      }
      .time-config-wrapper {
        gap: 6px;
      }
      .time-toggle-btn {
        padding: 5px 14px;
        font-size: 0.8rem;
      }
      .time-settings {
        padding: 8px 14px;
        font-size: 0.95rem;
        gap: 8px;
      }
      .time-settings input[type="number"] {
        width: 58px;
        padding: 4px 6px;
        font-size: 1.1rem;
      }
      .time-error {
        min-height: 0;
        font-size: 0.8rem;
      }
      .btn {
        width: 100%;
        max-width: 300px;
        padding: 12px 24px;
        font-size: 1.35rem;
        border-radius: 12px;

    // ── Random Pack Selection Logic ──
    function renderPackCards() {
      const container = document.getElementById("pack-grid");
      if (!container) return;
      container.innerHTML = "";

      TOPIC_PACKS.forEach(pack => {
        const isChecked = selectedPackIds.has(pack.id);
        const card = document.createElement("div");
        card.className = `pack-card ${isChecked ? 'checked' : ''}`;
        card.onclick = (e) => {
          if (e.target.tagName !== "INPUT") {
            togglePack(pack.id);
          }
        };

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = isChecked;
        checkbox.onchange = () => togglePack(pack.id);

        const info = document.createElement("div");
        info.className = "pack-info";

        const name = document.createElement("span");
        name.className = "pack-name";

        info.appendChild(name);
        info.appendChild(sub);

        card.appendChild(checkbox);
        card.appendChild(info);
        container.appendChild(card);
      });

      updatePackStats();
    }

    function togglePack(id) {
      if (selectedPackIds.has(id)) {

    function toggleAllPacks(checkAll) {

    function getActiveRandomPool() {

      TOPIC_PACKS.forEach(pack => {
        if (selectedPackIds.has(pack.id)) {

    // ── Audio ──
    let audioCtx = null, tickBuffer = null, boomBuffer = null, tickSource = null;
    let audioReadyPromise = null, audioUnlocked = false;
    const tickAudio = new Audio("tick.mp3");
    const boomAudio = new Audio("boom.mp3");
    tickAudio.loop = true;
    tickAudio.preload = "auto";
    boomAudio.preload = "auto";

    async function initAudio() {
      if (audioReadyPromise) return audioReadyPromise;
      audioReadyPromise = (async () => {
        if (!window.AudioContext && !window.webkitAudioContext) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") await audioCtx.resume().catch(() => {});
        const [tickData, boomData] = await Promise.all([
          fetch("tick.mp3").then(r => r.arrayBuffer()),
          fetch("boom.mp3").then(r => r.arrayBuffer()),
        ]);
        tickBuffer = await audioCtx.decodeAudioData(tickData);
        boomBuffer = await audioCtx.decodeAudioData(boomData);
      })().catch(() => {
        audioCtx = null;
      });
      return audioReadyPromise;
    }

    function safePlay(audio) {
      const promise = audio.play();
      if (promise && typeof promise.catch === "function") promise.catch(() => {});
      return promise;
    }

    async function primeAudioElement(audio) {
      const wasMuted = audio.muted;
      const oldVolume = audio.volume;
      try {
        audio.muted = true;
        audio.volume = 0;
        await safePlay(audio);
        audio.pause();
        audio.currentTime = 0;
      } catch (_) {
        // Some browsers still reject priming; the Web Audio path remains preferred.
      } finally {
        audio.muted = wasMuted;
        audio.volume = oldVolume;
      }
    }

    async function unlockAudio() {
      if (audioUnlocked) return;
      await initAudio();
      if (audioCtx && audioCtx.state === "suspended") await audioCtx.resume().catch(() => {});

      if (audioCtx) {
        const silent = audioCtx.createBuffer(1, 1, audioCtx.sampleRate);
        const src = audioCtx.createBufferSource();
        src.buffer = silent;
        src.connect(audioCtx.destination);
        src.start(0);
      }

      await Promise.all([primeAudioElement(tickAudio), primeAudioElement(boomAudio)]);
      audioUnlocked = true;
    }

    function playTick() {
      if (!audioCtx || !tickBuffer) {
        tickAudio.currentTime = 0;
        safePlay(tickAudio);
        return;
      }
      if (audioCtx.state === "suspended") audioCtx.resume();
      tickSource = audioCtx.createBufferSource();
      tickSource.buffer = tickBuffer;
      tickSource.loop = true;
      tickSource.connect(audioCtx.destination);
      tickSource.start();
    }

    function stopTick() {
      tickAudio.pause();
      tickAudio.currentTime = 0;
      if (tickSource) {
        try { tickSource.stop(); } catch(_) {}
        tickSource = null;
      }
    }

    function playBoom() {
      if (!audioCtx || !boomBuffer) {
        boomAudio.currentTime = 0;
        safePlay(boomAudio);
        return;
      }
      if (audioCtx.state === "suspended") audioCtx.resume();
      const src = audioCtx.createBufferSource();
      src.buffer = boomBuffer;
      src.connect(audioCtx.destination);
      src.start();
    }

      // Marquee speed

        Math.max(2.5, 14 - p * 11.5) + "s";
      // Edge glow intensity

      document.getElementById("edge-glow").style.boxShadow =
        `inset 0 0 ${glow}px rgba(255,0,0,${alpha})`;
      // Background color shift → dark red
      const r = Math.round(26 + p * 64);
      const gb = Math.round(Math.max(0, 26 - p * 22));
      document.body.style.background = `rgb(${r},${gb},${gb})`;
    }

    // ── Game logic ──
    async function startGame() {
      const minVal = parseInt(document.getElementById("time-min").value, 10);
      const maxVal = parseInt(document.getElementById("time-max").value, 10);
      const errorEl = document.getElementById("time-error");

      if (isNaN(minVal) || isNaN(maxVal) || minVal < 1 || maxVal < 1) {
        errorEl.textContent = "請輸入有效的秒數（最小 1 秒）";
        return;
      }
      if (minVal > maxVal) {
        errorEl.textContent = "最小秒數不能大於最大秒數";
        return;
      }

      if (currentTopicMode === "custom") {
        customQueue = customTopicsList
          .map(t => t.trim())
          .filter(t => t.length > 0);

        if (customQueue.length === 0) {
          errorEl.textContent = "請至少輸入一個自訂題目！";
          return;
        }
        currentRoundIndex = 0;
      } else {
        const pool = getActiveRandomPool();
        if (pool.length === 0) {
          errorEl.textContent = "請至少勾選一個題組庫！";
          return;
        }
        customQueue = [];
        currentRoundIndex = 0;
      }

      errorEl.textContent = "";

      await unlockAudio();
      startTopicRound();
    }

    function startTopicRound() {
      clearAutoNext();
      clearTimeout(bombTimer);
      clearInterval(tensionInterval);

      const minVal = parseInt(document.getElementById("time-min").value, 10);
      const maxVal = parseInt(document.getElementById("time-max").value, 10);

      const roundBadge = document.getElementById("round-badge");
      if (currentTopicMode === "custom") {
        currentActiveTopic = customQueue[currentRoundIndex];
        roundBadge.textContent = `自訂題目 第 ${currentRoundIndex + 1} / ${customQueue.length} 題`;
      } else {
        const pool = getActiveRandomPool();
        let picked = pool[Math.floor(Math.random() * pool.length)];
        // 如果有 2 題以上，避免連續抽中完全相同題目
        if (pool.length > 1 && picked.text === currentActiveTopic) {
          const alternatePool = pool.filter(p => p.text !== currentActiveTopic);
          picked = alternatePool[Math.floor(Math.random() * alternatePool.length)];
        }
        currentActiveTopic = picked.text;
        roundBadge.textContent = `🎲 ${picked.packTitle}`;
      }

      const topicDisplay = document.getElementById("topic-display");
      topicDisplay.textContent = currentActiveTopic;

      // 每次獨立隨機在指定秒數區間中抽取
      countdownTotal = Math.floor(Math.random() * (maxVal - minVal + 1)) + minVal;
      elapsed = 0;

      updateTension(0);
      showScreen("running");
      stopTick();
      playTick();

      tensionInterval = setInterval(() => {
        elapsed++;
        updateTension(Math.min(elapsed / countdownTotal, 1));
      }, 1000);

      bombTimer = setTimeout(triggerBoom, countdownTotal * 1000);
    }

    function skipToNextTopic() {
      if (currentTopicMode === "custom") {
        if (customQueue.length > 1) {
          currentRoundIndex = (currentRoundIndex + 1) % customQueue.length;
        }
      }
      startTopicRound();
    }

    function triggerBoom() {
      clearInterval(tensionInterval);
      stopTick();

      const flash = document.getElementById("flash");
      flash.style.opacity = "1";
      setTimeout(() => { flash.style.opacity = "0"; }, 160);

      document.body.style.background = "#1a1a1a";
      document.getElementById("edge-glow").style.boxShadow = "none";

      setTimeout(() => {
        setupBoomScreen();
        showScreen("boom");
        playBoom();
      }, 220);
    }

    function setupBoomScreen() {
      clearAutoNext();

      const boomTitle = document.getElementById("boom-title");
      const currentTopicEl = document.getElementById("boom-current-topic");
      const nextSection = document.getElementById("boom-next-section");
      const mainBtn = document.getElementById("boom-main-btn");
      const cancelBtn = document.getElementById("boom-cancel-btn");

      currentTopicEl.textContent = currentActiveTopic;
      if (nextSection) nextSection.style.display = "none";

      // 「返回上一頁」按鈕始終顯示
      cancelBtn.style.display = "block";
      cancelBtn.textContent = "↩ 返回上一頁";

      if (currentTopicMode === "custom") {
        if (currentRoundIndex + 1 < customQueue.length) {
          // 自訂模式且還有下一題
          const nextRoundNum = currentRoundIndex + 2;
          const total = customQueue.length;
          boomTitle.textContent = `💥 第 ${currentRoundIndex + 1} 題 爆炸！`;
          mainBtn.textContent = `開始下一題（第 ${nextRoundNum} / ${total} 題）`;
        } else {
          // 自訂模式且全部完成
          boomTitle.textContent = "💥 全部題目完成！";
          mainBtn.textContent = "重新開始自訂題目（從第 1 題）";
        }
      } else {
        // 隨機題目模式
        boomTitle.textContent = "💥 BOOM！";
        mainBtn.textContent = "開始下一局";
      }
    }

    function onBoomMainAction() {
      clearAutoNext();
      if (currentTopicMode === "custom") {
        if (currentRoundIndex + 1 < customQueue.length) {
          currentRoundIndex++;
        } else {
          currentRoundIndex = 0; // 全部完成後重啟第一輪
        }
      }
      // 直接繼續進行下一局遊戲，不需退回首頁
      startTopicRound();
    }

    function proceedNextRound() {
      clearAutoNext();
      currentRoundIndex++;
      startTopicRound();
    }

    function clearAutoNext() {
      if (autoNextTimer) {
        clearTimeout(autoNextTimer);
        autoNextTimer = null;
      }
      if (autoNextInterval) {
        clearInterval(autoNextInterval);
        autoNextInterval = null;
      }
    }

    function resetGame() {
      clearAutoNext();
      clearTimeout(bombTimer);
      clearInterval(tensionInterval);
      stopTick();

      document.body.style.background = "#1a1a1a";
      document.getElementById("edge-glow").style.boxShadow = "none";
      showScreen("idle");
    }

    // 初始化渲染題組選擇與自訂題目列表
    renderPackCards();
    renderCustomInputs();
  </script>
<script src="/stats.js"></script>
</body>
</html>
