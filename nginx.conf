# 站台在 Cloudflare 後面，remote_addr 都是 Cloudflare 的 IP，要用真實來源 IP 才能限流。
map $http_cf_connecting_ip $tts_client {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}
limit_req_zone $tts_client zone=tts:10m rate=60r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location ^~ /api/ktv/ {
        proxy_pass http://ktv-api:8080/api/ktv/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1800s;
    }

    location ^~ /api/tts {
        limit_req zone=tts burst=30 nodelay;
        limit_req_status 429;
        # 用變數讓 nginx 在請求時才解析 tts-api；就算 tts-api 容器沒起來，
        # 整個網站也照樣啟動，只有語音退回瀏覽器內建語音。
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $tts_upstream http://tts-api:8080;
        proxy_pass $tts_upstream;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location ^~ /ktv/media/ {
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # The clock is normally opened as /fullscreen-clock/ (a directory URL),
    # not /fullscreen-clock/index.html. Disable caching for the whole clock
    # route so old inline JavaScript cannot survive a deployment.
    location ^~ /fullscreen-clock/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Other HTML pages should also always fetch the latest deployed version.
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }
}
