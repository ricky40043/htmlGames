server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The clock is normally opened as /fullscreen-clock/ (a directory URL),
    # not /fullscreen-clock/index.html. Disable caching for the whole clock
    # route so old inline JavaScript cannot survive a deployment.
    location ^~ /fullscreen-clock/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Other HTML pages should also always fetch the latest deployed version.
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }
}
