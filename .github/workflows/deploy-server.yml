name: Deploy to Home Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          ping: ${{ secrets.SERVER_HOST }}

      - name: Deploy htmlGames through SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            REPO_DIR="$(find /home/ricky -maxdepth 6 -type d -name htmlGames 2>/dev/null | while read -r dir; do
              if [ -d "$dir/.git" ]; then
                echo "$dir"
                break
              fi
            done)"

            if [ -z "$REPO_DIR" ]; then
              echo "htmlGames git repository not found under /home/ricky"
              exit 1
            fi

            echo "== Force sync tracked files from GitHub main =="
            echo "Repo: $REPO_DIR"
            git -C "$REPO_DIR" remote set-url origin https://github.com/ricky40043/htmlGames.git
            git -C "$REPO_DIR" fetch origin main
            git -C "$REPO_DIR" reset --hard origin/main
            echo "== Status before deploy =="
            git -C "$REPO_DIR" status --short
            echo "== Commit before deploy =="
            git -C "$REPO_DIR" rev-parse --short HEAD

            /home/ricky/deployments/scripts/deploy-app.sh htmlGames

            # 這裡原本把快取版本號寫死（例如 system-design-book.js?v=flows-20260905d），
            # 所以每次有人正常地升級快取版本，部署就會紅一次——實際上容器已經換好了，
            # 只是這個檢查在比對一個過期的字串。改成與版本號無關：
            #   1. 該有的教材資源有沒有被頁面引用（不管它掛的是哪一版）
            #   2. 頁面上引用到的每一個 js/css 是不是真的抓得到
            # 第 2 點比原本更嚴格，版本號打錯、檔案漏掉都會被擋下來。
            echo "== Smoke test deployed assets =="
            BASE=http://127.0.0.1:20600/software-learning
            fail=0
            for page in system-design-chapter.html system-design-simulator.html; do
              body=$(curl -fsS "$BASE/$page") || { echo "FAIL: 取不到 $page"; fail=1; continue; }
              for asset in system-design-terms.js system-design-glossary.js \
                           system-design-book-teaching-guides.js \
                           system-design-book-translation-overrides.js system-design-book.js; do
                case "$page" in
                  system-design-chapter.html)
                    printf '%s' "$body" | grep -qF "$asset?v=" || { echo "FAIL: $page 沒有引用 $asset"; fail=1; } ;;
                esac
              done
              for rel in $(printf '%s' "$body" | grep -oE '(src|href)="[^"]+\.(js|css)\?v=[^"]*"' | sed -E 's/^[a-z]+="//; s/"$//'); do
                curl -fsS -o /dev/null "$BASE/$rel" || { echo "FAIL: $page 引用的 $rel 抓不到"; fail=1; }
              done
            done
            [ "$fail" -eq 0 ] || exit 1
            echo "Terminology and readability assets served from running container."
