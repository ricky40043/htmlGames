name: Deploy to Home Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          ping: ${{ secrets.SERVER_HOST }}

      - name: Deploy htmlGames through SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            REPO_DIR="$(find /home/ricky -maxdepth 6 -type d -name htmlGames 2>/dev/null | while read -r dir; do
              if [ -d "$dir/.git" ]; then
                echo "$dir"
                break
              fi
            done)"

            if [ -z "$REPO_DIR" ]; then
              echo "htmlGames git repository not found under /home/ricky"
              exit 1
            fi

            echo "== Force sync tracked files from GitHub main =="
            echo "Repo: $REPO_DIR"
            git -C "$REPO_DIR" remote set-url origin https://github.com/ricky40043/htmlGames.git
            git -C "$REPO_DIR" fetch origin main
            git -C "$REPO_DIR" reset --hard origin/main
            echo "== Status before deploy =="
            git -C "$REPO_DIR" status --short
            echo "== Commit before deploy =="
            git -C "$REPO_DIR" rev-parse --short HEAD

            /home/ricky/deployments/scripts/deploy-app.sh htmlGames

            echo "== Smoke test deployed terminology assets =="
            curl -fsS http://127.0.0.1:20600/software-learning/system-design-chapter.html | grep -F 'system-design-terms.js?v=fe1eb98'
            curl -fsS 'http://127.0.0.1:20600/software-learning/system-design-terms.js?v=fe1eb98' | grep -F '資料庫層' >/dev/null
            curl -fsS 'http://127.0.0.1:20600/software-learning/system-design-terms.js?v=fe1eb98' | grep -F '網站／應用程式層' >/dev/null
            echo "Terminology assets verified from running container."
