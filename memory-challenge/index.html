<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080d16">
    <title>限時記憶大挑戰</title>
    <link rel="stylesheet" href="styles.css?v=10">
    <script defer src="bank.js?v=5"></script>
    <script defer src="sound.js?v=8"></script>
    <script defer src="game.js?v=10"></script>
</head>
<body data-phase="setup">
    <header class="topbar">
        <div class="topbar-inner">
            <a class="home-link" href="../index.html"><span aria-hidden="true">‹</span> 小遊戲大集合</a>
            <div class="topbar-actions">
                <button id="sound-toggle" class="outline compact" type="button" aria-pressed="true">音效開啟</button>
                <button id="effects-toggle" class="outline compact" type="button" aria-pressed="true">特效完整</button>
                <button id="fullscreen" class="outline compact" type="button">全螢幕</button>
                <button id="end-game" class="outline compact" type="button" hidden>結束本局</button>
            </div>
        </div>
    </header>

    <main id="main">
        <section id="setup" class="setup shell" aria-labelledby="game-title">
            <form id="setup-form">
                <div class="hero">
                    <div class="hero-scenes" aria-hidden="true">
                        <img src="images/launch-cover.webp" alt="" fetchpriority="high" decoding="async">
                        <img src="images/observatory-ice.webp" alt="" fetchpriority="low" decoding="async">
                        <img src="images/observatory-nebula.webp" alt="" fetchpriority="low" decoding="async">
                    </div>
                    <div class="hero-text">
                        <h1 id="game-title"><span>限時記憶</span><span>大挑戰</span></h1>
                        <p class="hero-instructions">看圖 10 秒，翻牌後憑記憶答題。</p>
                        <button id="start" class="primary launch-button" type="submit">開始挑戰 <span aria-hidden="true">→</span></button>
                        <p id="setup-error" class="error" role="alert" hidden></p>
                    </div>
                </div>
                <div class="setup-panels">
                    <section class="setup-panel" aria-labelledby="settings-title">
                        <div class="panel-heading">
                            <h2 id="settings-title">出題設定</h2>
                            <label class="mode-toggle"><input id="multiple-choice" type="checkbox">四選一模式</label>
                        </div>
                        <div class="controls-grid">
                            <div class="field">
                                <label for="rounds">每局圖片張數</label>
                                <div class="number-control">
                                    <input id="rounds" type="number" min="1" max="100" step="1" value="5" inputmode="numeric" aria-describedby="pool-count" required>
                                    <span class="number-unit" aria-hidden="true">張</span>
                                    <select id="rounds-menu" class="number-menu" aria-label="下拉選擇每局圖片張數">
                                        <option value="" disabled hidden>選擇張數</option>
                                    </select>
                                </div>
                            </div>
                            <div class="field">
                                <label for="questions">每張圖片題數</label>
                                <div class="number-control">
                                    <input id="questions" type="number" min="3" max="5" step="1" value="3" inputmode="numeric" aria-describedby="question-range" required>
                                    <span class="number-unit" aria-hidden="true">題</span>
                                    <select id="questions-menu" class="number-menu" aria-label="下拉選擇每張圖片題數">
                                        <option value="" disabled hidden>選擇題數</option>
                                        <option value="3" selected>3 題</option>
                                        <option value="4">4 題</option>
                                        <option value="5">5 題</option>
                                    </select>
                                </div>
                                <span id="question-range" class="sr-only">可選 3 至 5 題</span>
                            </div>
                            <label class="field">場景主題
                                <select id="theme"><option value="">全部主題</option></select>
                            </label>
                            <label class="field">圖片風格
                                <select id="style">
                                    <option value="">混合風格</option>
                                    <option value="photo">寫實真人風</option>
                                    <option value="cartoon">卡通風</option>
                                </select>
                            </label>
                        </div>
                        <p id="pool-count" class="help pool-count" aria-live="polite"></p>
                    </section>
                    <section class="setup-panel" aria-labelledby="players-title">
                        <div class="panel-heading">
                            <h2 id="players-title">玩家與隊伍</h2>
                            <p id="scoring-help" class="help">玩家口頭作答，主持人計分。</p>
                        </div>
                        <div class="player-settings">
                            <div class="field player-count-field">
                                <label for="player-count">玩家人數</label>
                                <div class="number-control">
                                    <input id="player-count" type="number" min="1" max="12" step="1" value="2" inputmode="numeric" aria-describedby="player-range" required>
                                    <span class="number-unit" aria-hidden="true">人</span>
                                    <select id="player-count-menu" class="number-menu" aria-label="下拉選擇玩家人數">
                                        <option value="" disabled hidden>選擇人數</option>
                                    </select>
                                </div>
                                <span id="player-range" class="sr-only">可選 1 至 12 人</span>
                            </div>
                            <div class="player-roster">
                                <p id="player-names-label">玩家名稱 <span class="help">選填</span></p>
                                <div id="player-names" class="player-names" role="group" aria-labelledby="player-names-label"></div>
                            </div>
                        </div>
                    </section>
                </div>
            </form>
        </section>

        <section id="game" class="game shell" aria-label="挑戰進行中" hidden>
            <div class="stage-heading">
                <p id="round-progress" class="round-progress"></p>
                <div class="stage-status">
                    <p id="phase-label" class="phase-label"></p>
                    <button id="skip-picture" class="outline compact skip-picture" type="button" hidden>跳過這張圖 <span aria-hidden="true">⏭</span></button>
                </div>
            </div>
            <div id="stage" class="stage"></div>
            <section id="scores" class="scores" aria-label="目前分數" hidden></section>
        </section>
        <noscript><p class="shell">請開啟 JavaScript 才能遊玩。</p></noscript>
    </main>

    <dialog id="end-dialog" aria-labelledby="end-title">
        <form method="dialog">
            <h2 id="end-title">結束這局？</h2>
            <p>本局的進度與分數將清除。</p>
            <div class="dialog-actions">
                <button class="outline" value="cancel" autofocus>繼續遊戲</button>
                <button class="primary" value="end">結束本局</button>
            </div>
        </form>
    </dialog>
    <template id="finale-artwork">
        <div class="finale-art" aria-hidden="true">
            <img src="images/victory-supernova.webp" alt="" decoding="async">
            <svg class="cosmic-orbits" viewBox="0 0 660 660" fill="none" aria-hidden="true" focusable="false">
                <defs>
                    <linearGradient id="orbit-aqua" x1="0" y1="0" x2="1" y2="1">
                        <stop stop-color="#a9f8ff"/>
                        <stop offset="1" stop-color="#ad8dff" stop-opacity=".75"/>
                    </linearGradient>
                    <linearGradient id="orbit-gold" x1="0" y1="1" x2="1" y2="0">
                        <stop stop-color="#ffeeb8"/>
                        <stop offset="1" stop-color="#ffb86d" stop-opacity=".62"/>
                    </linearGradient>
                </defs>
                <g class="orbit-outer">
                    <circle cx="330" cy="330" r="286" stroke="#9ce6ff" stroke-opacity=".34" stroke-dasharray="1 9" stroke-width="3"/>
                    <circle cx="330" cy="330" r="271" stroke="url(#orbit-aqua)" stroke-width="2.5" stroke-dasharray="172 208 54 353 130 192 26 568"/>
                    <circle cx="414" cy="72" r="5" fill="#c9f9ff"/>
                    <circle cx="74" cy="419" r="4" fill="#ccbaff"/>
                    <circle cx="574" cy="449" r="6" stroke="#bdf3ff" stroke-width="2"/>
                </g>
                <g class="orbit-inner">
                    <ellipse cx="330" cy="330" rx="276" ry="162" transform="rotate(-33 330 330)" stroke="url(#orbit-gold)" stroke-width="2.2" stroke-dasharray="210 36 61 180 287 359 46 170"/>
                    <ellipse cx="330" cy="330" rx="242" ry="162" transform="rotate(35 330 330)" stroke="url(#orbit-aqua)" stroke-opacity=".61" stroke-width="1.5" stroke-dasharray="96 58 34 270 150 140 64 350"/>
                    <circle cx="540" cy="168" r="4" fill="#fff1c0"/>
                    <circle cx="200" cy="540" r="3.5" fill="#d0f8ff"/>
                </g>
                <g class="cosmic-shockwave" stroke="url(#orbit-gold)">
                    <circle cx="330" cy="330" r="242" stroke-width="4"/>
                    <circle cx="330" cy="330" r="260" stroke-width="1.5" stroke-opacity=".74"/>
                </g>
                <g class="cosmic-shockwave cosmic-shockwave-late" stroke="url(#orbit-aqua)">
                    <circle cx="330" cy="330" r="265" stroke-width="4"/>
                </g>
            </svg>
        </div>
    </template>
    <div id="live-status" class="sr-only" role="status" aria-live="polite"></div>
    <div id="confetti" class="confetti" aria-hidden="true"></div>
</body>
</html>
