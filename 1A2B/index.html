<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1A2B 猜數字遊戲</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0; padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
            background: #0d0d14;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 32px 16px 60px;
        }
        .container {
            background: #16161f;
            border: 1px solid #252535;
            border-radius: 22px;
            padding: 32px 28px;
            max-width: 960px;
            width: 100%;
        }
        @media (max-width: 480px) {
            .container { padding: 22px 16px; }
        }
        .rule-card {
            background: rgba(102,126,234,0.07);
            border-radius: 14px;
            padding: 20px 22px;
            margin-bottom: 24px;
            border-left: 4px solid #667eea;
        }
        .rule-card h2 {
            margin-bottom: 12px;
            font-size: 1.1em;
            color: #a78bfa;
            letter-spacing: 1px;
        }
        .rule-card ul {
            list-style: none;
            padding-left: 0;
            line-height: 1.75;
            font-size: 0.92em;
            color: #888;
        }
        .rule-card li::before {
            content: "▸";
            color: #667eea;
            margin-right: 8px;
        }
        .rule-card strong { color: #f87171; }
        h1 {
            text-align: center;
            font-size: clamp(1.6rem, 5vw, 2.2rem);
            letter-spacing: 2px;
            margin-bottom: 28px;
            background: linear-gradient(135deg, #a78bfa, #667eea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .screen { display: none; }
        .screen.active { display: block; }

        /* ── Buttons ── */
        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin: 8px 0;
            transition: transform 0.12s, box-shadow 0.15s;
            letter-spacing: 1px;
        }
        .btn:hover { box-shadow: 0 6px 20px rgba(102,126,234,0.35); }
        .btn:active { transform: scale(0.97); }

        /* ── Inputs ── */
        .input-group { margin: 18px 0; }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #888;
            font-size: 0.88rem;
            letter-spacing: 0.5px;
        }
        .input-group input {
            width: 100%;
            padding: 12px 14px;
            background: #0d0d14;
            color: #fff;
            border: 1px solid #2e2e40;
            border-radius: 10px;
            font-size: 1.05em;
            transition: border-color 0.2s;
        }
        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        /* ── Record ── */
        .record {
            background: #0d0d14;
            border: 1px solid #1e1e2a;
            border-radius: 12px;
            padding: 16px;
            margin: 16px 0;
            max-height: 420px;
            overflow-y: auto;
        }
        .record-grid {
            display: grid;
            gap: 10px;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        }
        .record-columns {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
        }
        @media (min-width: 1200px) {
            .record-columns { grid-template-columns: repeat(4, 1fr); }
        }
        .player-column {
            background: #16161f;
            border-radius: 10px;
            padding: 12px;
            border: 1px solid #2e2e40;
        }
        .player-column h4 {
            color: #667eea;
            margin-bottom: 10px;
            text-align: center;
            font-size: 0.95em;
            border-bottom: 1px solid #2e2e40;
            padding-bottom: 8px;
        }
        .player-column.active {
            border: 1px solid #667eea;
            box-shadow: 0 0 16px rgba(102,126,234,0.2);
        }
        .record-item {
            padding: 9px 11px;
            background: #0d0d14;
            border-radius: 8px;
            border-left: 3px solid #667eea;
            font-size: 0.9em;
            margin-bottom: 6px;
        }
        .record-item .guess { font-weight: bold; color: #fff; font-size: 1.05em; }
        .record-item .result { color: #a78bfa; font-weight: bold; margin-left: 8px; }
        .record-item .target { color: #444; font-size: 0.8em; display: block; margin-top: 2px; }

        /* ── Player turn ── */
        .player-turn {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #1a1a2e, #2d2b55);
            color: #ffd700;
            border-radius: 14px;
            margin-bottom: 22px;
            font-size: clamp(1.1rem, 4vw, 1.5rem);
            font-weight: 700;
            letter-spacing: 0.06em;
            border: 1px solid #3d3a6e;
        }

        /* ── Player setup cards ── */
        .player-input {
            display: flex;
            align-items: center;
            gap: 14px;
            background: #0d0d14;
            border: 1px solid #1e1e2a;
            border-radius: 14px;
            padding: 16px 18px;
            margin: 10px 0;
        }
        .player-badge {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            flex-shrink: 0;
            color: #fff;
        }
        .player-input-inner { flex: 1; }
        .player-input-inner label {
            display: block;
            font-size: 0.82rem;
            color: #555;
            margin-bottom: 6px;
        }
        .player-input-inner input {
            width: 100%;
            background: #16161f;
            color: #fff;
            border: 1px solid #2e2e40;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 1.05rem;
            letter-spacing: 4px;
            transition: border-color 0.2s;
        }
        .player-input-inner input:focus {
            outline: none;
            border-color: #667eea;
        }

        .error { color: #f87171; margin: 10px 0; text-align: center; font-size: 0.9rem; }
        .success {
            color: #4ade80;
            font-size: 1.4em;
            text-align: center;
            margin: 20px 0;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 1A2B 猜數字</h1>
        <div class="rule-card">
            <h2>遊戲規則速覽</h2>
            <ul>
                <li>目標是猜出 <strong>4 位不重複數字</strong> 的密碼，數字可為 0-9。</li>
                <li>每次猜測後會回報 <strong>A</strong>（數字位置都正確）與 <strong>B</strong>（數字對但位置錯）。</li>
                <li>電腦模式：由系統出題，持續猜到獲得 4A 為止。</li>
                <li>多人模式：每位玩家互相出題，輪流猜下一位的密碼，最先猜中者獲勝。</li>
                <li>建議使用紙筆記錄靈感，並善用歷史紀錄來排除不可能組合。</li>
            </ul>
        </div>
        
        <!-- 模式選擇畫面 -->
        <div id="modeScreen" class="screen active">
            <h2 style="text-align: center; margin-bottom: 20px; color: #c4b5fd; letter-spacing: 1px;">選擇遊戲模式</h2>
            <button class="btn" onclick="selectMode('computer')">💻 電腦出題模式</button>
            <button class="btn" onclick="selectMode('multiplayer')">👥 多人對戰模式</button>
        </div>

        <!-- 多人模式：設定人數 -->
        <div id="playerCountScreen" class="screen">
            <h2 style="text-align: center; margin-bottom: 20px; color: #c4b5fd; letter-spacing: 1px;">設定玩家人數</h2>
            <div class="input-group">
                <label>玩家人數</label>
                <input type="number" id="playerCount" min="2" value="2">
            </div>
            <button class="btn" onclick="setupPlayers()">確定</button>
            <button class="btn" style="background: #2a2a3a; color: #888;" onclick="backToMode()">返回</button>
        </div>

        <!-- 多人模式：每個人出題 -->
        <div id="setupAnswersScreen" class="screen">
            <h2 style="text-align: center; margin-bottom: 20px; color: #c4b5fd; letter-spacing: 1px;">每位玩家出題</h2>
            <div id="playerSetupList"></div>
            <button class="btn" onclick="startMultiplayerGame()">開始遊戲</button>
        </div>

        <!-- 遊戲進行畫面 -->
        <div id="gameScreen" class="screen">
            <div id="playerTurnInfo" class="player-turn"></div>
            <div class="input-group">
                <label>輸入你的猜測 (4位不重複數字)</label>
                <input type="text" id="guessInput" maxlength="4" placeholder="例如: 1234">
            </div>
            <div id="errorMsg" class="error"></div>
            <button class="btn" onclick="makeGuess()">猜測</button>
            
            <h3 style="margin-top: 30px; color: #888; letter-spacing: 1px;">猜測紀錄</h3>
            <div id="recordList" class="record"></div>
            
            <button class="btn" style="background: #2a2a3a; color: #888; margin-top: 20px;" onclick="restartGame()">重新開始</button>
        </div>

        <!-- 遊戲結束畫面 -->
        <div id="endScreen" class="screen">
            <div id="winnerInfo" class="success"></div>
            <h3 style="margin-top: 30px; color: #888; letter-spacing: 1px;">完整紀錄</h3>
            <div id="finalRecords" class="record"></div>
            <button class="btn" onclick="restartGame()">再玩一次</button>
        </div>
    </div>

    <script>
        let gameMode = '';
        let playerCount = 0;
        let players = [];
        let currentPlayerIndex = 0;
        let answers = {};
        let records = {};
        let computerAnswer = '';

        function selectMode(mode) {
            gameMode = mode;
            if (mode === 'computer') {
                startComputerGame();
            } else {
                showScreen('playerCountScreen');
            }
        }

        function generateRandomNumber() {
            let digits = [];
            while (digits.length < 4) {
                let digit = Math.floor(Math.random() * 10).toString();
                if (!digits.includes(digit)) {
                    digits.push(digit);
                }
            }
            return digits.join('');
        }

        function startComputerGame() {
            computerAnswer = generateRandomNumber();
            players = ['玩家'];
            currentPlayerIndex = 0;
            records = {'玩家': []};
            updateGameScreen();
            showScreen('gameScreen');
        }

        function setupPlayers() {
            playerCount = parseInt(document.getElementById('playerCount').value);
            if (isNaN(playerCount) || playerCount < 2) {
                alert('請輸入至少2人');
                return;
            }
            
            players = [];
            for (let i = 1; i <= playerCount; i++) {
                players.push(`玩家${i}`);
            }
            
            let html = '';
            players.forEach((player, index) => {
                html += `
                    <div class="player-input">
                        <div class="player-badge">${index + 1}</div>
                        <div class="player-input-inner">
                            <label>${player} 的秘密答案（4位不重複數字）</label>
                            <input type="text" inputmode="numeric" id="answer${index}" maxlength="4" placeholder="例如: 1234" autocomplete="off">
                        </div>
                    </div>
                `;
            });
            document.getElementById('playerSetupList').innerHTML = html;
            addAnswerInputListeners();
            showScreen('setupAnswersScreen');
        }

        function startMultiplayerGame() {
            answers = {};
            let valid = true;
            let errorPlayer = '';
            
            players.forEach((player, index) => {
                let el = document.getElementById(`answer${index}`);
                let answer = el.dataset.realValue !== undefined && el.dataset.realValue !== '' ? el.dataset.realValue : el.value;
                if (!isValidNumber(answer)) {
                    errorPlayer = player;
                    valid = false;
                    return;
                }
                answers[player] = answer;
            });
            
            if (!valid) {
                alert(`${errorPlayer} 的數字重複或不符合規則！`);
                return;
            }
            
            currentPlayerIndex = 0;
            records = {};
            players.forEach(player => {
                records[player] = [];
            });
            
            updateGameScreen();
            showScreen('gameScreen');
        }

        function isValidNumber(num) {
            if (num.length !== 4) return false;
            if (!/^\d+$/.test(num)) return false;
            let digits = num.split('');
            return new Set(digits).size === 4;
        }

        function calculateAB(guess, answer) {
            let a = 0, b = 0;
            for (let i = 0; i < 4; i++) {
                if (guess[i] === answer[i]) {
                    a++;
                } else if (answer.includes(guess[i])) {
                    b++;
                }
            }
            return {a, b};
        }

        function updateGameScreen() {
            let currentPlayer = players[currentPlayerIndex];
            let targetPlayer = gameMode === 'computer' ? '電腦' : players[(currentPlayerIndex + 1) % players.length];
            
            document.getElementById('playerTurnInfo').textContent = 
                gameMode === 'computer' 
                    ? `${currentPlayer} 的回合 - 猜測電腦的數字`
                    : `${currentPlayer} 的回合 - 猜測 ${targetPlayer} 的數字`;
            
            updateRecordList();
            document.getElementById('guessInput').value = '';
            document.getElementById('errorMsg').textContent = '';
        }

        function updateRecordList() {
            let html = '';
            
            if (gameMode === 'computer') {
                // 電腦模式：只顯示單一玩家紀錄
                let currentPlayer = players[0];
                if (records[currentPlayer] && records[currentPlayer].length > 0) {
                    html += '<div class="record-grid">';
                    records[currentPlayer].forEach(record => {
                        html += `
                            <div class="record-item">
                                <span class="guess">${record.guess}</span>
                                <span class="result">${record.a}A${record.b}B</span>
                            </div>
                        `;
                    });
                    html += '</div>';
                } else {
                    html = '<p style="text-align: center; color: #999;">尚無紀錄</p>';
                }
            } else {
                // 多人模式：顯示所有玩家的分欄紀錄
                html = '<div class="record-columns">';
                players.forEach((player, index) => {
                    let isActive = index === currentPlayerIndex ? 'active' : '';
                    html += `<div class="player-column ${isActive}">`;
                    html += `<h4>${player}</h4>`;
                    
                    if (records[player] && records[player].length > 0) {
                        records[player].forEach(record => {
                            html += `
                                <div class="record-item">
                                    <div>
                                        <span class="guess">${record.guess}</span>
                                        <span class="result">${record.a}A${record.b}B</span>
                                    </div>
                                    <span class="target">猜 ${record.target}</span>
                                </div>
                            `;
                        });
                    } else {
                        html += '<p style="text-align: center; color: #999; font-size: 0.9em;">尚無紀錄</p>';
                    }
                    
                    html += '</div>';
                });
                html += '</div>';
            }
            
            document.getElementById('recordList').innerHTML = html;
        }

        function makeGuess() {
            let guess = document.getElementById('guessInput').value;
            let errorMsg = document.getElementById('errorMsg');
            
            if (!isValidNumber(guess)) {
                errorMsg.textContent = '請輸入4位不重複的數字！';
                return;
            }
            
            let currentPlayer = players[currentPlayerIndex];
            
            if (gameMode === 'computer') {
                // 電腦模式：玩家一直猜到猜中為止
                let result = calculateAB(guess, computerAnswer);
                records[currentPlayer].push({
                    guess: guess,
                    a: result.a,
                    b: result.b
                });
                
                if (result.a === 4) {
                    showWinner(currentPlayer);
                    return;
                }
                
                updateRecordList();
                document.getElementById('guessInput').value = '';
                document.getElementById('errorMsg').textContent = '';
            } else {
                // 多人模式：每人猜一次就換下一個人
                let targetIndex = (currentPlayerIndex + 1) % players.length;
                let answer = answers[players[targetIndex]];
                
                let result = calculateAB(guess, answer);
                records[currentPlayer].push({
                    guess: guess,
                    a: result.a,
                    b: result.b,
                    target: players[targetIndex]
                });
                
                if (result.a === 4) {
                    showWinner(currentPlayer);
                    return;
                }
                
                // 換下一個玩家
                currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
                updateGameScreen();
            }
        }

        function showWinner(winner) {
            let winnerInfo = document.getElementById('winnerInfo');
            winnerInfo.innerHTML = `🎉 恭喜 ${winner} 獲勝！🎉`;
            
            let finalHtml = '';
            
            if (gameMode === 'computer') {
                finalHtml += `<h4 style="color: #667eea; margin-top: 15px;">玩家的紀錄</h4>`;
                finalHtml += '<div class="record-grid">';
                records['玩家'].forEach(record => {
                    finalHtml += `
                        <div class="record-item">
                            <span class="guess">${record.guess}</span>
                            <span class="result">${record.a}A${record.b}B</span>
                        </div>
                    `;
                });
                finalHtml += '</div>';
            } else {
                finalHtml = '<div class="record-columns">';
                players.forEach(player => {
                    finalHtml += `<div class="player-column">`;
                    finalHtml += `<h4>${player}</h4>`;
                    
                    if (records[player] && records[player].length > 0) {
                        records[player].forEach(record => {
                            finalHtml += `
                                <div class="record-item">
                                    <div>
                                        <span class="guess">${record.guess}</span>
                                        <span class="result">${record.a}A${record.b}B</span>
                                    </div>
                                    <span class="target">猜 ${record.target}</span>
                                </div>
                            `;
                        });
                    }
                    
                    finalHtml += '</div>';
                });
                finalHtml += '</div>';
            }
            
            document.getElementById('finalRecords').innerHTML = finalHtml;
            showScreen('endScreen');
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');
        }

        function backToMode() {
            showScreen('modeScreen');
        }

        function restartGame() {
            gameMode = '';
            playerCount = 0;
            players = [];
            currentPlayerIndex = 0;
            answers = {};
            records = {};
            computerAnswer = '';
            showScreen('modeScreen');
        }

        document.getElementById('guessInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                makeGuess();
            }
        });

        // 防止輸入重複數字
        document.getElementById('guessInput').addEventListener('input', function(e) {
            let value = e.target.value;
            // 移除非數字字元
            value = value.replace(/\D/g, '');
            // 移除重複數字
            let unique = '';
            for (let char of value) {
                if (!unique.includes(char)) {
                    unique += char;
                }
            }
            e.target.value = unique;
        });

        // 為出題輸入框添加即時遮罩（避免第一個字可見）
        function addAnswerInputListeners() {
            setTimeout(() => {
                document.querySelectorAll('[id^="answer"]').forEach(input => {
                    input.dataset.realValue = '';

                    input.addEventListener('keydown', function(e) {
                        if (e.key === 'Backspace') {
                            e.preventDefault();
                            let real = this.dataset.realValue;
                            real = real.slice(0, -1);
                            this.dataset.realValue = real;
                            this.value = '●'.repeat(real.length);
                        }
                    });

                    input.addEventListener('input', function(e) {
                        let displayed = this.value;
                        let real = this.dataset.realValue;
                        let bulletCount = (displayed.match(/●/g) || []).length;
                        let newChars = displayed.replace(/●/g, '').replace(/\D/g, '');
                        real = real.slice(0, bulletCount) + newChars;
                        let unique = '';
                        for (let char of real) {
                            if (!unique.includes(char)) unique += char;
                        }
                        real = unique.slice(0, 4);
                        this.dataset.realValue = real;
                        this.value = '●'.repeat(real.length);
                    });
                });
            }, 100);
        }
    </script>
<script src="/stats.js"></script>
</body>
</html>
