    <link rel="stylesheet" href="full-course.css">

    <script defer src="lessons/00.js"></script>
    <script defer src="lessons/10.js"></script>

</head>
<body>
    <div id="app">
        <div id="topbar">
            <a class="tbtn back" href="../system-design.html">← 章節目錄</a>
            <div class="brand">✉ 第 2 冊第 8 章｜分散式 Email 服務 <b>互動動畫課程</b></div>
            <label class="sr-only" for="chapSel">跳到章節</label><select id="chapSel"></select>
            <div class="sp"></div>
            <button class="tbtn on" id="bNotes" aria-pressed="true">📝 說明紀錄</button>
            <button class="tbtn" id="bScript">📄 完整講稿</button>
        </div>
        <div id="main">
            <div id="viewport"><div id="stageWrap"><div id="stage" aria-label="郵件系統動畫舞台"></div></div></div>
            <aside id="notes" aria-label="場景說明紀錄"></aside>
        </div>
        <div id="caption">按 ▶ 開始</div>
        <div id="controls">
            <div class="transport">
                <button class="cbtn" id="bPrevS" aria-label="上一場景" title="上一場景">⏮</button>
                <button class="cbtn" id="bPrev" aria-label="上一步" title="上一步（←）">‹</button>
                <button class="cbtn big" id="bPlay" aria-label="播放" title="播放／暫停（空白鍵）">▶</button>
                <button class="cbtn" id="bNext" aria-label="下一步" title="下一步（→）">›</button>
                <button class="cbtn" id="bNextS" aria-label="下一場景" title="下一場景">⏭</button>
            </div>
            <div id="time">0:00 / 0:00</div><div id="timeline" role="group" aria-label="課程時間軸"></div>
            <div class="course-options">
                <label class="sr-only" for="speed">播放速度</label>
                <select id="speed" title="播放速度">
                    <option value=".8">0.8×</option><option value="1" selected>1×</option>
                    <option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option>
                </select>
                <button class="tbtn on" id="bTTS" aria-pressed="true">🔊 旁白</button>
                <label class="sr-only" for="voiceSel">旁白語音</label><select id="voiceSel" title="旁白語音"></select>
                <button class="cbtn" id="bFull" aria-label="全螢幕" title="全螢幕">⛶</button>
            </div>
        </div>
    </div>
    <div id="tip"></div>
    <div id="intro"><div class="card">
        <div class="course-tag">SYSTEM DESIGN・DISTRIBUTED EMAIL SERVICE</div>
        <h1>分散式 Email 服務</h1>
        <div class="sub">完整互動動畫課程｜《System Design Interview Vol. 2》第 8 章，第 269–301 頁</div>
        <ol id="introList"></ol>
        <p class="sub" id="introDur"></p>
        <label class="intro-voice" for="introVoice">旁白語音 <select id="introVoice"></select></label>
        <div class="go">
            <button id="goTTS">▶ 開始上課（中文語音旁白）</button>
            <button class="s" id="goMute">▶ 靜音播放（只看字幕）</button>
            <button class="s" id="goBrowse">自己逐步翻閱</button>
            <button class="s" id="goResume" hidden>繼續上次進度</button>
            <a class="tbtn back" href="../system-design.html">← 回章節目錄</a>
        </div>
        <div class="hint">空白鍵暫停或續播，← → 切換步驟。可點時間軸、章節選單或右側說明紀錄跳轉。遇到互動實驗會暫停，操作完回到課程即可接續。</div>
    </div></div>
    <dialog id="scriptModal">
        <div class="inner">
            <div class="mh">
                <b>📄 完整講稿與重點筆記</b>
                <div class="sp"></div>
                <button id="scriptCopy" class="tbtn">複製全文</button>
                <button id="scriptClose" class="tbtn">✕ 關閉</button>
            </div>
            <div class="mb" id="scriptBody"></div>
        </div>
    </dialog>
    <dialog id="workshop">
        <div class="workshop-header">
            <b id="workshopTitle"></b>
            <button id="workshopClose" class="tbtn">✕ 回課程</button>
        </div>
        <div id="workshopBody"></div>
    </dialog>
    <audio id="narrator" preload="metadata"></audio>
</body>
</html>
