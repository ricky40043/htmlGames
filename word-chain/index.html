<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080510"><title>詞語接龍</title><style>:root{--p:#ff3d91;--v:#9f63ff;--b:#4bc8ff;--r:#ff445d;--m:#b9aac8}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07040c;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow-x:hidden;background:radial-gradient(circle at 15% 8%,#ff3d9130,transparent 30%),radial-gradient(circle at 85% 12%,#4bc8ff2b,transparent 32%),linear-gradient(145deg,#07040c,#190823 55%,#080510)}#fx{position:fixed;inset:0;z-index:0;pointer-events:none}.scan{position:fixed;inset:-45%;z-index:0;pointer-events:none;background:linear-gradient(115deg,transparent 43%,#4bc8ff0b 47%,#fff4 50%,#ff3d910c 53%,transparent 57%);animation:scan 7s linear infinite}.flash{position:fixed;inset:0;z-index:5;pointer-events:none;opacity:0;background:#fff}.flash.on{animation:flash .13s}.wrap{position:relative;z-index:2;max-width:900px;margin:auto;padding:22px 16px 42px}.top{text-align:center}.top:before{content:"LAST PLAYER STANDING";display:inline-block;padding:7px 14px;border:1px solid #ff3d9166;border-radius:999px;color:#ff91bd;font-size:.72rem;font-weight:1000;letter-spacing:.2em;background:#ff3d9110;box-shadow:0 0 24px #ff3d9130}h1{font-size:clamp(2.2rem,8vw,4.7rem);margin:12px 0 18px;text-shadow:0 0 18px #9f63ffaa,0 0 52px #4bc8ff44}.card{position:relative;overflow:hidden;background:linear-gradient(145deg,#241330ed,#100a19eb);border:1px solid #ffffff20;border-radius:30px;padding:24px;margin:18px 0;box-shadow:0 30px 90px #0009,0 0 55px #9f63ff18,inset 0 1px #fff2;backdrop-filter:blur(20px)}.card:before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,transparent,var(--p),var(--v),var(--b),transparent);filter:drop-shadow(0 0 10px var(--p))}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.grid>div{padding:13px;border-radius:18px;background:#ffffff08;border:1px solid #ffffff12}.wide{grid-column:1/-1}label{display:block;color:var(--m);font-size:.82rem;font-weight:900;margin-bottom:7px}input,select,textarea,button{width:100%;min-height:50px;border-radius:15px;border:1px solid #ffffff1e;background:#07060dc7;color:#fff;padding:12px 14px;font-size:1rem;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--p);box-shadow:0 0 0 4px #ff3d9122,0 0 24px #ff3d9120}button{cursor:pointer;border:0;font-weight:1000;transition:.16s;box-shadow:0 9px 26px #0005}button:active{transform:translateY(2px) scale(.985)}.primary{background:linear-gradient(135deg,var(--p),var(--v));color:#180713}.danger{background:linear-gradient(135deg,#ff7786,var(--r));color:#27060a}.ghost{background:#ffffff0c;border:1px solid #ffffff1e}.hidden{display:none!important}.center{text-align:center}.muted{color:var(--m)}.topic{font-size:clamp(2.7rem,10vw,5.6rem);font-weight:1000;letter-spacing:-.055em;margin:12px 0;background:linear-gradient(#fff,#ffb0d3);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 28px #ff3d9144)}#limitView{display:inline-flex;padding:7px 12px;border-radius:999px;background:#fff1;border:1px solid #fff2}#player{font-size:clamp(1.55rem,6vw,2.8rem);font-weight:1000;margin-top:18px;text-shadow:0 0 25px #4bc8ff55}.ring{--q:100%;position:relative;width:260px;height:260px;border-radius:50%;margin:25px auto;display:grid;place-items:center;background:conic-gradient(var(--p) var(--q),#ffffff10 0);box-shadow:0 0 70px #9f63ff44,0 0 0 10px #4bc8ff08}.ring:before{content:"";position:absolute;inset:13px;border-radius:50%;background:radial-gradient(circle,#241331,#0d0815 70%);border:1px solid #fff2}.ring:after{content:"TIME";position:absolute;top:68px;color:var(--m);font-size:.72rem;font-weight:1000;letter-spacing:.22em}.ring.critical{animation:critical .5s ease infinite alternate;box-shadow:0 0 90px #ff445daa}.big{position:relative;z-index:2;font-size:clamp(4.5rem,18vw,8rem);font-weight:1000;text-shadow:0 0 35px #ff3d9177}.players{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:24px 0}.pill{position:relative;padding:11px 16px;border-radius:999px;background:#ffffff09;border:1px solid #ffffff16;color:var(--m);font-weight:900;transition:.18s}.pill.active{background:linear-gradient(135deg,var(--b),var(--v));color:#100718;transform:translateY(-5px) scale(1.08);box-shadow:0 12px 36px #4bc8ff55}.pill.active:after{content:"⚡ YOUR TURN";position:absolute;top:-14px;right:0;font-size:.62rem;color:#fff;background:#ff3d91;padding:4px 8px;border-radius:999px;white-space:nowrap}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.result-icon{font-size:6rem;animation:boom .7s ease}.result-title{font-size:clamp(2.8rem,12vw,5.8rem);font-weight:1000;color:#ff6478;text-shadow:0 0 40px #ff445d99}.electric:before{content:"";position:fixed;inset:0;z-index:4;pointer-events:none;background:repeating-linear-gradient(125deg,transparent 0 47%,#fff 48%,#4bc8ff 49%,transparent 50%);mix-blend-mode:screen;opacity:.22;animation:zap .38s ease}.screen-shake{animation:shake .3s ease}.countdown-audio{display:inline-flex;align-items:center;gap:8px;margin-top:12px;color:#a999b9;font-size:.82rem}.countdown-audio input{width:18px;min-height:18px;accent-color:var(--p)}@keyframes scan{to{transform:translateX(45%)}}@keyframes flash{50%{opacity:.22}}@keyframes critical{to{transform:scale(1.035)}}@keyframes zap{to{opacity:0;transform:translateX(8%)}}@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}@keyframes boom{0%{transform:scale(.2);opacity:0}65%{transform:scale(1.2) rotate(-8deg)}100%{transform:scale(1)}}@media(max-width:560px){.wrap{padding:14px 11px 28px}.card{padding:18px;border-radius:23px}.grid,.actions{grid-template-columns:1fr}.wide{grid-column:auto}.ring{width:215px;height:215px}.ring:after{top:55px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important}}</style></head><body><canvas id="fx"></canvas><div class="scan"></div><div id="flash" class="flash"></div><div class="wrap"><div class="top"><h1>🔗 詞語接龍</h1></div><section id="setup" class="card"><div class="grid"><div><label>玩家人數</label><input id="count" type="number" min="2" max="12" value="3"></div><div><label>倒數秒數</label><input id="seconds" type="number" min="3" max="60" value="10"></div><div><label>字數限制</label><select id="limit"><option>不限</option><option>2 個字</option><option>3 個字</option><option>4 個字</option><option>5 個字</option><option>2～5 個字</option></select></div><div><label>題目</label><select id="topic"></select></div><div class="wide"><label>自訂題目</label><input id="custom" placeholder="例如：台灣地名"></div><div class="wide"><label>玩家名稱（每行一位）</label><textarea id="names" rows="4" placeholder="Ricky&#10;小明&#10;小美"></textarea></div></div><label class="countdown-audio"><input id="sound" type="checkbox" checked> 倒數音效（最後 3 秒加速）</label><button id="start" class="primary" style="margin-top:16px">開始競技</button></section><section id="game" class="card hidden center"><div class="muted">本回合題目</div><div id="topicView" class="topic"></div><div id="limitView" class="muted"></div><div id="player"></div><div id="ring" class="ring"><div id="time" class="big">10</div></div><div id="players" class="players"></div><div class="actions"><button id="pause" class="ghost">暫停</button><button id="fail" class="danger">判定失敗</button><button id="next" class="primary wide">回答成功／下一位（空白鍵）</button></div></section><section id="result" class="card hidden center"><div class="result-icon">💥</div><div class="result-title">TIME OUT</div><h2 id="loser"></h2><p id="line" class="muted"></p><div class="actions"><button id="same" class="ghost">同題再玩</button><button id="newTopic" class="primary">下一題</button><button onclick="location.reload()" class="ghost wide">修改設定</button></div></section></div><script>const topics=['國家名稱','台灣地名','捷運站名','世界城市','自然現象','交通工具','大學課程','大學科系','電影名稱','有數字的電影','有顏色的電影','男主角名字','女主角名字','夜市小吃','早餐店餐點','飲料名稱','水果名稱','動物名稱','職業','手機 App','冰箱裡可能有的東西','旅行會帶的東西','自訂'];const $=id=>document.getElementById(id);$('topic').innerHTML=topics.map(t=>`<option>${t}</option>`).join('');let players=[],pi=0,duration=10,end=0,raf=0,running=false,paused=false,remaining=0,lastSecond=-1,audioCtx=null;const fx=$('fx'),cx=fx.getContext('2d');let pts=[],conf=[];function resize(){fx.width=innerWidth*devicePixelRatio;fx.height=innerHeight*devicePixelRatio;fx.style.width=innerWidth+'px';fx.style.height=innerHeight+'px';cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();for(let i=0;i<(innerWidth<600?26:58);i++)pts.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:.5+Math.random()*1.8,v:.1+Math.random()*.3,a:.12+Math.random()*.4});function burst(n=100){for(let i=0;i<n;i++)conf.push({x:innerWidth/2,y:innerHeight*.25,vx:(Math.random()-.5)*9,vy:-2-Math.random()*6,g:.12+Math.random()*.08,l:70+Math.random()*45,w:3+Math.random()*5,h:6+Math.random()*10,c:`hsl(${Math.random()*360} 90% 62%)`})}(function draw(){cx.clearRect(0,0,innerWidth,innerHeight);for(const p of pts){p.y-=p.v;if(p.y<0){p.y=innerHeight;p.x=Math.random()*innerWidth}cx.globalAlpha=p.a;cx.fillStyle='#fff';cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill()}cx.globalAlpha=1;conf=conf.filter(c=>c.l-->0);for(const c of conf){c.x+=c.vx;c.y+=c.vy;c.vy+=c.g;cx.fillStyle=c.c;cx.fillRect(c.x,c.y,c.w,c.h)}requestAnimationFrame(draw)})();function unlockAudio(){audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();return audioCtx.resume()}function tone(freq,d=.07,type='square',gain=.08){if(!$('sound').checked||!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(gain,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}function tickSound(sec){tone(sec<=3?880:540,sec<=3?.11:.055,sec<=3?'sawtooth':'square',sec<=3?.12:.055);if(sec<=3){$('ring').classList.add('critical');document.body.classList.add('electric');setTimeout(()=>document.body.classList.remove('electric'),350)}else $('ring').classList.remove('critical')}function renderPlayers(){$('player').textContent='目前玩家：'+players[pi];$('players').innerHTML=players.map((p,i)=>`<span class="pill ${i===pi?'active':''}">${p}</span>`).join('')}function tick(now){if(!running||paused)return;remaining=Math.max(0,end-now);const sec=Math.ceil(remaining/1000);$('time').textContent=sec;$('ring').style.setProperty('--q',`${remaining/(duration*1000)*100}%`);if(sec!==lastSecond&&sec>0){lastSecond=sec;tickSound(sec)}if(remaining<=0)return lose();raf=requestAnimationFrame(tick)}function resetTimer(){cancelAnimationFrame(raf);end=performance.now()+duration*1000;lastSecond=-1;running=true;paused=false;$('ring').classList.remove('critical');raf=requestAnimationFrame(tick)}async function start(){await unlockAudio();duration=Math.max(3,Math.min(60,+$('seconds').value));const n=Math.max(2,Math.min(12,+$('count').value)),ns=$('names').value.split('\n').map(x=>x.trim()).filter(Boolean);players=Array.from({length:n},(_,i)=>ns[i]||`玩家 ${i+1}`);pi=0;localStorage.wordSettings=JSON.stringify({count:n,seconds:duration,limit:$('limit').value,topic:$('topic').value,custom:$('custom').value,names:$('names').value,sound:$('sound').checked});$('topicView').textContent=$('topic').value==='自訂'?($('custom').value.trim()||'自訂題目'):$('topic').value;$('limitView').textContent='字數：'+$('limit').value;$('setup').classList.add('hidden');$('game').classList.remove('hidden');renderPlayers();resetTimer()}function next(){if(!running||paused)return;pi=(pi+1)%players.length;renderPlayers();document.body.classList.add('electric');$('flash').classList.add('on');setTimeout(()=>{document.body.classList.remove('electric');$('flash').classList.remove('on')},350);resetTimer()}function lose(){running=false;cancelAnimationFrame(raf);tone(120,.55,'sawtooth',.18);document.body.classList.add('screen-shake');setTimeout(()=>document.body.classList.remove('screen-shake'),350);$('game').classList.add('hidden');$('result').classList.remove('hidden');$('loser').textContent=players[pi]+' 輸了 😆';$('line').textContent=['腦袋暫時塞車了！','被倒數追上了！','這一題光榮出局！'][Math.floor(Math.random()*3)];burst()}$('start').onclick=start;$('next').onclick=next;$('fail').onclick=lose;$('pause').onclick=()=>{if(!running)return;paused=!paused;$('pause').textContent=paused?'繼續':'暫停';if(!paused){end=performance.now()+remaining;raf=requestAnimationFrame(tick)}};$('same').onclick=()=>{$('result').classList.add('hidden');$('game').classList.remove('hidden');resetTimer()};$('newTopic').onclick=()=>{$('topicView').textContent=topics[Math.floor(Math.random()*(topics.length-1))];$('result').classList.add('hidden');$('game').classList.remove('hidden');pi=(pi+1)%players.length;renderPlayers();resetTimer()};try{const s=JSON.parse(localStorage.wordSettings||'{}');for(const k of ['count','seconds','limit','topic','custom','names'])if(s[k]!=null)$(k).value=s[k];if(s.sound!=null)$('sound').checked=s.sound}catch(e){}addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&!['INPUT','TEXTAREA','SELECT','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();document.activeElement?.blur();next()}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&running&&!paused)$('pause').click()});</script></body></html>
