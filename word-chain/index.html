<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0d0d14"><title>詞語接龍</title><style>*{box-sizing:border-box}body{margin:0;background:#0d0d14;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}a{color:#8ec5ff}.wrap{max-width:760px;margin:auto;padding:20px}.top{display:flex;justify-content:center;align-items:center;margin-bottom:18px}.card{background:#171721;border:1px solid #29293a;border-radius:20px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{display:block;color:#aaa;font-size:.9rem;margin-bottom:6px}input,select,textarea,button{width:100%;min-height:46px;border-radius:12px;border:1px solid #343447;background:#20202d;color:#fff;padding:10px;font-size:1rem}button{cursor:pointer;font-weight:700}.primary{background:#a78bfa;color:#111;border:0}.danger{background:#d94b55;border:0}.ghost{background:#242433}.hidden{display:none!important}.center{text-align:center}.big{font-size:clamp(3rem,14vw,7rem);font-weight:900;line-height:1.1}.topic{font-size:clamp(1.8rem,8vw,3.5rem);font-weight:800}.muted{color:#888}.players{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.pill{padding:8px 12px;border-radius:999px;background:#272738}.active{background:#a78bfa;color:#111}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.wide{grid-column:1/-1}.ring{width:220px;height:220px;border-radius:50%;margin:20px auto;display:grid;place-items:center;background:conic-gradient(#a78bfa var(--p,100%),#2b2b3b 0)}@media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{padding:14px}}</style></head><body><div class="wrap"><div class="top"><h1>🔗 詞語接龍</h1></div><section id="setup" class="card"><div class="grid"><div><label>玩家人數</label><input id="count" type="number" min="2" max="12" value="3"></div><div><label>倒數秒數</label><input id="seconds" type="number" min="3" max="60" value="10"></div><div><label>字數限制</label><select id="limit"><option>不限</option><option>2 個字</option><option>3 個字</option><option>4 個字</option><option>5 個字</option><option>2～5 個字</option></select></div><div><label>題目</label><select id="topic"></select></div><div class="wide"><label>自訂題目（選擇自訂時使用）</label><input id="custom" placeholder="例如：台灣地名"></div><div class="wide"><label>玩家名稱（每行一位）</label><textarea id="names" rows="4" placeholder="Ricky&#10;小明&#10;小美"></textarea></div></div><button id="start" class="primary" style="margin-top:14px">開始遊戲</button></section><section id="game" class="card hidden center"><div class="muted">題目</div><div id="topicView" class="topic"></div><div id="limitView" class="muted"></div><div id="player" class="topic" style="margin-top:14px"></div><div id="ring" class="ring"><div id="time" class="big">10</div></div><div id="players" class="players"></div><div class="actions" style="margin-top:18px"><button id="pause" class="ghost">暫停</button><button id="fail" class="danger">判定失敗</button><button id="next" class="primary wide">回答成功／下一位（空白鍵）</button></div></section><section id="result" class="card hidden center"><div class="big" style="font-size:3rem">時間到！</div><h2 id="loser"></h2><p id="line" class="muted"></p><div class="actions"><button id="same" class="ghost">同題再玩</button><button id="newTopic" class="primary">下一題</button><button onclick="location.reload()" class="ghost wide">修改設定</button></div></section></div><script>const topics=['國家名稱','台灣地名','捷運站名','世界城市','自然現象','交通工具','大學課程','大學科系','電影名稱','有數字的電影','有顏色的電影','男主角名字','女主角名字','夜市小吃','早餐店餐點','飲料名稱','水果名稱','動物名稱','職業','手機 App','冰箱裡可能有的東西','旅行會帶的東西','自訂'];const $=id=>document.getElementById(id);$('topic').innerHTML=topics.map(t=>`<option>${t}</option>`).join('');let players=[],pi=0,duration=10,end=0,raf=0,running=false,paused=false,remaining=0;function renderPlayers(){$('player').textContent='目前玩家：'+players[pi];$('players').innerHTML=players.map((p,i)=>`<span class="pill ${i===pi?'active':''}">${p}</span>`).join('')}function tick(now){if(!running||paused)return;remaining=Math.max(0,end-now);$('time').textContent=Math.ceil(remaining/1000);$('ring').style.setProperty('--p',`${remaining/(duration*1000)*100}%`);if(remaining<=0)return lose();raf=requestAnimationFrame(tick)}function resetTimer(){cancelAnimationFrame(raf);end=performance.now()+duration*1000;running=true;paused=false;raf=requestAnimationFrame(tick)}function start(){duration=Math.max(3,Math.min(60,+$('seconds').value));const n=Math.max(2,Math.min(12,+$('count').value));let ns=$('names').value.split('\n').map(x=>x.trim()).filter(Boolean);players=Array.from({length:n},(_,i)=>ns[i]||`玩家 ${i+1}`);pi=0;localStorage.wordSettings=JSON.stringify({count:n,seconds:duration,limit:$('limit').value,topic:$('topic').value,custom:$('custom').value,names:$('names').value});$('topicView').textContent=$('topic').value==='自訂'?($('custom').value.trim()||'自訂題目'):$('topic').value;$('limitView').textContent='字數：'+$('limit').value;$('setup').classList.add('hidden');$('game').classList.remove('hidden');renderPlayers();resetTimer()}function next(){if(!running||paused)return;pi=(pi+1)%players.length;renderPlayers();resetTimer()}function lose(){running=false;cancelAnimationFrame(raf);$('game').classList.add('hidden');$('result').classList.remove('hidden');$('loser').textContent=players[pi]+' 輸了 😆';$('line').textContent=['腦袋暫時塞車了！','被倒數追上了！','這一題光榮出局！'][Math.floor(Math.random()*3)]}$('start').onclick=start;$('next').onclick=next;$('fail').onclick=lose;$('pause').onclick=()=>{if(!running)return;paused=!paused;$('pause').textContent=paused?'繼續':'暫停';if(!paused){end=performance.now()+remaining;raf=requestAnimationFrame(tick)}};$('same').onclick=()=>{$('result').classList.add('hidden');$('game').classList.remove('hidden');resetTimer()};$('newTopic').onclick=()=>{$('topicView').textContent=topics[Math.floor(Math.random()*(topics.length-1))];$('result').classList.add('hidden');$('game').classList.remove('hidden');pi=(pi+1)%players.length;renderPlayers();resetTimer()};try{const s=JSON.parse(localStorage.wordSettings||'{}');for(const k of ['count','seconds','limit','topic','custom','names'])if(s[k]!=null)$(k).value=s[k]}catch(e){}addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&!['INPUT','TEXTAREA','SELECT','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();next()}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&running&&!paused)$('pause').click()});</script></body></html>
