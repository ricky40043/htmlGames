<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#110818"><title>詞語接龍</title>
<style>
:root{--pink:#ff4d8d;--purple:#a66cff;--blue:#5e8cff;--danger:#ff5566;--panel:rgba(25,15,37,.86);--line:rgba(255,255,255,.12);--muted:#b7a9c4}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 15% 10%,rgba(255,77,141,.2),transparent 31%),radial-gradient(circle at 85% 15%,rgba(94,140,255,.2),transparent 32%),linear-gradient(145deg,#09050f,#1a0b25 50%,#090711);overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.2;background:repeating-linear-gradient(120deg,transparent 0 34px,rgba(255,255,255,.035) 35px 36px)}.wrap{position:relative;max-width:860px;margin:auto;padding:24px 18px 40px}.top{text-align:center}.top:before{content:"LAST WORD STANDING";display:inline-block;padding:6px 12px;border-radius:999px;color:#ff8fba;border:1px solid rgba(255,77,141,.35);background:rgba(255,77,141,.07);font-size:.72rem;font-weight:900;letter-spacing:.17em}h1{font-size:clamp(2rem,7vw,3.8rem);margin:12px 0 18px;letter-spacing:-.04em;text-shadow:0 0 34px rgba(166,108,255,.3)}.card{position:relative;background:linear-gradient(145deg,rgba(35,20,49,.94),rgba(17,11,28,.91));border:1px solid var(--line);border-radius:28px;padding:24px;margin-bottom:18px;box-shadow:0 28px 70px rgba(0,0,0,.42),inset 0 1px rgba(255,255,255,.06);backdrop-filter:blur(18px);overflow:hidden}.card:before{content:"";position:absolute;top:0;left:8%;right:8%;height:3px;background:linear-gradient(90deg,transparent,var(--pink),var(--purple),var(--blue),transparent)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.grid>div{padding:13px;border-radius:18px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07)}.wide{grid-column:1/-1}label{display:block;color:var(--muted);font-size:.82rem;font-weight:850;margin-bottom:7px}input,select,textarea,button{width:100%;min-height:50px;border-radius:15px;border:1px solid rgba(255,255,255,.12);background:rgba(6,5,12,.72);color:#fff;padding:12px 14px;font-size:1rem;outline:none;transition:.2s}input:focus,select:focus,textarea:focus{border-color:var(--pink);box-shadow:0 0 0 4px rgba(255,77,141,.12)}button{border:0;cursor:pointer;font-weight:900;letter-spacing:.02em;box-shadow:0 8px 24px rgba(0,0,0,.22);transition:.18s}button:active{transform:translateY(2px) scale(.99)}.primary{background:linear-gradient(135deg,var(--pink),var(--purple));color:#180716}.danger{background:linear-gradient(135deg,#ff7b85,var(--danger));color:#260508}.ghost{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)}.hidden{display:none!important}.center{text-align:center}.muted{color:var(--muted)}.topic{font-size:clamp(2.4rem,9vw,5rem);font-weight:1000;line-height:1.08;letter-spacing:-.055em;margin:10px 0;background:linear-gradient(180deg,#fff,#ffb8d5);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 8px 24px rgba(255,77,141,.18))}#limitView{display:inline-flex;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09)}#player{font-size:clamp(1.45rem,6vw,2.6rem);margin-top:18px;background:none;color:#fff;filter:none}.ring{--p:100%;position:relative;width:250px;height:250px;border-radius:50%;margin:24px auto;display:grid;place-items:center;background:conic-gradient(var(--pink) var(--p),rgba(255,255,255,.08) 0);box-shadow:0 0 65px rgba(166,108,255,.24);transition:.15s}.ring:before{content:"";position:absolute;inset:13px;border-radius:50%;background:radial-gradient(circle,#24122f 0%,#110b1b 70%);border:1px solid rgba(255,255,255,.09)}.ring:after{content:"TIME";position:absolute;top:66px;color:var(--muted);font-size:.72rem;font-weight:900;letter-spacing:.2em}.big{position:relative;z-index:2;font-size:clamp(4.2rem,17vw,7.6rem);font-weight:1000;line-height:1;text-shadow:0 0 34px rgba(255,77,141,.36)}.players{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:24px 0}.pill{padding:10px 15px;border-radius:999px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.1);color:var(--muted);font-weight:850;transition:.18s}.active{background:linear-gradient(135deg,var(--pink),var(--purple));color:#170814;transform:translateY(-3px) scale(1.07);box-shadow:0 10px 26px rgba(255,77,141,.3)}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.wide{grid-column:1/-1}.result-icon{font-size:5rem;animation:shake .75s ease both}.result-title{font-size:clamp(2.6rem,11vw,5.5rem);font-weight:1000;color:#ff7081;margin:6px 0;text-shadow:0 0 35px rgba(255,85,102,.35)}#loser{font-size:clamp(1.8rem,7vw,3.4rem)}@keyframes shake{0%{transform:scale(.5);opacity:0}45%{transform:scale(1.15) rotate(-7deg)}65%{transform:rotate(7deg)}100%{transform:scale(1)}}@media(max-width:560px){.wrap{padding:14px 12px}.card{padding:18px;border-radius:23px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.ring{width:215px;height:215px}.ring:after{top:55px}.actions{grid-template-columns:1fr}}
</style>
</head>
<body><div class="wrap"><div class="top"><h1>🔗 詞語接龍</h1></div>
<section id="setup" class="card"><div class="grid"><div><label>玩家人數</label><input id="count" type="number" min="2" max="12" value="3"></div><div><label>倒數秒數</label><input id="seconds" type="number" min="3" max="60" value="10"></div><div><label>字數限制</label><select id="limit"><option>不限</option><option>2 個字</option><option>3 個字</option><option>4 個字</option><option>5 個字</option><option>2～5 個字</option></select></div><div><label>題目</label><select id="topic"></select></div><div class="wide"><label>自訂題目（選擇自訂時使用）</label><input id="custom" placeholder="例如：台灣地名"></div><div class="wide"><label>玩家名稱（每行一位）</label><textarea id="names" rows="4" placeholder="Ricky&#10;小明&#10;小美"></textarea></div></div><button id="start" class="primary" style="margin-top:16px">開始遊戲</button></section>
<section id="game" class="card hidden center"><div class="muted">本回合題目</div><div id="topicView" class="topic"></div><div id="limitView" class="muted"></div><div id="player"></div><div id="ring" class="ring"><div id="time" class="big">10</div></div><div id="players" class="players"></div><div class="actions"><button id="pause" class="ghost">暫停</button><button id="fail" class="danger">判定失敗</button><button id="next" class="primary wide">回答成功／下一位（空白鍵）</button></div></section>
<section id="result" class="card hidden center"><div class="result-icon">💥</div><div class="result-title">時間到！</div><h2 id="loser"></h2><p id="line" class="muted"></p><div class="actions"><button id="same" class="ghost">同題再玩</button><button id="newTopic" class="primary">下一題</button><button onclick="location.reload()" class="ghost wide">修改設定</button></div></section></div>
<script>const topics=['國家名稱','台灣地名','捷運站名','世界城市','自然現象','交通工具','大學課程','大學科系','電影名稱','有數字的電影','有顏色的電影','男主角名字','女主角名字','夜市小吃','早餐店餐點','飲料名稱','水果名稱','動物名稱','職業','手機 App','冰箱裡可能有的東西','旅行會帶的東西','自訂'];const $=id=>document.getElementById(id);$('topic').innerHTML=topics.map(t=>`<option>${t}</option>`).join('');let players=[],pi=0,duration=10,end=0,raf=0,running=false,paused=false,remaining=0;function renderPlayers(){$('player').textContent='目前玩家：'+players[pi];$('players').innerHTML=players.map((p,i)=>`<span class="pill ${i===pi?'active':''}">${p}</span>`).join('')}function tick(now){if(!running||paused)return;remaining=Math.max(0,end-now);$('time').textContent=Math.ceil(remaining/1000);$('ring').style.setProperty('--p',`${remaining/(duration*1000)*100}%`);if(remaining<=0)return lose();raf=requestAnimationFrame(tick)}function resetTimer(){cancelAnimationFrame(raf);end=performance.now()+duration*1000;running=true;paused=false;raf=requestAnimationFrame(tick)}function start(){duration=Math.max(3,Math.min(60,+$('seconds').value));const n=Math.max(2,Math.min(12,+$('count').value));let ns=$('names').value.split('\n').map(x=>x.trim()).filter(Boolean);players=Array.from({length:n},(_,i)=>ns[i]||`玩家 ${i+1}`);pi=0;localStorage.wordSettings=JSON.stringify({count:n,seconds:duration,limit:$('limit').value,topic:$('topic').value,custom:$('custom').value,names:$('names').value});$('topicView').textContent=$('topic').value==='自訂'?($('custom').value.trim()||'自訂題目'):$('topic').value;$('limitView').textContent='字數：'+$('limit').value;$('setup').classList.add('hidden');$('game').classList.remove('hidden');renderPlayers();resetTimer()}function next(){if(!running||paused)return;pi=(pi+1)%players.length;renderPlayers();resetTimer()}function lose(){running=false;cancelAnimationFrame(raf);$('game').classList.add('hidden');$('result').classList.remove('hidden');$('loser').textContent=players[pi]+' 輸了 😆';$('line').textContent=['腦袋暫時塞車了！','被倒數追上了！','這一題光榮出局！'][Math.floor(Math.random()*3)]}$('start').onclick=start;$('next').onclick=next;$('fail').onclick=lose;$('pause').onclick=()=>{if(!running)return;paused=!paused;$('pause').textContent=paused?'繼續':'暫停';if(!paused){end=performance.now()+remaining;raf=requestAnimationFrame(tick)}};$('same').onclick=()=>{$('result').classList.add('hidden');$('game').classList.remove('hidden');resetTimer()};$('newTopic').onclick=()=>{$('topicView').textContent=topics[Math.floor(Math.random()*(topics.length-1))];$('result').classList.add('hidden');$('game').classList.remove('hidden');pi=(pi+1)%players.length;renderPlayers();resetTimer()};try{const s=JSON.parse(localStorage.wordSettings||'{}');for(const k of ['count','seconds','limit','topic','custom','names'])if(s[k]!=null)$(k).value=s[k]}catch(e){}addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&!['INPUT','TEXTAREA','SELECT','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();next()}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&running&&!paused)$('pause').click()});</script></body></html>
