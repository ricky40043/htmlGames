<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0d0d14">
  <title>🐍 經典貪吃蛇</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <a class="back-btn" href="../index.html">← 返回</a>
  <h1>🐍 貪吃蛇</h1>

  <div class="stats-container">
    <div class="stat-box">
      <span class="stat-label">Score</span>
      <span class="stat-value" id="current-score">0</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">Best</span>
      <span class="stat-value" id="high-score">0</span>
    </div>
  </div>

  <div class="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div class="overlay" id="overlay">
      <div class="overlay-title">GAME OVER</div>
      <div class="overlay-score">你的分數：<span id="final-score">0</span></div>
      <button class="btn-restart" onclick="showMenu()">返回選單</button>
    </div>

    <!-- START MENU -->
    <div class="overlay visible" id="start-overlay">
      <div class="overlay-title" style="color: #4ade80; font-size: 2rem; margin-bottom: 20px;">遊戲設定</div>
      
      <!-- Speed Slider -->
      <div class="slider-group">
        <div class="slider-header">
          <span class="slider-label">速度</span>
          <span class="slider-value" id="speed-display">慢</span>
        </div>
        <input type="range" id="speed-slider" class="custom-slider"
          min="50" max="400" step="10" value="100"
          oninput="onSpeedSlider(this.value)">
        <div class="slider-ticks">
          <span>慢</span><span>快</span>
        </div>
      </div>

      <!-- Size Slider -->
      <div class="slider-group" style="margin-top: 20px;">
        <div class="slider-header">
          <span class="slider-label">地圖大小</span>
          <span class="slider-value" id="size-display">20 × 20</span>
        </div>
        <input type="range" id="size-slider" class="custom-slider"
          min="10" max="50" step="5" value="20"
          oninput="onSizeSlider(this.value)">
        <div class="slider-ticks">
          <span>小</span><span>大</span>
        </div>
      </div>

      <button class="btn-restart" onclick="initGame()" style="margin-top: 28px;">開始遊戲</button>
    </div>
  </div>

  <div class="controls">
    <div class="ctrl-btn up" onclick="changeDirection(0, -1)">▲</div>
    <div class="ctrl-btn left" onclick="changeDirection(-1, 0)">◀</div>
    <div class="ctrl-btn down" onclick="changeDirection(0, 1)">▼</div>
    <div class="ctrl-btn right" onclick="changeDirection(1, 0)">▶</div>
  </div>

  <script src="script.js"></script>
<script src="/stats.js"></script>
</body>
</html>
